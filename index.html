<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PulseNews — Live World & India News, AI Summary & Audio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --surface-2: #f1f5f9;
      --surface-3: #e2e8f0;
      --text-main: #0f172a;
      --text-body: #334155;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-soft: rgba(37, 99, 235, 0.1);
      --ai-accent: #7c3aed;
      --ai-soft: rgba(124, 58, 237, 0.08);
      --ai-border: rgba(124, 58, 237, 0.25);
      --save-accent: #d97706;
      --save-soft: rgba(217, 119, 6, 0.12);
      --danger: #ef4444;
      --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.05);
      --shadow-md: 0 8px 24px rgba(15, 23, 42, 0.07);
      --radius: 12px;
    }

    body.dark {
      --bg: #090d16;
      --surface: #111827;
      --surface-2: #1e293b;
      --surface-3: #334155;
      --text-main: #f8fafc;
      --text-body: #cbd5e1;
      --text-muted: #94a3b8;
      --border: #1f2937;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --primary-soft: rgba(59, 130, 246, 0.15);
      --ai-accent: #a78bfa;
      --ai-soft: rgba(167, 139, 250, 0.12);
      --ai-border: rgba(167, 139, 250, 0.3);
      --save-accent: #fbbf24;
      --save-soft: rgba(251, 191, 36, 0.15);
      --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 10px 30px rgba(0, 0, 0, 0.45);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      color: var(--text-body);
      line-height: 1.5;
      padding-bottom: 70px;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .icon {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      flex-shrink: 0;
    }

    .icon-fill {
      fill: currentColor;
    }

    /* Top Navbar */
    .navbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
      padding: 12px 16px;
    }

    .nav-container {
      max-width: 1180px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }

    .brand-logo {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      background: var(--primary);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1rem;
    }

    .brand-text h1 {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      background: #10b981;
      border-radius: 50%;
      display: inline-block;
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2);
    }

    .brand-text p {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nav-tab {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 13px;
      border-radius: 9px;
      font-size: 0.82rem;
      font-weight: 600;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text-body);
      cursor: pointer;
      transition: all 0.18s ease;
    }

    .nav-tab:hover {
      border-color: var(--primary);
      color: var(--text-main);
    }

    .nav-tab.active {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }

    .badge-count {
      background: rgba(0, 0, 0, 0.15);
      color: inherit;
      font-size: 0.72rem;
      padding: 1px 6px;
      border-radius: 99px;
      font-weight: 700;
    }

    .nav-tab:not(.active) .badge-count {
      background: var(--surface-3);
      color: var(--text-main);
    }

    .btn-icon {
      padding: 8px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text-main);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.18s ease;
    }

    .btn-icon:hover {
      border-color: var(--primary);
    }

    /* Main Container */
    .container {
      max-width: 1180px;
      margin: 16px auto 0 auto;
      padding: 0 14px;
    }

    /* Audio & AI Bar */
    .audio-studio {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      margin-bottom: 16px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .studio-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .studio-status {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      min-width: 220px;
    }

    .eq-bars {
      display: inline-flex;
      align-items: flex-end;
      gap: 2px;
      height: 16px;
      padding: 0 2px;
    }

    .eq-bar {
      width: 3px;
      height: 4px;
      background: var(--primary);
      border-radius: 2px;
      transition: height 0.15s ease;
    }

    .eq-bars.playing .eq-bar:nth-child(1) { animation: eqAnim 0.6s infinite ease-in-out; }
    .eq-bars.playing .eq-bar:nth-child(2) { animation: eqAnim 0.6s infinite ease-in-out 0.15s; }
    .eq-bars.playing .eq-bar:nth-child(3) { animation: eqAnim 0.6s infinite ease-in-out 0.3s; }
    .eq-bars.playing .eq-bar:nth-child(4) { animation: eqAnim 0.6s infinite ease-in-out 0.1s; }

    @keyframes eqAnim {
      0%, 100% { height: 4px; }
      50% { height: 16px; }
    }

    .status-label {
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 420px;
    }

    .studio-buttons {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 13px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text-main);
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
    }

    .btn:hover:not(:disabled) {
      border-color: var(--primary);
    }

    .btn:active:not(:disabled) {
      transform: scale(0.97);
    }

    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--primary-hover);
    }

    .btn-ai {
      background: var(--ai-soft);
      color: var(--ai-accent);
      border-color: var(--ai-border);
    }

    .btn-ai:hover:not(:disabled) {
      background: var(--ai-accent);
      color: #ffffff;
    }

    .btn-danger {
      background: rgba(239, 68, 68, 0.12);
      color: var(--danger);
      border-color: rgba(239, 68, 68, 0.25);
    }

    .btn-danger:hover:not(:disabled) {
      background: var(--danger);
      color: #ffffff;
    }

    .studio-bottom {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      padding-top: 10px;
      border-top: 1px solid var(--border);
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .select-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .select-box {
      padding: 5px 8px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text-main);
      font-size: 0.78rem;
      outline: none;
      max-width: 210px;
    }

    /* Global AI Executive Briefing Box */
    .ai-brief-panel {
      display: none;
      background: var(--surface);
      border: 1px solid var(--ai-border);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: var(--shadow-md);
      animation: fadeSlide 0.25s ease;
    }

    .ai-brief-panel.open {
      display: block;
    }

    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .ai-brief-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      padding-bottom: 10px;
      margin-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .ai-brief-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--ai-accent);
    }

    .ai-brief-content {
      font-size: 0.85rem;
      color: var(--text-body);
      line-height: 1.6;
    }

    .ai-brief-content p {
      color: var(--text-main);
      font-weight: 500;
      margin-bottom: 10px;
    }

    .ai-brief-content ul {
      padding-left: 18px;
      display: grid;
      gap: 6px;
    }

    /* Filter & Channel Deck */
    .filter-deck {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      margin-bottom: 18px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .filter-deck.hidden {
      display: none;
    }

    .filter-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .row-label {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
      min-width: 68px;
      flex-shrink: 0;
    }

    .pill-strip {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
      padding: 2px 0;
      flex: 1;
    }

    .pill-strip::-webkit-scrollbar {
      display: none;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 99px;
      font-size: 0.78rem;
      font-weight: 600;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text-body);
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      transition: all 0.15s ease;
    }

    .pill:hover {
      border-color: var(--primary);
      color: var(--text-main);
    }

    .pill.active {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }

    .ch-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .search-row {
      display: flex;
      gap: 8px;
      padding-top: 4px;
    }

    .search-input-wrap {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-input-wrap .icon {
      position: absolute;
      left: 12px;
      color: var(--text-muted);
    }

    .search-input-wrap input {
      width: 100%;
      padding: 9px 12px 9px 36px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text-main);
      font-size: 0.85rem;
      outline: none;
    }

    .search-input-wrap input:focus {
      border-color: var(--primary);
      background: var(--surface);
    }

    /* Bookmarks Header Banner */
    .bookmarks-header {
      display: none;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 18px;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      box-shadow: var(--shadow-sm);
    }

    .bookmarks-header.open {
      display: flex;
    }

    .bm-title-wrap h2 {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .bm-title-wrap p {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .bm-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    /* News Grid & Cards */
    .news-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
      gap: 18px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow-sm);
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }

    .card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-md);
      border-color: var(--surface-3);
    }

    .card.speaking {
      border: 2px solid var(--primary);
      box-shadow: 0 0 0 4px var(--primary-soft);
    }

    .card-img-box {
      width: 100%;
      height: 175px;
      background: var(--surface-2);
      position: relative;
      overflow: hidden;
    }

    .card-img-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.35s ease;
    }

    .card:hover .card-img-box img {
      transform: scale(1.03);
    }

    .source-badge {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(15, 23, 42, 0.82);
      backdrop-filter: blur(6px);
      color: #ffffff;
      font-size: 0.7rem;
      font-weight: 600;
      padding: 4px 9px;
      border-radius: 6px;
      max-width: 70%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .top-save-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .top-save-btn:hover {
      transform: scale(1.06);
    }

    .top-save-btn.saved {
      background: var(--save-accent);
      color: #090d16;
      border-color: var(--save-accent);
    }

    .card-body {
      padding: 15px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .card-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.73rem;
      color: var(--text-muted);
      margin-bottom: 6px;
      font-weight: 600;
    }

    .card-title {
      font-size: 0.96rem;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.4;
      margin-bottom: 8px;
    }

    .card-desc {
      font-size: 0.83rem;
      color: var(--text-body);
      line-height: 1.5;
      margin-bottom: 12px;
      flex: 1;
    }

    /* Per-Card AI Summary Box */
    .card-ai-box {
      display: none;
      background: var(--ai-soft);
      border: 1px solid var(--ai-border);
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 12px;
      font-size: 0.8rem;
      color: var(--text-main);
      animation: fadeSlide 0.2s ease;
    }

    .card-ai-box.open {
      display: block;
    }

    .card-ai-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--ai-accent);
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .card-ai-box ul {
      padding-left: 16px;
      display: grid;
      gap: 4px;
      color: var(--text-body);
    }

    .card-footer {
      border-top: 1px solid var(--border);
      padding-top: 11px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .card-btns {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .btn-card {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text-main);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn-card:hover {
      border-color: var(--primary);
    }

    .btn-card-ai {
      background: var(--ai-soft);
      color: var(--ai-accent);
      border-color: var(--ai-border);
    }

    .btn-card-save.saved {
      background: var(--save-soft);
      color: var(--save-accent);
      border-color: var(--save-accent);
    }

    .card.speaking .btn-card-listen {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }

    .read-link {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--primary);
      text-decoration: none;
      white-space: nowrap;
    }

    .read-link:hover {
      text-decoration: underline;
    }

    /* Empty State & Skeleton */
    .empty-box {
      grid-column: 1 / -1;
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      padding: 48px 20px;
      text-align: center;
    }

    .empty-box h3 {
      color: var(--text-main);
      font-size: 1rem;
      margin-bottom: 6px;
    }

    .empty-box p {
      color: var(--text-muted);
      font-size: 0.85rem;
      margin-bottom: 16px;
    }

    .skeleton {
      background: linear-gradient(90deg, var(--surface-2) 25%, var(--surface-3) 50%, var(--surface-2) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
    }

    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* Toast Notification */
    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 300;
      background: var(--text-main);
      color: var(--surface);
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 600;
      box-shadow: var(--shadow-md);
      opacity: 0;
      transform: translateY(10px);
      pointer-events: none;
      transition: all 0.2s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 600px) {
      .row-label { min-width: 55px; font-size: 0.68rem; }
      .status-label { max-width: 220px; }
    }
  </style>
</head>
<body class="dark">

  <!-- Sticky Top Navbar with Bookmarks Button -->
  <nav class="navbar">
    <div class="nav-container">
      <div class="brand" onclick="switchTab('feed')">
        <div class="brand-logo">P</div>
        <div class="brand-text">
          <h1>PulseNews <span class="live-dot" title="Live Feed Active"></span></h1>
          <p>World & India Channels • AI Summarizer</p>
        </div>
      </div>

      <div class="nav-actions">
        <button class="nav-tab active" id="tabFeedBtn" onclick="switchTab('feed')">
          <svg class="icon" viewBox="0 0 24 24"><path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-2 2Zm0 0a2 2 0 0 1-2-2v-9c0-1.1.9-2 2-2h2"/></svg>
          <span>Live Feed</span>
        </button>

        <button class="nav-tab" id="tabBookmarksBtn" onclick="switchTab('bookmarks')">
          <svg class="icon" id="navBookmarkIcon" viewBox="0 0 24 24"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/></svg>
          <span>Bookmarks</span>
          <span class="badge-count" id="bookmarkCountBadge">0</span>
        </button>

        <button class="btn-icon" onclick="fetchNews()" title="Refresh Live News">

  // Theme Init

  if (localStorage.getItem('pulseTheme') === 'light') {
    document.body.classList.remove('dark');
  }

    const isDark = document.body.classList.contains('dark');
    document.getElementById('themeBtn').innerHTML = isDark ? SUN_ICON : MOON_ICON;

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.innerText = msg;
    t.classList.add('show');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
  }

  // Helper: Get active displayed articles
  function getDisplayedArticles() {
    return currentTab === 'bookmarks' ? bookmarks : liveArticles;
  }

  // Bookmarks Logic
  function getArticleId(art) {
    return cleanText(art?.title || '').toLowerCase().slice(0, 90);
  }

  function isBookmarked(art) {
    const id = getArticleId(art);
    return bookmarks.some(b => getArticleId(b) === id);
  }

  function saveBookmarksToStorage() {
    try {
      localStorage.setItem('pulseBookmarksData', JSON.stringify(bookmarks));
    } catch (e) {}
    updateBookmarkBadge();
  }

  function updateBookmarkBadge() {
    document.getElementById('bookmarkCountBadge').innerText = bookmarks.length;
    const navIcon = document.getElementById('navBookmarkIcon');
    if (bookmarks.length > 0) navIcon.classList.add('icon-fill');
    else navIcon.classList.remove('icon-fill');

    const sub = document.getElementById('bookmarksSubtext');
    if (sub) {
      sub.innerText = `${bookmarks.length} saved ${bookmarks.length === 1 ? 'article' : 'articles'} stored on your device`;
    }
    const clearBtn = document.getElementById('clearAllBmBtn');
    if (clearBtn) clearBtn.disabled = bookmarks.length === 0;
  }

  function toggleBookmark(idx) {
    const list = getDisplayedArticles();
    const art = list[idx];
    if (!art) return;

    const id = getArticleId(art);
    const existingIndex = bookmarks.findIndex(b => getArticleId(b) === id);

    if (existingIndex > -1) {
      bookmarks.splice(existingIndex, 1);
      saveBookmarksToStorage();
      showToast('Removed from Bookmarks');

      if (currentTab === 'bookmarks') {
        stopAudio();
        renderCards();
        return;
      }
    } else {
      bookmarks.unshift({
        source: { name: art.source?.name || activeChannel.name },
        title: cleanText(art.title),
        description: cleanText(art.description),
        url: art.url || '#',
        urlToImage: art.urlToImage || FALLBACK_IMAGES[idx % FALLBACK_IMAGES.length],
        publishedAt: art.publishedAt || new Date().toISOString()
      });
      saveBookmarksToStorage();
      showToast('Saved to Bookmarks');
    }

    // Update buttons on that card immediately
    const nowSaved = isBookmarked(art);
    const topBtn = document.getElementById(`top-save-${idx}`);
    const footBtn = document.getElementById(`foot-save-${idx}`);
    if (topBtn) {
      topBtn.className = `top-save-btn ${nowSaved ? 'saved' : ''}`;
      topBtn.innerHTML = `<svg class="icon ${nowSaved ? 'icon-fill' : ''}" viewBox="0 0 24 24"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/></svg>`;
    }

      footBtn.className = `btn-card btn-card-save ${nowSaved ? 'saved' : ''}`;

        <span>${nowSaved ? 'Saved' : 'Save'}</span>
      `;
    }
  }

  // Text Helpers
  function escapeHTML(str) {
    if (!str) return '';
    return str.replace(/[&<>"']/g, m => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[m]));
  }

  function cleanText(txt) {
    if (!txt) return '';
    return txt
      .replace(/<!\[CDATA\[([\s\S]*?)\]\]>/gi, '$1')
      .replace(/<[^>]*>/g, ' ')
      .replace(/&nbsp;/gi, ' ')
      .replace(/&amp;/gi, '&')
      .replace(/&quot;/gi, '"')
      .replace(/&#39;/gi, "'")
      .replace(/https?:\/\/\S+/gi, '')
      .replace(/\[\+\d+\s+chars\]/gi, '')
      .replace(/\s+/g, ' ')
      .trim();
  }

  function formatTime(dateStr) {
    if (!dateStr) return 'Live';
    const d = new Date(dateStr);
    if (isNaN(d.getTime())) return 'Live';
    const mins = Math.floor((Date.now() - d.getTime()) / 60000);
    if (mins < 60) return `${Math.max(1, mins)}m ago`;
    const hrs = Math.floor(mins / 60);
    if (hrs < 24) return `${hrs}h ago`;
    return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  }

  // Instant AI Summarizer Engine
  function generateSmartAISummary(art) {
    const rawTitle = cleanText(art.title).replace(/\s+-\s+[^-]+$/, '');
    const rawDesc = cleanText(art.description || '');
    const source = art.source?.name || activeChannel.name;

    const sentences = rawDesc
      .split(/(?<=[.!?])\s+/)
      .map(s => s.trim())
      .filter(s => s.length > 20 && s.toLowerCase() !== rawTitle.toLowerCase());

    const bullet1 = rawTitle;
    const bullet2 = sentences[0] || `Developing coverage reported by ${source} news desk.`;
    const bullet3 = sentences[1] || `Full report and live updates available via ${source}.`;

    return {
      bullets: [bullet1, bullet2, bullet3],
      speech: `AI Summary: ${bullet1}. ${bullet2}`
    };
  }

  function toggleCardAI(idx) {
    const box = document.getElementById(`ai-box-${idx}`);
    const body = document.getElementById(`ai-body-${idx}`);
    const list = getDisplayedArticles();

    if (!box || !art) return;

    if (box.classList.contains('open')) {
      box.classList.remove('open');
      return;

    box.classList.add('open');
    body.innerHTML = `<span style="color:var(--text-muted);">Generating AI summary...</span>`;

    setTimeout(() => {
      const summary = generateSmartAISummary(art);
      body.innerHTML = `<ul>${summary.bullets.map(b => `<li>${escapeHTML(b)}</li>`).join('')}</ul>`;
    }, 220);
  }

    const summary = generateSmartAISummary(art);

      status: `AI Summary: ${cleanText(art.title)}`,
      articleIndex: idx

    const list = getDisplayedArticles();

    const heading = document.getElementById('aiBriefHeading');

    const label = currentTab === 'bookmarks' ? 'Saved Bookmarks' : activeChannel.name;
    panel.classList.add('open');
    heading.innerText = `AI Executive Summary • ${label}`;
    body.innerHTML = `<p>Synthesizing top stories from ${escapeHTML(label)}...</p>`;

    const top5 = list.slice(0, 5);
    setTimeout(() => {
      const itemsHTML = top5.map(art => {
        const s = generateSmartAISummary(art);
        return `<li><strong>${escapeHTML(s.bullets[0])}:</strong> ${escapeHTML(s.bullets[1])}</li>`;
      }).join('');

      body.innerHTML = `
        <p>Key takeaways from the top ${top5.length} stories on ${escapeHTML(label)}:</p>
        <ul>${itemsHTML}</ul>

        top5.map((art, i) => `Story ${i + 1}: ${generateSmartAISummary(art).speech}`).join(' ');
    }, 280);
  }

  function loadVoices() {
    if (!synth) return;

    const selectEl = document.getElementById('voiceSelect');
    selectEl.innerHTML = '';

    const preferred = ['en-IN', 'India', 'Google', 'Natural', 'Online', 'Siri', 'Samantha'];
    englishVoices.sort((a, b) => {
      const aScore = preferred.some(k => a.name.includes(k) || a.lang.includes(k)) ? 1 : 0;
      const bScore = preferred.some(k => b.name.includes(k) || b.lang.includes(k)) ? 1 : 0;
      return bScore - aScore;
    });

    englishVoices.forEach((voice, i) => {
      const opt = document.createElement('option');
      opt.value = i;
      opt.textContent = `${voice.name} (${voice.lang})`;
      selectEl.appendChild(opt);
    });

    selectedVoice = englishVoices[0];
    selectEl.value = 0;
    selectEl.onchange = (e) => {
      selectedVoice = englishVoices[e.target.value];
    };
  }

  loadVoices();
  if (speechSynthesis.onvoiceschanged !== undefined) {
    speechSynthesis.onvoiceschanged = loadVoices;
  }

  function highlightSpeakingCard(idx) {
    activeSpeakingIdx = idx;
    document.querySelectorAll('.card').forEach((card, i) => {
      const btn = card.querySelector('.btn-card-listen');
      if (i === idx) {
        card.classList.add('speaking');
        if (btn) btn.innerText = 'Stop';
        card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      } else {
        card.classList.remove('speaking');
        if (btn) btn.innerText = 'Listen';
      }
    });
  }

  function setStudioControls(playing, hasNext) {
    document.getElementById('pauseBtn').disabled = !playing;
    document.getElementById('nextBtn').disabled = !hasNext;
    const eq = document.getElementById('eqBars');
    if (playing) eq.classList.add('playing');
    else {
      eq.classList.remove('playing');
      document.getElementById('pauseBtn').innerText = 'Pause';
    }
  }

  function playQueue(items) {
    if (!('speechSynthesis' in window)) {
      alert("Speech playback is not supported on this browser.");
      return;
    }
    stopAudio(false);
    isCancelled = false;
    audioQueue = items;
    currentQueuePos = 0;
    playNextInQueue();
  }

  function playNextInQueue() {
    if (isCancelled || currentQueuePos < 0 || currentQueuePos >= audioQueue.length) {
      stopAudio(true);
      return;
    }

    const item = audioQueue[currentQueuePos];
    const utterance = new SpeechSynthesisUtterance(item.text);

    if (selectedVoice) {
      utterance.voice = selectedVoice;
      utterance.lang = selectedVoice.lang;
    } else {
      utterance.lang = 'en-IN';
    }

    utterance.rate = parseFloat(document.getElementById('speedSelect').value) || 1.0;

    utterance.onstart = () => {
      document.getElementById('audioStatus').innerText = item.status || 'Playing...';
      highlightSpeakingCard(item.articleIndex);
      setStudioControls(true, currentQueuePos < audioQueue.length - 1);
    };

    utterance.onend = () => {
      if (isCancelled) return;
      currentQueuePos++;
      if (currentQueuePos < audioQueue.length) playNextInQueue();
      else stopAudio(true);
    };

    utterance.onerror = () => {
      if (!isCancelled) stopAudio(true);
    };

    synth.speak(utterance);
  }

  function stopAudio(resetText = true) {
    isCancelled = true;
    audioQueue = [];
    currentQueuePos = -1;
    if (synth) synth.cancel();
    highlightSpeakingCard(null);
    setStudioControls(false, false);
    if (resetText) {
      document.getElementById('audioStatus').innerText = 'Audio Anchor Ready';
    }
  }

  function togglePause() {
    if (!synth) return;
    const pauseBtn = document.getElementById('pauseBtn');
    const eq = document.getElementById('eqBars');
    if (synth.paused) {
      synth.resume();
      pauseBtn.innerText = 'Pause';
      eq.classList.add('playing');
    } else if (synth.speaking) {
      synth.pause();
      pauseBtn.innerText = 'Resume';
      eq.classList.remove('playing');
    }
  }

  function skipNext() {
    if (currentQueuePos < audioQueue.length - 1) {
      isCancelled = true;
      synth.cancel();
      isCancelled = false;
      currentQueuePos++;
      playNextInQueue();
    }
  }

  function readAllTopNews() {
    const list = getDisplayedArticles();
    if (!list.length) return;

    const subset = list.slice(0, 5);
    const label = currentTab === 'bookmarks' ? 'Saved Bookmarks' : activeChannel.name;
    const queue = [{
      text: `Here are the top ${subset.length} stories from ${label}.`,
      status: `Starting ${label} Brief...`,
      articleIndex: null
    }];

    subset.forEach((art, idx) => {
      const s = generateSmartAISummary(art);
      queue.push({
        text: `Headline ${idx + 1}: ${s.speech}`,
        status: `(${idx + 1}/${subset.length}) ${cleanText(art.title)}`,
        articleIndex: idx
      });
    });

    queue.push({
      text: 'End of news briefing.',
      status: 'Briefing Complete',
      articleIndex: null
    });

    playQueue(queue);
  }

  function readSingleArticle(idx) {
    if (activeSpeakingIdx === idx) {
      stopAudio();
      return;
    }
    const list = getDisplayedArticles();
    const art = list[idx];
    if (!art) return;
    const title = cleanText(art.title);
    const desc = cleanText(art.description);
    playQueue([{
      text: `${title}. ${desc}`,
      status: title,
      articleIndex: idx
    }]);
  }

  // Country & Channel Strip Rendering
  function renderCountryStrip() {
    const strip = document.getElementById('countryStrip');
    strip.innerHTML = '';
    COUNTRIES.forEach(c => {
      const btn = document.createElement('button');
      btn.className = `pill ${c.code === activeCountry.code ? 'active' : ''}`;
      btn.textContent = c.name;
      btn.onclick = () => {
        activeCountry = c;
        activeChannel = c.channels[0];
        document.getElementById('searchInput').value = '';
        document.getElementById('aiBriefPanel').classList.remove('open');
        renderCountryStrip();
        renderChannelStrip();
        fetchNews();
      };
      strip.appendChild(btn);
    });
  }

  function renderChannelStrip() {
    const strip = document.getElementById('channelStrip');
    strip.innerHTML = '';
    activeCountry.channels.forEach(ch => {
      const btn = document.createElement('button');
      btn.className = `pill ${ch.id === activeChannel.id ? 'active' : ''}`;
      btn.innerHTML = `<span class="ch-dot" style="background:${ch.color}"></span><span>${ch.name}</span>`;
      btn.onclick = () => {
        activeChannel = ch;
        document.getElementById('searchInput').value = '';
        document.getElementById('aiBriefPanel').classList.remove('open');
        renderChannelStrip();
        fetchNews();
      };
      strip.appendChild(btn);
    });
  }

  function showSkeletons() {
    const grid = document.getElementById('newsGrid');
    grid.innerHTML = Array.from({ length: 6 }).map(() => `
      <div class="card">
        <div class="card-img-box skeleton"></div>
        <div class="card-body">
          <div class="skeleton" style="height:12px;width:35%;border-radius:4px;margin-bottom:10px;"></div>
          <div class="skeleton" style="height:18px;width:95%;border-radius:4px;margin-bottom:8px;"></div>
          <div class="skeleton" style="height:18px;width:75%;border-radius:4px;margin-bottom:14px;"></div>
          <div class="skeleton" style="height:45px;width:100%;border-radius:4px;"></div>
        </div>
      </div>
    `).join('');
  }

  function renderCards() {
    const grid = document.getElementById('newsGrid');
    grid.innerHTML = '';

    const list = getDisplayedArticles();

    if (currentTab === 'bookmarks' && list.length === 0) {
      grid.innerHTML = `
        <div class="empty-box">
          <h3>No Bookmarks Saved Yet</h3>
          <p>Tap the <strong>Save</strong> button on any news card to bookmark articles here for later reading or audio playback.</p>
          <button class="btn btn-primary" onclick="switchTab('feed')">Browse Live News</button>
        </div>
      `;
      return;
    }

    if (list.length === 0) {
      grid.innerHTML = `
        <div class="empty-box">
          <h3>No articles found</h3>
          <p>Try selecting another channel or refreshing the feed.</p>
          <button class="btn btn-primary" onclick="fetchNews()">Retry</button>
        </div>
      `;
      return;
    }

    list.forEach((art, idx) => {
      const sourceName = escapeHTML(art.source?.name || activeChannel.name);
      const timeStr = formatTime(art.publishedAt);
      const title = escapeHTML(cleanText(art.title));
      const rawDesc = cleanText(art.description);
      const desc = escapeHTML(rawDesc && rawDesc !== cleanText(art.title) ? rawDesc : `Click Read to view the full story from ${art.source?.name || activeChannel.name}.`);
      const fallbackImg = FALLBACK_IMAGES[idx % FALLBACK_IMAGES.length];
      const imgUrl = art.urlToImage || fallbackImg;
      const saved = isBookmarked(art);

      const card = document.createElement('div');
      card.className = `card ${activeSpeakingIdx === idx ? 'speaking' : ''}`;
      card.innerHTML = `
        <div class="card-img-box">
          <span class="source-badge">${sourceName}</span>
          <button class="top-save-btn ${saved ? 'saved' : ''}" id="top-save-${idx}" onclick="toggleBookmark(${idx})" title="Save Bookmark">
            <svg class="icon ${saved ? 'icon-fill' : ''}" viewBox="0 0 24 24"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/></svg>
          </button>
          <img src="${escapeHTML(imgUrl)}" alt="" loading="lazy" onerror="this.src='${fallbackImg}'">
        </div>

        <div class="card-body">
          <div class="card-meta">
            <span>${sourceName}</span>
            <span>${timeStr}</span>
          </div>
          <h2 class="card-title">${title}</h2>
          <p class="card-desc">${desc}</p>

          <!-- Collapsible AI Summary Box -->
          <div class="card-ai-box" id="ai-box-${idx}">
            <div class="card-ai-top">
              <span>✨ AI Key Takeaways</span>
              <button class="btn-card" style="padding:2px 7px;font-size:0.68rem;" onclick="speakCardAI(${idx})">Speak</button>
            </div>
            <div id="ai-body-${idx}"></div>
          </div>

          <div class="card-footer">
            <div class="card-btns">
              <button class="btn-card btn-card-ai" onclick="toggleCardAI(${idx})">✨ AI Summary</button>
              <button class="btn-card btn-card-listen" onclick="readSingleArticle(${idx})">
                ${activeSpeakingIdx === idx ? 'Stop' : 'Listen'}
              </button>
              <button class="btn-card btn-card-save ${saved ? 'saved' : ''}" id="foot-save-${idx}" onclick="toggleBookmark(${idx})">
                <svg class="icon ${saved ? 'icon-fill' : ''}" viewBox="0 0 24 24"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/></svg>
                <span>${saved ? 'Saved' : 'Save'}</span>
              </button>
            </div>
            <a href="${escapeHTML(art.url || '#')}" class="read-link" target="_blank" rel="noopener noreferrer">Read &rarr;</a>
          </div>
        </div>
      `;
      grid.appendChild(card);
    });
  }

  // Fetch RSS via rss2json (Verified working for Indian & World feeds)
  async function fetchRSSFeed(rssUrl) {
    const url = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}`;
    const res = await fetch(url);
    const data = await res.json();
    if (data.status !== 'ok' || !Array.isArray(data.items) || data.items.length === 0) {
      throw new Error('RSS2JSON empty');
    }

    return data.items.map((item, idx) => {
      let img = item.enclosure?.link || item.thumbnail || '';
      if (!img && item.description) {
        const m = item.description.match(/<img[^>]+src=["']([^"'>]+)["']/i);
        if (m) img = m[1];
      }
      return {
        source: { name: activeChannel.name },
        title: cleanText(item.title),
        description: cleanText(item.description || item.content || ''),
        url: item.link,
        urlToImage: img || FALLBACK_IMAGES[idx % FALLBACK_IMAGES.length],
        publishedAt: item.pubDate
      };
    });
  }

  // Primary Fetcher: Combines your /api/news backend + Verified Channel RSS Feeds
  async function fetchNews(searchQuery = '') {
    if (currentTab === 'bookmarks') {
      switchTab('feed');
    }
    stopAudio();
    showSkeletons();

    // 1. If user typed a search query or category on a backend channel, try /api/news first
    if (searchQuery || activeChannel.useBackend || activeCategory !== 'all') {
      try {
        let url = `/api/news?category=${activeCategory}`;
        if (searchQuery) {
          url += `&q=${encodeURIComponent(searchQuery)}`;
        }
        const res = await fetch(url);
        const data = await res.json();
        if (data.status === 'ok' && Array.isArray(data.articles) && data.articles.length > 0) {
          const valid = data.articles.filter(a => a.title && !a.title.includes('[Removed]'));
          if (valid.length > 0 && (searchQuery || activeChannel.useBackend)) {
            liveArticles = valid;
            renderCards();
            return;
          }
        }
      } catch (e) {}
    }

    // 2. Fetch selected Country/Channel Live RSS Feed (NDTV, The Hindu, TOI, BBC, etc.)
    try {
      let rssToFetch = activeChannel.rss;
      if (searchQuery) {
        const gl = activeCountry.code === 'in' ? 'IN' : 'US';
        const hl = activeCountry.code === 'in' ? 'en-IN' : 'en-US';
        rssToFetch = `https://news.google.com/rss/search?q=${encodeURIComponent(searchQuery)}&hl=${hl}&gl=${gl}&ceid=${gl}:en`;
      } else if (activeCategory !== 'all' && activeCategory !== 'general') {
        const gl = activeCountry.code === 'in' ? 'IN' : 'US';
        const hl = activeCountry.code === 'in' ? 'en-IN' : 'en-US';
        rssToFetch = `https://news.google.com/rss/search?q=${encodeURIComponent(activeChannel.name + ' ' + activeCategory)}&hl=${hl}&gl=${gl}&ceid=${gl}:en`;
      }

      const rssArticles = await fetchRSSFeed(rssToFetch);
      if (rssArticles && rssArticles.length > 0) {
        liveArticles = rssArticles;
        renderCards();
        return;
      }
    } catch (e) {}

    // 3. Final backup: Call your original /api/news?category=... without extra params
    try {
      const res = await fetch(`/api/news?category=${activeCategory}`);
      const data = await res.json();
      if (data.status === 'ok' && Array.isArray(data.articles)) {
        liveArticles = data.articles.filter(a => a.title && !a.title.includes('[Removed]'));
        renderCards();
        return;
      }
    } catch (e) {}

    liveArticles = [];
    renderCards();
  }

  // Category Listener
  document.getElementById('categoryGroup').addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (btn) {
      document.querySelectorAll('#categoryGroup button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeCategory = btn.dataset.cat;
      document.getElementById('searchInput').value = '';
      document.getElementById('aiBriefPanel').classList.remove('open');
      fetchNews();
    }
  });

  function triggerSearch() {
    const q = document.getElementById('searchInput').value.trim();
    if (q) fetchNews(q);
  }

  document.getElementById('searchInput').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') triggerSearch();
  });

  // Initialize App
  updateBookmarkBadge();
  renderCountryStrip();
  renderChannelStrip();
  fetchNews();
</script>
