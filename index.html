<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>World & India Live News | Multi-Channel Audio Reader</title>
  <style>
    :root {
      --bg: #f1f5f9;
      --surface: #ffffff;
      --surface-subtle: #f8fafc;
      --text-main: #0f172a;
      --text-body: #334155;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --primary: #2563eb;
      --primary-soft: rgba(37, 99, 235, 0.12);
      --audio-bg: rgba(255, 255, 255, 0.95);
      --audio-border: #bfdbfe;
      --danger: #ef4444;
      --card-shadow: 0 2px 10px rgba(15, 23, 42, 0.05);
    }

    body.dark {
      --bg: #0b1120;
      --surface: #1e293b;
      --surface-subtle: #0f172a;
      --text-main: #f8fafc;
      --text-body: #cbd5e1;
      --text-muted: #94a3b8;
      --border: #334155;
      --primary: #3b82f6;
      --primary-soft: rgba(59, 130, 246, 0.2);
      --audio-bg: rgba(30, 41, 59, 0.95);
      --audio-border: #3b82f6;
      --card-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text-body);
      padding: 16px 12px 70px 12px;
      transition: background-color 0.2s, color 0.2s;
    }

    .container {
      max-width: 1160px;
      margin: 0 auto;
    }

    /* Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .brand-wrap h1 {
      font-size: 1.6rem;
      color: var(--text-main);
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .live-badge {
      font-size: 0.68rem;
      font-weight: 800;
      text-transform: uppercase;
      background: #ef4444;
      color: #fff;
      padding: 3px 8px;
      border-radius: 99px;
      letter-spacing: 0.05em;
      animation: pulseBadge 1.8s infinite;
    }

    @keyframes pulseBadge {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.55; }
    }

    .brand-wrap p {
      color: var(--text-muted);
      font-size: 0.86rem;
      margin-top: 3px;
    }

    .header-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .btn-top {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 8px 13px;
      border-radius: 10px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: var(--card-shadow);
    }

    /* Sticky Audio Player */
    .audio-bar {
      position: sticky;
      top: 10px;
      z-index: 100;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      background: var(--audio-bg);
      border: 1px solid var(--audio-border);
      padding: 12px 14px;
      border-radius: 14px;
      margin-bottom: 16px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }

    .audio-status-wrap {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
      min-width: 240px;
    }

    .audio-status {
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .voice-picker-wrap {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .voice-select, .speed-select {
      padding: 5px 8px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--surface);
      font-size: 0.8rem;
      outline: none;
      color: var(--text-main);
    }

    .voice-select {
      max-width: 195px;
    }

    .audio-btns {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .btn-audio, .btn-control, .btn-stop {
      border: none;
      padding: 8px 13px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }

    .btn-audio {
      background: var(--primary);
      color: #fff;
    }

    .btn-control {
      background: var(--surface);
      color: var(--text-main);
      border: 1px solid var(--border);
    }

    .btn-control:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .btn-stop {
      background: var(--danger);
      color: #fff;
    }

    /* Multi-Country & Channel Control Hub */
    .controls-panel {
      background: var(--surface);
      padding: 15px;
      border-radius: 14px;
      box-shadow: var(--card-shadow);
      border: 1px solid var(--border);
      margin-bottom: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .control-row {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .row-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 4px;
    }

    .control-label {
      font-weight: 700;
      font-size: 0.76rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
    }

    .active-channel-indicator {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--primary);
    }

    /* Clean Horizontal Touch Strips (No ugly mobile scrollbar lines) */
    .scroll-strip {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      -ms-overflow-style: none;
      padding: 2px 0;
    }

    .scroll-strip::-webkit-scrollbar {
      display: none;
    }

    .btn-country, .btn-channel, .btn-chip {
      padding: 7px 14px;
      border: 1px solid var(--border);
      background: var(--surface-subtle);
      border-radius: 99px;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-body);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .btn-country.active {
      background: var(--text-main);
      color: var(--surface);
      border-color: var(--text-main);
    }

    .btn-channel.active {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.25);
    }

    .btn-chip.active {
      background: var(--primary-soft);
      color: var(--primary);
      border-color: var(--primary);
    }

    .channel-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
    }

    /* Search Row */
    .search-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding-top: 6px;
      border-top: 1px solid var(--border);
    }

    .search-box {
      display: flex;
      flex: 1;
      min-width: 220px;
      gap: 8px;
    }

    .search-box input {
      flex: 1;
      padding: 9px 12px;
      border: 1px solid var(--border);
      background: var(--surface-subtle);
      color: var(--text-main);
      border-radius: 8px;
      font-size: 0.88rem;
      outline: none;
    }

    .search-box input:focus {
      border-color: var(--primary);
    }

    .search-box button {
      padding: 9px 18px;
      background: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }

    /* News Grid & Cards */
    .news-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 16px;
    }

    .card {
      background: var(--surface);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: var(--card-shadow);
      display: flex;
      flex-direction: column;
      border: 2px solid var(--border);
      transition: transform 0.2s, border-color 0.2s;
    }

    .card:hover {
      transform: translateY(-2px);
    }

    .card.speaking {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.18);
    }

    .card-img-wrap {
      width: 100%;
      height: 165px;
      background: linear-gradient(135deg, #1e293b, #334155);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #cbd5e1;
      font-size: 0.9rem;
      font-weight: 700;
      text-align: center;
      padding: 12px;
    }

    .card-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .channel-pill-overlay {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(15, 23, 42, 0.84);
      color: #ffffff;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.7rem;
      font-weight: 700;
      backdrop-filter: blur(6px);
    }

    .card-body {
      padding: 14px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .card-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .source-tag {
      font-size: 0.73rem;
      font-weight: 800;
      color: var(--primary);
      text-transform: uppercase;
    }

    .card-date {
      font-size: 0.74rem;
      color: var(--text-muted);
    }

    .card-title {
      font-size: 0.96rem;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.38;
      margin-bottom: 8px;
    }

    .card-desc {
      font-size: 0.84rem;
      color: var(--text-body);
      line-height: 1.48;
      margin-bottom: 14px;
      flex: 1;
    }

    .card-footer {
      border-top: 1px solid var(--border);
      padding-top: 11px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .card-actions {
      display: flex;
      gap: 6px;
    }

    .btn-card-listen, .btn-card-queue {
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 5px 11px;
      font-size: 0.78rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-weight: 600;
      color: var(--text-main);
    }

    .card.speaking .btn-card-listen {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }

    .btn-card-queue.queued {
      background: #dcfce7;
      border-color: #86efac;
      color: #166534;
    }

    .read-more {
      color: var(--primary);
      text-decoration: none;
      font-weight: 700;
      font-size: 0.82rem;
    }

    .skeleton {
      animation: pulse 1.4s infinite ease-in-out;
      background: var(--surface-subtle);
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div class="brand-wrap">
      <h1>
        World & India News Hub
        <span class="live-badge">● Live Channels</span>
      </h1>
      <p>Stream headlines from India & international news networks with instant voice summaries</p>
    </div>
    <div class="header-actions">
      <button class="btn-top" onclick="fetchNews()">🔄 Refresh Feed</button>
      <button class="btn-top" id="themeToggle" onclick="toggleTheme()">🌙 Dark Mode</button>
    </div>
  </header>

  <!-- Sticky Audio Player -->
  <div class="audio-bar">
    <div class="audio-status-wrap">
      <span class="audio-status" id="audioStatus">🎙 Audio Reader: Ready</span>
      <div class="voice-picker-wrap">
        <label for="voiceSelect">Anchor Voice:</label>
        <select id="voiceSelect" class="voice-select"></select>
        <label for="speedSelect">Speed:</label>
        <select id="speedSelect" class="speed-select">
          <option value="0.9">0.9x</option>
          <option value="1" selected>1.0x</option>
          <option value="1.15">1.15x</option>
          <option value="1.3">1.3x</option>
          <option value="1.5">1.5x</option>
        </select>
      </div>
    </div>
    <div class="audio-btns">
      <button class="btn-audio" onclick="readAllTopNews()">🔊 Listen Top 5 Brief</button>
      <button class="btn-control" id="queuePlayBtn" onclick="playSavedQueue()" disabled>📋 Saved Queue (0)</button>
      <button class="btn-control" id="pauseBtn" onclick="togglePause()" disabled>⏸ Pause</button>
      <button class="btn-control" id="nextBtn" onclick="skipNext()" disabled>⏭ Next</button>
      <button class="btn-stop" onclick="stopAudio()">⏹ Stop</button>
    </div>
  </div>

  <!-- Country, News Channel & Category Controls -->
  <div class="controls-panel">
    <div class="control-row">
      <div class="row-header">
        <span class="control-label">1. Select Country / Region</span>
        <span class="active-channel-indicator" id="currentSelectionLabel">🇮🇳 India • All India Channels</span>
      </div>
      <div class="scroll-strip" id="countryStrip"></div>
    </div>

    <div class="control-row">
      <div class="row-header">
        <span class="control-label">2. Choose News Channel / Network</span>
      </div>
      <div class="scroll-strip" id="channelStrip"></div>
    </div>

    <div class="control-row">
      <div class="row-header">
        <span class="control-label">3. Topic Category</span>
      </div>
      <div class="scroll-strip" id="categoryGroup">
        <button class="btn-chip active" data-cat="general">Top Headlines</button>
        <button class="btn-chip" data-cat="business">Business & Economy</button>
        <button class="btn-chip" data-cat="technology">Technology</button>
        <button class="btn-chip" data-cat="sports">Sports & Cricket</button>
        <button class="btn-chip" data-cat="science">Science & Space</button>
        <button class="btn-chip" data-cat="entertainment">Entertainment</button>
        <button class="btn-chip" data-cat="health">Health</button>
      </div>
    </div>

    <div class="search-row">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search across channels (e.g., ISRO, Sensex, Cricket, AI, Parliament)...">
        <button onclick="triggerSearch()">Search</button>
      </div>
    </div>
  </div>

  <!-- News Grid -->
  <div class="news-grid" id="newsGrid"></div>
</div>

  // App State
  let activeCountryObj = COUNTRY_DIRECTORY[0];
  let activeChannelObj = activeCountryObj.channels[0];
  let activeCategory = 'general';
  let fetchedArticles = [];
  let savedQueueIndices = [];

  // Speech Synthesis State
  const synth = window.speechSynthesis;
  let englishVoices = [];
  let selectedVoice = null;
  let audioQueue = [];
  let currentQueuePos = -1;
  let activeArticleIndex = null;
  let isCancelled = false;

  // Theme Init (Default Dark Mode if saved)
  if (localStorage.getItem('newsTheme') === 'dark') {
    document.body.classList.add('dark');
    document.getElementById('themeToggle').innerText = '☀️ Light Mode';
  }

  function toggleTheme() {
    document.body.classList.toggle('dark');
    const isDark = document.body.classList.contains('dark');
    localStorage.setItem('newsTheme', isDark ? 'dark' : 'light');
    document.getElementById('themeToggle').innerText = isDark ? '☀️ Light Mode' : '🌙 Dark Mode';
  }

  // Speed Init
  const speedSelect = document.getElementById('speedSelect');
  const savedSpeed = localStorage.getItem('newsVoiceSpeed');
  if (savedSpeed) speedSelect.value = savedSpeed;
  speedSelect.onchange = () => localStorage.setItem('newsVoiceSpeed', speedSelect.value);

  // Voice Loader
  function loadVoices() {
    if (!synth) return;
    const allVoices = synth.getVoices();
    englishVoices = allVoices.filter(v => v.lang.startsWith('en'));
    if (englishVoices.length === 0) return;

    const selectEl = document.getElementById('voiceSelect');
    selectEl.innerHTML = '';

    const qualityKeywords = ['en-IN', 'en_IN', 'India', 'Google', 'Natural', 'Online', 'Siri', 'Samantha'];
    englishVoices.sort((a, b) => {
      const aScore = qualityKeywords.some(k => a.name.includes(k) || a.lang.includes(k)) ? 1 : 0;
      const bScore = qualityKeywords.some(k => b.name.includes(k) || b.lang.includes(k)) ? 1 : 0;
      return bScore - aScore;
    });

    const savedVoiceName = localStorage.getItem('newsVoiceName');
    let defaultIndex = 0;

    englishVoices.forEach((voice, index) => {
      const option = document.createElement('option');
      option.value = index;
      option.textContent = `${voice.name} (${voice.lang})`;
      selectEl.appendChild(option);
      if (savedVoiceName && voice.name === savedVoiceName) {
        defaultIndex = index;
      }
    });

    selectedVoice = englishVoices[defaultIndex];
    selectEl.value = defaultIndex;

    selectEl.onchange = (e) => {
      selectedVoice = englishVoices[e.target.value];
      localStorage.setItem('newsVoiceName', selectedVoice.name);
    };
  }

  loadVoices();
  if (speechSynthesis.onvoiceschanged !== undefined) {
    speechSynthesis.onvoiceschanged = loadVoices;
  }

  function renderCountryStrip() {
    const strip = document.getElementById('countryStrip');
    strip.innerHTML = '';

    COUNTRY_DIRECTORY.forEach(country => {
      const btn = document.createElement('button');
      btn.className = `btn-country ${country.code === activeCountryObj.code ? 'active' : ''}`;

      btn.onclick = () => {
        activeCountryObj = country;
        activeChannelObj = country.channels[0];
        document.getElementById('searchInput').value = '';
        renderCountryStrip();
        renderChannelStrip();
        updateSelectionLabel();
        fetchNews();

  function renderChannelStrip() {
    const strip = document.getElementById('channelStrip');
    strip.innerHTML = '';

    activeCountryObj.channels.forEach(channel => {
      const btn = document.createElement('button');
      btn.className = `btn-channel ${channel.id === activeChannelObj.id ? 'active' : ''}`;
      btn.innerHTML = `

        <span>${channel.name}</span>
      `;
      btn.onclick = () => {
        activeChannelObj = channel;
        document.getElementById('searchInput').value = '';
        renderChannelStrip();
        updateSelectionLabel();
        fetchNews();
      };
      strip.appendChild(btn);
    });
  }

  function updateSelectionLabel() {
    document.getElementById('currentSelectionLabel').innerText =
      `${activeCountryObj.flag} ${activeCountryObj.name} • ${activeChannelObj.name}`;
  }

  function escapeHTML(str) {
    if (!str) return '';
    return str.replace(/[&<>"']/g, m => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[m]));
  }

  function cleanText(txt) {
    if (!txt) return '';
    return txt
      .replace(/<!\[CDATA\[([\s\S]*?)\]\]>/gi, '$1')
      .replace(/<[^>]*>/g, ' ')
      .replace(/&nbsp;/gi, ' ')
      .replace(/&amp;/gi, '&')
      .replace(/&quot;/gi, '"')
      .replace(/&#39;/gi, "'")
      .replace(/https?:\/\/\S+/gi, '')
      .replace(/\[\+\d+\s+chars\]/gi, '')
      .replace(/\s+/g, ' ')
      .trim();
  }

  function formatRelativeTime(dateString) {
    if (!dateString) return 'Live';
    const date = new Date(dateString);
    if (isNaN(date.getTime())) return 'Live';
    const diffMins = Math.floor((Date.now() - date.getTime()) / 60000);
    if (diffMins < 60) return `${Math.max(1, diffMins)}m ago`;
    const diffHours = Math.floor(diffMins / 60);
    if (diffHours < 24) return `${diffHours}h ago`;
    return date.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  }

  // Audio Queue Controls
  function updateCardHighlight(articleIdx) {
    activeArticleIndex = articleIdx;
    document.querySelectorAll('.card').forEach((card, idx) => {
      const btn = card.querySelector('.btn-card-listen');
      if (idx === articleIdx) {
        card.classList.add('speaking');
        if (btn) btn.innerHTML = '⏹ Stop';
        card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      } else {
        card.classList.remove('speaking');
        if (btn) btn.innerHTML = '🔊 Listen';
      }
    });
  }

  function setControlsState(isPlaying, hasNext = false) {
    const pauseBtn = document.getElementById('pauseBtn');
    const nextBtn = document.getElementById('nextBtn');
    pauseBtn.disabled = !isPlaying;
    nextBtn.disabled = !hasNext;
    if (!isPlaying) pauseBtn.innerText = '⏸ Pause';
  }

  function playQueue(items) {
    if (!('speechSynthesis' in window)) {
      alert("Voice playback is not supported on this browser.");
      return;
    }
    stopAudio(false);
    isCancelled = false;
    audioQueue = items;
    currentQueuePos = 0;
    playCurrentQueueItem();
  }

  function playCurrentQueueItem() {
    if (isCancelled || currentQueuePos < 0 || currentQueuePos >= audioQueue.length) {
      stopAudio(true);
      return;
    }

    const item = audioQueue[currentQueuePos];
    const utterance = new SpeechSynthesisUtterance(item.text);

    if (selectedVoice) {
      utterance.voice = selectedVoice;
      utterance.lang = selectedVoice.lang;
    } else {
      utterance.lang = activeCountryObj.code === 'in' ? 'en-IN' : 'en-US';
    }

    utterance.rate = parseFloat(speedSelect.value) || 1.0;
    utterance.pitch = 1.0;

    utterance.onstart = () => {
      document.getElementById('audioStatus').innerText = item.status || "🔊 Playing summary...";
      updateCardHighlight(item.articleIndex);
      setControlsState(true, currentQueuePos < audioQueue.length - 1);
    };

    utterance.onend = () => {
      if (isCancelled) return;
      currentQueuePos++;
      if (currentQueuePos < audioQueue.length) {
        playCurrentQueueItem();
      } else {
        stopAudio(true);
      }
    };

    utterance.onerror = () => {
      if (!isCancelled) stopAudio(true);
    };

    synth.speak(utterance);
  }

  function stopAudio(resetStatus = true) {
    isCancelled = true;
    audioQueue = [];
    currentQueuePos = -1;
    if (synth) synth.cancel();
    updateCardHighlight(null);
    setControlsState(false, false);
    if (resetStatus) {
      document.getElementById('audioStatus').innerText = "🎙 Audio Reader: Ready";
    }
  }

  function togglePause() {
    if (!synth) return;
    const pauseBtn = document.getElementById('pauseBtn');
    if (synth.paused) {
      synth.resume();
      pauseBtn.innerText = '⏸ Pause';
      document.getElementById('audioStatus').innerText = "🔊 Resumed playback...";
    } else if (synth.speaking) {
      synth.pause();
      pauseBtn.innerText = '▶ Resume';
      document.getElementById('audioStatus').innerText = "⏸ Audio Paused";
    }
  }

  function skipNext() {
    if (currentQueuePos < audioQueue.length - 1) {
      isCancelled = true;
      synth.cancel();
      isCancelled = false;
      currentQueuePos++;
      playCurrentQueueItem();
    }
  }

  function readAllTopNews() {
    if (!fetchedArticles.length) return;

    const queue = [{
      text: `Here are the top 5 headlines from ${activeChannelObj.name}.`,
      status: `🎙 Starting ${activeChannelObj.name} Brief...`,
      articleIndex: null
    }];

    fetchedArticles.slice(0, 5).forEach((art, idx) => {
      const title = cleanText(art.title);
      const desc = cleanText(art.description);
      queue.push({
        text: `Headline ${idx + 1}: ${title}. ${desc}`,
        status: `🔊 (${idx + 1}/5) ${title}`,
        articleIndex: idx
      });
    });

    queue.push({
      text: "This concludes your news bulletin.",
      status: "🎙 Bulletin finished",
      articleIndex: null
    });

    playQueue(queue);
  }

  function readSingleArticle(index) {
    if (activeArticleIndex === index) {
      stopAudio();
      return;
    }
    const art = fetchedArticles[index];
    if (!art) return;
    const title = cleanText(art.title);
    const desc = cleanText(art.description);
    playQueue([{
      text: `${title}. ${desc}`,
      status: `🔊 Reading: ${title}`,
      articleIndex: index
    }]);
  }

  function toggleQueueArticle(index) {
    const pos = savedQueueIndices.indexOf(index);
    if (pos === -1) savedQueueIndices.push(index);
    else savedQueueIndices.splice(pos, 1);

    const btn = document.getElementById('queuePlayBtn');
    btn.innerText = `📋 Saved Queue (${savedQueueIndices.length})`;
    btn.disabled = savedQueueIndices.length === 0;
    renderArticles();
  }

  function playSavedQueue() {
    if (!savedQueueIndices.length) return;
    const queue = [{
      text: `Playing your ${savedQueueIndices.length} queued news stories.`,
      status: "📋 Playing Saved Queue...",
      articleIndex: null
    }];

    savedQueueIndices.forEach((artIdx, i) => {
      const art = fetchedArticles[artIdx];
      if (!art) return;
      queue.push({
        text: `${cleanText(art.title)}. ${cleanText(art.description)}`,
        status: `📋 Queue (${i + 1}/${savedQueueIndices.length}): ${cleanText(art.title)}`,
        articleIndex: artIdx
      });
    });

    playQueue(queue);
  }

  function showSkeletons() {
    const grid = document.getElementById('newsGrid');
    grid.innerHTML = Array.from({ length: 6 }).map(() => `

  function renderArticles() {
    const grid = document.getElementById('newsGrid');
    grid.innerHTML = '';

    fetchedArticles.forEach((article, idx) => {
      const displayChannel = activeChannelObj.id !== 'all'
        ? activeChannelObj.name
        : (article.source?.name || activeCountryObj.name + ' News');
      const sourceName = escapeHTML(displayChannel);
      const dateStr = formatRelativeTime(article.publishedAt);
      const title = escapeHTML(cleanText(article.title));
      const rawDesc = cleanText(article.description);
      const desc = escapeHTML(rawDesc && rawDesc !== cleanText(article.title) ? rawDesc : `Live coverage and full report from ${displayChannel}.`);
      const isQueued = savedQueueIndices.includes(idx);

      const card = document.createElement('div');
      card.className = `card ${activeArticleIndex === idx ? 'speaking' : ''}`;
      card.innerHTML = `
        <div class="card-img-wrap">
          <span class="channel-pill-overlay">${activeCountryObj.flag} ${sourceName}</span>
          ${article.urlToImage
            ? `<img src="${escapeHTML(article.urlToImage)}" alt="News thumbnail" loading="lazy" onerror="this.outerHTML='<span>📺 ${sourceName}</span>'">`
            : `<span>📺 ${sourceName}</span>`
          }
        </div>
        <div class="card-body">
          <div class="card-meta">
            <span class="source-tag">${sourceName}</span>
            <span class="card-date">${dateStr}</span>
          </div>
          <h2 class="card-title">${title}</h2>
          <p class="card-desc">${desc}</p>
          <div class="card-footer">
            <div class="card-actions">
              <button class="btn-card-listen" onclick="readSingleArticle(${idx})">
                ${activeArticleIndex === idx ? '⏹ Stop' : '🔊 Listen'}
              </button>
              <button class="btn-card-queue ${isQueued ? 'queued' : ''}" onclick="toggleQueueArticle(${idx})">
                ${isQueued ? '✓ Saved' : '➕ Queue'}
              </button>
            </div>
            <a href="${escapeHTML(article.url || '#')}" class="read-more" target="_blank" rel="noopener noreferrer">Read &rarr;</a>
          </div>
        </div>
      `;
      grid.appendChild(card);
    });
  }

  /**
   * LAYER 2: Native XML RSS Parser via AllOrigins Proxy (If /api/news doesn't return results)
   */
  async function fetchViaXmlProxy(rssUrl) {
    const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(rssUrl)}`;
    const res = await fetch(proxyUrl);
    const data = await res.json();
    if (!data.contents) throw new Error('Empty proxy response');

    const parser = new DOMParser();
    const xml = parser.parseFromString(data.contents, "text/xml");
    const items = Array.from(xml.querySelectorAll("item")).slice(0, 18);
    if (!items.length) throw new Error('No XML items');

    return items.map(item => {
      const title = item.querySelector("title")?.textContent || '';
      const desc = item.querySelector("description")?.textContent || '';
      const link = item.querySelector("link")?.textContent || '#';
      const pubDate = item.querySelector("pubDate")?.textContent || new Date().toISOString();

      let img = '';
      const mediaContent = item.getElementsByTagNameNS('*', 'content')[0] || item.getElementsByTagNameNS('*', 'thumbnail')[0];
      if (mediaContent && mediaContent.getAttribute('url')) {
        img = mediaContent.getAttribute('url');
      } else {
        const match = desc.match(/<img[^>]+src=["']([^"'>]+)["']/i);
        if (match) img = match[1];
      }

      return {
        source: { name: activeChannelObj.name },
        title: cleanText(title),
        description: cleanText(desc),
        url: link,
        urlToImage: img,
        publishedAt: pubDate
      };
    });
  }

  /**

      },
      {

        publishedAt: new Date(now - 210 * 60000).toISOString()

  /**
   * MULTI-LAYER NEWS FETCHER
   * 1. Calls your /api/news serverless endpoint using compatible ?category=...&q=...
   * 2. If empty/blocked, parses live XML RSS feed via AllOrigins proxy
   * 3. If offline/rate-limited, loads instant channel-matched fallback feed
   */
  async function fetchNews(userQuery = '') {
    stopAudio();
    showSkeletons();
    savedQueueIndices = [];
    document.getElementById('queuePlayBtn').innerText = '📋 Saved Queue (0)';
    document.getElementById('queuePlayBtn').disabled = true;

    // Build a smart search query compatible with your existing /api/news endpoint
    const topicPart = activeCategory !== 'general' ? activeCategory : '';
    const combinedQuery = [userQuery, activeChannelObj.query, topicPart].filter(Boolean).join(' ').trim();

    // LAYER 1: Try your Vercel /api/news backend first
    try {
      const apiUrl = `/api/news?category=${encodeURIComponent(activeCategory)}&q=${encodeURIComponent(combinedQuery)}`;
      const response = await fetch(apiUrl);
      const data = await response.json();

      if (data.status === 'ok' && Array.isArray(data.articles) && data.articles.length > 0) {
        const valid = data.articles.filter(a => a.title && !a.title.includes('[Removed]'));
        if (valid.length > 0) {
          fetchedArticles = valid;
          renderArticles();
          return;
        }
      }
    } catch (e) {
      // Proceed to Layer 2
    }

    // LAYER 2: Try XML RSS Feed via AllOrigins Proxy
    if (activeChannelObj.rss && !userQuery) {
      try {
        const xmlArticles = await fetchViaXmlProxy(activeChannelObj.rss);
        if (xmlArticles && xmlArticles.length > 0) {
          fetchedArticles = xmlArticles;
          renderArticles();
          return;
        }
      } catch (e) {
        // Proceed to Layer 3
      }
    }

    // LAYER 3: Instant Channel-Matched Fallback (Never shows red error screen)
    fetchedArticles = getChannelFallbackArticles(userQuery);
    renderArticles();
  }

  // Category Listener
  document.getElementById('categoryGroup').addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (btn) {
      document.querySelectorAll('#categoryGroup button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeCategory = btn.dataset.cat;
      document.getElementById('searchInput').value = '';
      fetchNews();
    }
  });

  function triggerSearch() {
    const query = document.getElementById('searchInput').value.trim();
    if (query) fetchNews(query);
  }

  document.getElementById('searchInput').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') triggerSearch();
  });

  // Initialize
  renderCountryStrip();
  renderChannelStrip();
  updateSelectionLabel();
  fetchNews();
</script>
