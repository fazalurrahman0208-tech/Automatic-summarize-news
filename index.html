<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pulse — Global & India News Intelligence</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #fafafa;
      --surface: #ffffff;
      --surface-elevated: #f4f4f5;
      --surface-hover: #e4e4e7;
      --glass: rgba(255, 255, 255, 0.86);
      --text-primary: #09090b;
      --text-secondary: #52525b;
      --text-tertiary: #71717a;
      --border: #e4e4e7;
      --border-strong: #d4d4d8;
      --accent: #09090b;
      --accent-fg: #ffffff;
      --brand: #2563eb;
      --brand-soft: rgba(37, 99, 235, 0.08);
      --bookmark: #f59e0b;
      --bookmark-soft: rgba(245, 158, 11, 0.12);
      --video: #e11d48;
      --video-soft: rgba(225, 29, 72, 0.12);
      --danger: #dc2626;
      --danger-soft: rgba(220, 38, 38, 0.1);
      --success: #16a34a;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
      --shadow-md: 0 8px 24px -4px rgba(0, 0, 0, 0.06);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    }

    body.dark {
      --bg: #09090b;
      --surface: #121215;
      --surface-elevated: #1c1c21;
      --surface-hover: #27272e;
      --glass: rgba(18, 18, 21, 0.86);
      --text-primary: #fafafa;
      --text-secondary: #a1a1aa;
      --text-tertiary: #71717a;
      --border: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(255, 255, 255, 0.16);
      --accent: #fafafa;
      --accent-fg: #09090b;
      --brand: #3b82f6;
      --brand-soft: rgba(59, 130, 246, 0.14);
      --bookmark: #fbbf24;
      --bookmark-soft: rgba(251, 191, 36, 0.15);
      --video: #fb7185;
      --video-soft: rgba(244, 63, 94, 0.16);
      --danger: #ef4444;
      --danger-soft: rgba(239, 68, 68, 0.15);
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 12px 32px -4px rgba(0, 0, 0, 0.5);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      color: var(--text-secondary);
      line-height: 1.5;
      padding: 0 16px 80px 16px;
      transition: background-color 0.3s var(--ease-out), color 0.3s var(--ease-out);
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    /* Icon Utility */
    .icon {
      width: 15px;
      height: 15px;
      stroke: currentColor;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      flex-shrink: 0;
      transition: transform 0.2s var(--ease-out), fill 0.2s var(--ease-out);
    }

    .icon-filled {
      fill: currentColor;
    }

    /* Top Editorial Masthead / Navbar */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 0 16px 0;
      border-bottom: 1px solid var(--border);
      margin-bottom: 16px;
      gap: 12px;
      flex-wrap: wrap;
    }

    .brand-left {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      background: var(--accent);
      color: var(--accent-fg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: -0.03em;
    }

    .brand-titles h1 {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.025em;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.65rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 2px 7px;
      border-radius: 99px;
      background: var(--surface-elevated);
      color: var(--text-secondary);
      border: 1px solid var(--border);
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 8px var(--success);
    }

    .brand-titles p {
      font-size: 0.78rem;
      color: var(--text-tertiary);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Button System */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-family: inherit;
      font-size: 0.78rem;
      font-weight: 500;
      padding: 7px 12px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-primary);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.18s var(--ease-out);
      user-select: none;
    }

    .btn:hover:not(:disabled) {
      background: var(--surface-elevated);
      border-color: var(--border-strong);
    }

    .btn:active:not(:disabled) {
      transform: scale(0.97);
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--accent);
      color: var(--accent-fg);
      border-color: var(--accent);
      font-weight: 600;
    }

    .btn-primary:hover:not(:disabled) {
      opacity: 0.9;
      background: var(--accent);
      border-color: var(--accent);
    }

    .btn-brand {
      background: var(--brand-soft);
      color: var(--brand);
      border-color: rgba(59, 130, 246, 0.25);
      font-weight: 600;
    }

    .btn-brand:hover:not(:disabled) {
      background: var(--brand);
      color: #ffffff;
      border-color: var(--brand);
    }

    .btn-video-toggle.active {
      background: var(--video-soft);
      color: var(--video);
      border-color: rgba(244, 63, 94, 0.35);
      font-weight: 600;
    }

    .btn-danger {
      background: var(--danger-soft);
      color: var(--danger);
      border-color: transparent;
    }

    .btn-danger:hover:not(:disabled) {
      background: var(--danger);
      color: #ffffff;
    }

    .btn-icon-only {
      padding: 7px;
    }

    /* Navbar Bookmark Button & Badge */
    .btn-nav-bookmarks.active {
      background: var(--accent);
      color: var(--accent-fg);
      border-color: var(--accent);
    }

    .nav-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.68rem;
      font-weight: 600;
      padding: 1px 6px;
      border-radius: 99px;
      background: var(--surface-elevated);
      color: var(--text-primary);
      border: 1px solid var(--border);
      transition: all 0.2s var(--ease-out);
    }

    .btn-nav-bookmarks.active .nav-badge {
      background: rgba(128, 128, 128, 0.25);
      color: inherit;
      border-color: transparent;
    }

    /* Sticky Broadcast & AI Studio Bar */
    .studio-bar {
      position: sticky;
      top: 12px;
      z-index: 90;
      background: var(--glass);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-md);
      padding: 10px 14px;
      margin-bottom: 16px;
      box-shadow: var(--shadow-md);
      transition: border-color 0.25s var(--ease-out);
    }

    .studio-main {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .studio-status {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 200px;
      flex: 1;
    }

    /* Minimal Audio Waveform */
    .waveform {
      display: inline-flex;
      align-items: center;
      gap: 2.5px;
      height: 16px;
      padding: 0 4px;
    }

    .wave-bar {
      width: 2.5px;
      height: 4px;
      border-radius: 99px;
      background: var(--text-tertiary);
      transition: height 0.2s ease, background-color 0.2s ease;
    }

    .waveform.playing .wave-bar {
      background: var(--brand);
    }

    .waveform.playing .wave-bar:nth-child(1) { animation: sound 0.65s infinite ease-in-out; }
    .waveform.playing .wave-bar:nth-child(2) { animation: sound 0.65s infinite ease-in-out 0.15s; }
    .waveform.playing .wave-bar:nth-child(3) { animation: sound 0.65s infinite ease-in-out 0.3s; }
    .waveform.playing .wave-bar:nth-child(4) { animation: sound 0.65s infinite ease-in-out 0.1s; }

    @keyframes sound {
      0%, 100% { height: 4px; }
      50% { height: 15px; }
    }

    .status-text {
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 360px;
    }

    .studio-controls {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    /* Collapsible Audio Settings Tray */
    .studio-drawer {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows 0.28s var(--ease-out);
    }

    .studio-drawer.open {
      grid-template-rows: 1fr;
    }

    .studio-drawer-inner {
      overflow: hidden;
    }

    .studio-settings-row {
      padding-top: 10px;
      margin-top: 10px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      font-size: 0.76rem;
      color: var(--text-secondary);
    }

    .setting-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .select-minimal {
      font-family: inherit;
      font-size: 0.76rem;
      padding: 5px 8px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--surface-elevated);
      color: var(--text-primary);
      outline: none;
      max-width: 210px;
    }

    /* Collapsible AI Executive Briefing Drawer */
    .ai-drawer {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows 0.35s var(--ease-out), margin-bottom 0.35s var(--ease-out);
      margin-bottom: 0;
    }

    .ai-drawer.open {
      grid-template-rows: 1fr;
      margin-bottom: 16px;
    }

    .ai-drawer-inner {
      overflow: hidden;
    }

    .ai-brief-card {
      background: var(--surface);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-md);
      padding: 16px 18px;
      box-shadow: var(--shadow-sm);
    }

    .ai-brief-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }

    .ai-brief-title {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-primary);
    }

    .ai-brief-title .icon {
      color: var(--brand);
    }

    .ai-brief-body {
      font-size: 0.84rem;
      color: var(--text-secondary);
      line-height: 1.6;
    }

    .ai-brief-body p {
      color: var(--text-primary);
      font-weight: 500;
      margin-bottom: 10px;
    }

    .ai-brief-body ul {
      padding-left: 18px;
      display: grid;
      gap: 6px;
    }

    /* Dedicated Bookmarks View Header Banner */
    .bookmarks-banner {
      display: none;
      background: var(--surface);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-md);
      padding: 16px 18px;
      margin-bottom: 20px;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      box-shadow: var(--shadow-sm);
      animation: cardEnter 0.3s var(--ease-out);
    }

    .bookmarks-banner.open {
      display: flex;
    }

    .bookmarks-banner-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .bookmarks-icon-box {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: var(--bookmark-soft);
      color: var(--bookmark);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .bookmarks-banner-info h2 {
      font-size: 0.98rem;
      font-weight: 600;
      color: var(--text-primary);
    }

    .bookmarks-banner-info p {
      font-size: 0.76rem;
      color: var(--text-tertiary);
    }

    .bookmarks-banner-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    /* Unified Filter & Navigation Deck */
    .nav-deck {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 12px 14px;
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: var(--shadow-sm);
    }

    .nav-deck.hidden {
      display: none;
    }

    .deck-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .active-crumb {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      color: var(--text-tertiary);
    }

    .active-crumb strong {
      color: var(--text-primary);
      font-weight: 600;
    }

    /* Search Input */
    .search-wrap {
      position: relative;
      flex: 1;
      max-width: 340px;
      min-width: 200px;
      display: flex;
      align-items: center;
    }

    .search-wrap .icon {
      position: absolute;
      left: 10px;
      color: var(--text-tertiary);
      pointer-events: none;
    }

    .search-wrap input {
      width: 100%;
      padding: 6px 64px 6px 32px;
      font-family: inherit;
      font-size: 0.8rem;
      background: var(--surface-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-primary);
      outline: none;
      transition: border-color 0.2s ease, background-color 0.2s ease;
    }

    .search-wrap input:focus {
      background: var(--surface);
      border-color: var(--text-primary);
    }

    .search-submit {
      position: absolute;
      right: 4px;
      padding: 3px 8px;
      font-size: 0.7rem;
      font-weight: 600;
      border-radius: 5px;
      background: var(--surface);
      color: var(--text-secondary);
      cursor: pointer;
      border: 1px solid var(--border);
    }

    .search-submit:hover {
      color: var(--text-primary);
    }

    /* Horizontal Pill Strips */
    .strip-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .strip-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.66rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-tertiary);
      min-width: 58px;
      flex-shrink: 0;
    }

    .scroll-strip {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      -ms-overflow-style: none;
      padding: 2px 0;
      flex: 1;
    }

    .scroll-strip::-webkit-scrollbar {
      display: none;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 11px;
      border-radius: 7px;
      font-size: 0.76rem;
      font-weight: 500;
      color: var(--text-secondary);
      background: transparent;
      border: 1px solid transparent;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      transition: all 0.16s var(--ease-out);
    }

    .pill:hover {
      color: var(--text-primary);
      background: var(--surface-elevated);
    }

    .pill.active {
      background: var(--surface-elevated);
      color: var(--text-primary);
      border-color: var(--border-strong);
      font-weight: 600;
      box-shadow: var(--shadow-sm);
    }

    .pill-country.active {
      background: var(--accent);
      color: var(--accent-fg);
      border-color: var(--accent);
    }

    .channel-indicator {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .divider {
      height: 1px;
      background: var(--border);
      margin: 2px 0;
    }

    /* Editorial News Grid & Cards */
    .news-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 18px;
    }

    @keyframes cardEnter {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.28s var(--ease-out), border-color 0.28s var(--ease-out), box-shadow 0.28s var(--ease-out);
      animation: cardEnter 0.45s var(--ease-out) backwards;
      animation-delay: calc(var(--i, 0) * 35ms);
    }

    .card:hover {
      transform: translateY(-3px);
      border-color: var(--border-strong);
      box-shadow: var(--shadow-md);
    }

    .card.speaking {
      border-color: var(--brand);
      box-shadow: 0 0 0 1px var(--brand), var(--shadow-md);
    }

    .card.playing-video {
      border-color: var(--video);
      box-shadow: 0 0 0 1px var(--video), var(--shadow-md);
    }

    /* Card Media & Embedded Video Container */
    .card-media {
      width: 100%;
      aspect-ratio: 16 / 9;
      min-height: 188px;
      background: var(--surface-elevated);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid var(--border);
    }

    .card-media img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.5s var(--ease-out), filter 0.3s ease;
    }

    .card:hover .card-media img {
      transform: scale(1.03);
    }

    .media-fallback {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-tertiary);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 16px;
      text-align: center;
    }

    .card-badge {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 3;
      background: var(--glass);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: var(--text-primary);
      border: 1px solid var(--border);
      padding: 3px 8px;
      border-radius: 6px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.66rem;
      font-weight: 600;
      pointer-events: none;
    }

    /* Video Platform Pill & Play Overlay on Card Media */
    .video-platform-pill {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 3;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(9, 9, 11, 0.82);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.16);
      padding: 3px 8px;
      border-radius: 6px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.64rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      cursor: pointer;
      transition: transform 0.2s var(--ease-out), background-color 0.2s ease;
    }

    .video-platform-pill:hover {
      background: #e11d48;
      border-color: #e11d48;
      transform: scale(1.03);
    }

    .video-platform-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #ef4444;
      box-shadow: 0 0 6px #ef4444;
    }

    .video-play-overlay {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle, rgba(0, 0, 0, 0.28) 0%, rgba(0, 0, 0, 0.08) 70%);
      opacity: 0;
      transition: opacity 0.22s var(--ease-out);
      cursor: pointer;
    }

    .card-media.has-video .video-play-overlay {
      opacity: 1;
    }

    .video-play-btn {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: rgba(9, 9, 11, 0.84);
      color: #ffffff;
      border: 1.5px solid rgba(255, 255, 255, 0.28);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      transition: transform 0.22s var(--ease-out), background-color 0.22s var(--ease-out), border-color 0.22s var(--ease-out);
    }

    .card-media.has-video:hover .video-play-btn {
      transform: scale(1.1);
      background: #e11d48;
      border-color: #fb7185;

    .video-play-btn .icon {
      width: 18px;
      height: 18px;
      margin-left: 2px;
      fill: currentColor;

      position: relative;
      width: 100%;
      height: 100%;
      background: #000000;
      display: flex;
      flex-direction: column;
    }

    .card-video-toolbar {
      position: absolute;
      top: 8px;
      left: 8px;
      right: 8px;
      z-index: 5;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
    }

    .card-video-toolbar > * {
      pointer-events: auto;
    }

    .video-toolbar-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: rgba(9, 9, 11, 0.82);
      color: #fafafa;
      border: 1px solid rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 3px 8px;
      border-radius: 6px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.65rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.18s ease;
    }

    .video-toolbar-btn:hover {
      background: #dc2626;
      border-color: #ef4444;
    }

    .card-video-iframe,
    .card-video-native {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #000;
    }

    .card-body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .card-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.68rem;
      color: var(--text-tertiary);
    }

    .source-name {
      color: var(--text-secondary);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .card-title {
      font-size: 0.96rem;
      font-weight: 600;
      color: var(--text-primary);
      line-height: 1.42;
      letter-spacing: -0.01em;
      margin-bottom: 8px;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-desc {
      font-size: 0.82rem;
      color: var(--text-secondary);
      line-height: 1.55;
      margin-bottom: 14px;
      flex: 1;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Smooth Accordion for Per-Card AI Summary */
    .card-ai-accordion {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows 0.28s var(--ease-out);
    }

    .card-ai-accordion.open {
      grid-template-rows: 1fr;
    }

    .card-ai-inner {
      overflow: hidden;
    }

      background: var(--surface-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      margin-bottom: 12px;
      font-size: 0.78rem;
      color: var(--text-secondary);
      line-height: 1.5;
    }

    .card-ai-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.66rem;
      font-weight: 600;
      color: var(--brand);
      text-transform: uppercase;
    }

    .card-ai-box ul {
      padding-left: 15px;
      margin-top: 5px;
      display: grid;
      gap: 4px;
    }

    .card-footer {
      border-top: 1px solid var(--border);
      padding-top: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .card-actions {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-wrap: wrap;
    }

    .btn-sm {
      padding: 5px 8px;
      font-size: 0.72rem;
      border-radius: 6px;
    }

    .card.speaking .btn-listen-card {
      background: var(--brand);
      color: #ffffff;
      border-color: var(--brand);
    }

    .btn-watch-card.ready {
      background: var(--video-soft);
      color: var(--video);
      border-color: rgba(244, 63, 94, 0.3);
      font-weight: 600;
    }

    .btn-watch-card.ready:hover,
    .card.playing-video .btn-watch-card {
      background: var(--video);
      color: #ffffff;
      border-color: var(--video);
    }

    .btn-save-card.saved {
      background: var(--bookmark-soft);
      color: var(--bookmark);
      border-color: rgba(245, 158, 11, 0.35);
      font-weight: 600;
    }

    .btn-queue-card.queued {
      background: var(--accent);
      color: var(--accent-fg);
      border-color: var(--accent);
    }

    .external-link {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-primary);
      text-decoration: none;
      transition: opacity 0.15s ease;
    }

    .external-link:hover {
      opacity: 0.7;
    }

    /* Empty Bookmarks State */
    .empty-state {
      grid-column: 1 / -1;
      background: var(--surface);
      border: 1px dashed var(--border-strong);
      border-radius: var(--radius-md);
      padding: 56px 20px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      animation: cardEnter 0.35s var(--ease-out);
    }

    .empty-icon-wrap {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      background: var(--surface-elevated);
      color: var(--text-tertiary);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 4px;
    }

    .empty-state h3 {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-primary);
    }

    .empty-state p {
      font-size: 0.8rem;
      color: var(--text-tertiary);
      max-width: 360px;
      margin-bottom: 6px;
    }

    /* Minimal Toast Notification */
    .toast {
      position: fixed;
      bottom: 22px;
      right: 22px;
      z-index: 200;
      background: var(--accent);
      color: var(--accent-fg);
      padding: 9px 14px;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: 500;
      box-shadow: var(--shadow-md);
      display: flex;
      align-items: center;
      gap: 8px;
      opacity: 0;
      transform: translateY(12px);
      pointer-events: none;
      transition: opacity 0.22s var(--ease-out), transform 0.22s var(--ease-out);
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* Refined Shimmer Skeletons */
    .skeleton {
      background: linear-gradient(90deg, var(--surface-elevated) 25%, var(--surface-hover) 50%, var(--surface-elevated) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
    }

    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    @media (max-width: 640px) {
      body { padding: 0 12px 64px 12px; }
      header { padding: 14px 0 12px 0; }
      .search-wrap { max-width: 100%; width: 100%; order: 3; }
      .status-text { max-width: 220px; }
    }
  </style>
</head>

  // Extracts YouTube, Vimeo, Dailymotion, or direct MP4 video data from any raw URL or text
  function parseVideoFromTextOrUrl(rawInput) {
    if (!rawInput || typeof rawInput !== 'string') return null;

    // 1. YouTube (watch?v=, youtu.be/, embed/, shorts/)
    const ytMatch = rawInput.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/|v\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/i);
    if (ytMatch && ytMatch[1]) {
      const vid = ytMatch[1];
      return {
        platform: 'YouTube',
        type: 'iframe',
        videoId: vid,
        embedUrl: `https://www.youtube-nocookie.com/embed/${vid}?autoplay=1&rel=0&modestbranding=1`,
        staticEmbedUrl: `https://www.youtube-nocookie.com/embed/${vid}?rel=0&modestbranding=1`,
        watchUrl: `https://www.youtube.com/watch?v=${vid}`,
        thumbnail: `https://i.ytimg.com/vi/${vid}/hqdefault.jpg`
      };
    }

    // 2. Vimeo
    const vimeoMatch = rawInput.match(/vimeo\.com\/(?:video\/)?(\d{6,11})/i);
    if (vimeoMatch && vimeoMatch[1]) {
      const vid = vimeoMatch[1];
      return {
        platform: 'Vimeo',
        type: 'iframe',
        videoId: vid,
        embedUrl: `https://player.vimeo.com/video/${vid}?autoplay=1`,
        staticEmbedUrl: `https://player.vimeo.com/video/${vid}`,
        watchUrl: `https://vimeo.com/${vid}`,
        thumbnail: ''
      };
    }

    // 3. Dailymotion
    const dmMatch = rawInput.match(/(?:dailymotion\.com\/(?:video|embed\/video)\/|dai\.ly\/)([a-zA-Z0-9]+)/i);
    if (dmMatch && dmMatch[1]) {
      const vid = dmMatch[1];
      return {
        platform: 'Dailymotion',
        type: 'iframe',
        videoId: vid,
        embedUrl: `https://www.dailymotion.com/embed/video/${vid}?autoplay=1`,
        staticEmbedUrl: `https://www.dailymotion.com/embed/video/${vid}`,
        watchUrl: `https://www.dailymotion.com/video/${vid}`,
        thumbnail: `https://www.dailymotion.com/thumbnail/video/${vid}`
      };
    }

    // 4. Direct HTML5 Video Stream (.mp4 / .webm)
    const mp4Match = rawInput.match(/(https?:\/\/[^\s"'<>]+\.(?:mp4|webm)(?:\?[^\s"'<>]*)?)/i);
    if (mp4Match && mp4Match[1]) {
      const url = mp4Match[1];
      return {
        platform: 'Stream',
        type: 'native',
        videoId: url,
        embedUrl: url,
        staticEmbedUrl: url,
        watchUrl: url,
        thumbnail: ''
      };
    }

    return null;
  }

  function buildYouTubeVideoObject(videoId) {
    return {
      platform: 'YouTube',
      type: 'iframe',
      videoId: videoId,
      embedUrl: `https://www.youtube-nocookie.com/embed/${videoId}?autoplay=1&rel=0&modestbranding=1`,
      staticEmbedUrl: `https://www.youtube-nocookie.com/embed/${videoId}?rel=0&modestbranding=1`,
      watchUrl: `https://www.youtube.com/watch?v=${videoId}`,
      thumbnail: `https://i.ytimg.com/vi/${videoId}/hqdefault.jpg`
    };
  }

  function buildCleanVideoSearchQuery(article) {
    const rawTitle = cleanText(article.title || '')
      .replace(/\s+-\s+[^-]+$/, '')
      .replace(/[^\w\s]/g, ' ')
      .split(/\s+/)
      .filter(w => w.length > 2)
      .slice(0, 8)
      .join(' ');
    const channelHint = activeChannelObj.id !== 'all'
      ? activeChannelObj.name
      : (article.source?.name || activeCountryObj.name + ' news');
    return `${rawTitle} ${channelHint}`.trim();
  }

  // Searches YouTube & Piped video indexes for a matching broadcast clip
  async function searchRelatedVideoOnline(query) {
    // Strategy 1: Piped Public Video API (Fast JSON response)
    const pipedHosts = [
      'https://pipedapi.kavin.rocks',
      'https://pipedapi.tokhmi.xyz'
    ];

    for (const host of pipedHosts) {
      try {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), 3200);
        const res = await fetch(`${host}/search?q=${encodeURIComponent(query)}&filter=videos`, {
          signal: controller.signal
        });
        clearTimeout(timer);
        if (res.ok) {
          const data = await res.json();
          const firstItem = Array.isArray(data.items)
            ? data.items.find(it => it.url && it.url.includes('watch?v='))
            : null;
          if (firstItem) {
            const parsed = parseVideoFromTextOrUrl(`https://www.youtube.com${firstItem.url}`);
            if (parsed) return parsed;
          }
        }
      } catch (e) {}
    }

    // Strategy 2: YouTube Search via AllOrigins CORS Proxy (Regex extraction of first videoId)
    try {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 4500);
      const ytSearchUrl = `https://www.youtube.com/results?search_query=${encodeURIComponent(query)}`;
      const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(ytSearchUrl)}`;
      const res = await fetch(proxyUrl, { signal: controller.signal });
      clearTimeout(timer);
      if (res.ok) {
        const data = await res.json();
        const html = data?.contents || '';
        const match = html.match(/"videoId":"([a-zA-Z0-9_-]{11})"/);
        if (match && match[1]) {
          return buildYouTubeVideoObject(match[1]);
        }
      }
    } catch (e) {}

    // Strategy 3: CodeTabs CORS Proxy Backup for YouTube Search
    try {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 4200);
      const ytSearchUrl = `https://www.youtube.com/results?search_query=${encodeURIComponent(query)}`;
      const res = await fetch(`https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(ytSearchUrl)}`, {
        signal: controller.signal
      });
      clearTimeout(timer);
      if (res.ok) {
        const html = await res.text();
        const match = html.match(/"videoId":"([a-zA-Z0-9_-]{11})"/);
        if (match && match[1]) {
          return buildYouTubeVideoObject(match[1]);
        }
      }
    } catch (e) {}

    return null;
  }

  async function resolveVideoForArticle(article, idx, generation) {
    if (!article) return null;

    // 1. Already attached on article object
    if (article.videoData && article.videoData.embedUrl) {
      return article.videoData;
    }

    // 2. Check session cache
    const cacheKey = getArticleKey(article);
    if (cacheKey && videoCache[cacheKey]) {
      article.videoData = videoCache[cacheKey];
      return article.videoData;
    }

    // 3. Check direct fields (article.videoUrl, article.url, raw description)
    const directCandidate =
      parseVideoFromTextOrUrl(article.videoUrl) ||
      parseVideoFromTextOrUrl(article.url) ||
      parseVideoFromTextOrUrl(article.rawMediaUrl) ||
      parseVideoFromTextOrUrl(article.description);

    if (directCandidate) {
      article.videoData = directCandidate;
      if (cacheKey) {
        videoCache[cacheKey] = directCandidate;
        saveVideoCache();
      }
      return directCandidate;
    }

    // 4. Perform live query for related video on YouTube / video platforms
    const searchQuery = buildCleanVideoSearchQuery(article);
    const foundVideo = await searchRelatedVideoOnline(searchQuery);

    if (generation !== currentRenderGeneration) return null;

    if (foundVideo) {
      article.videoData = foundVideo;
      if (cacheKey) {
        videoCache[cacheKey] = foundVideo;
        saveVideoCache();
      }
      return foundVideo;
    }

    return null;
  }

  // Updates a specific card's DOM once its related video is resolved
  function applyVideoToCardDOM(idx, videoData) {
    if (!videoData) return;
    const mediaEl = document.getElementById(`card-media-${idx}`);
    const watchBtn = document.getElementById(`watch-btn-${idx}`);
    const list = getActiveArticlesList();
    const article = list[idx];
    if (!mediaEl || !article) return;

    mediaEl.classList.add('has-video');

    // Backfill thumbnail if the article had no image
    if (!article.urlToImage && videoData.thumbnail) {
      article.urlToImage = videoData.thumbnail;
      const fallbackSpan = mediaEl.querySelector('.media-fallback');
      if (fallbackSpan) {
        const img = document.createElement('img');
        img.src = videoData.thumbnail;
        img.alt = '';
        img.loading = 'lazy';
        fallbackSpan.replaceWith(img);
      }
    }

    // Add platform badge & play overlay if not currently playing an iframe
    if (!mediaEl.querySelector('.card-video-frame-wrap')) {
      let pill = mediaEl.querySelector('.video-platform-pill');
      if (!pill) {
        pill = document.createElement('div');
        pill.className = 'video-platform-pill';
        pill.onclick = (e) => {
          e.stopPropagation();
          loadVideoInCard(idx, true);
        };
        mediaEl.appendChild(pill);
      }
      pill.innerHTML = `<span class="video-platform-dot"></span><span>${escapeHTML(videoData.platform)}</span>`;

      let overlay = mediaEl.querySelector('.video-play-overlay');
      if (!overlay) {
        overlay = document.createElement('div');
        overlay.className = 'video-play-overlay';
        overlay.title = `Play related ${videoData.platform} video inside card`;
        overlay.onclick = () => loadVideoInCard(idx, true);
        overlay.innerHTML = `
          <div class="video-play-btn">
            <svg class="icon" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>
          </div>
        `;
        mediaEl.appendChild(overlay);
      }
    }

    if (watchBtn) {
      watchBtn.classList.add('ready');
      watchBtn.title = `Watch related ${videoData.platform} video in card`;
      watchBtn.querySelector('span').innerText = videoData.platform === 'YouTube' ? 'YouTube' : 'Video';
    }

    // If Auto-Embed mode is turned ON, immediately mount the embedded player inside the card
    if (autoEmbedVideos) {
      loadVideoInCard(idx, false);
    }
  }

  // Mounts or closes the embedded video player inside the news card
  async function toggleCardVideo(idx) {
    const card = document.getElementById(`card-${idx}`);
    if (!card) return;

    if (card.classList.contains('playing-video')) {
      closeVideoInCard(idx);
      return;
    }

    const list = getActiveArticlesList();
    const article = list[idx];
    if (!article) return;

    if (!article.videoData) {
      showToast('Searching related broadcast video...');
      const resolved = await resolveVideoForArticle(article, idx, currentRenderGeneration);
      if (!resolved) {
        // Fallback: open targeted YouTube search in new tab if all proxies are blocked
        const fallbackQuery = buildCleanVideoSearchQuery(article);
        window.open(`https://www.youtube.com/results?search_query=${encodeURIComponent(fallbackQuery)}`, '_blank', 'noopener');
        return;
      }
      applyVideoToCardDOM(idx, resolved);
    }

    loadVideoInCard(idx, true);
  }

  function loadVideoInCard(idx, autoplay = true) {
    const list = getActiveArticlesList();
    const article = list[idx];
    const mediaEl = document.getElementById(`card-media-${idx}`);
    const card = document.getElementById(`card-${idx}`);
    const watchBtn = document.getElementById(`watch-btn-${idx}`);
    if (!article || !article.videoData || !mediaEl || !card) return;

    // If user initiated autoplay, stop any active TTS speech and close any other playing card
    if (autoplay) {
      stopAudio(false);
      if (activePlayingVideoIdx !== null && activePlayingVideoIdx !== idx) {
        closeVideoInCard(activePlayingVideoIdx);
      }
      activePlayingVideoIdx = idx;
      document.getElementById('audioStatus').innerText = `Playing ${article.videoData.platform} • Story #${idx + 1}`;
    }

    const vData = article.videoData;
    const srcUrl = autoplay ? vData.embedUrl : vData.staticEmbedUrl;

    card.classList.add('playing-video');
    if (watchBtn) {
      watchBtn.innerHTML = `
        <svg class="icon" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        <span>Close</span>
      `;
    }

    const playerMarkup = vData.type === 'native'
      ? `<video class="card-video-native" src="${escapeHTML(srcUrl)}" controls ${autoplay ? 'autoplay' : ''} playsinline></video>`

  // Queue background discovery of related videos for all rendered cards
  async function discoverVideosForVisibleCards(generation) {
    const list = getActiveArticlesList();
    const concurrency = 3;
    let cursor = 0;

    async function worker() {
      while (cursor < list.length && generation === currentRenderGeneration) {
        const idx = cursor++;
        const art = list[idx];
        const videoData = await resolveVideoForArticle(art, idx, generation);
        if (generation === currentRenderGeneration && videoData) {
          applyVideoToCardDOM(idx, videoData);
        }
      }
    }

    const workers = Array.from({ length: Math.min(concurrency, list.length) }, () => worker());
    await Promise.all(workers);
  }

    if (!synth) return;

    selectEl.innerHTML = '';

    const qualityKeywords = ['en-IN', 'en_IN', 'India', 'Google', 'Natural', 'Online', 'Siri', 'Samantha'];
    englishVoices.sort((a, b) => {
      const aScore = qualityKeywords.some(k => a.name.includes(k) || a.lang.includes(k)) ? 1 : 0;
      const bScore = qualityKeywords.some(k => b.name.includes(k) || b.lang.includes(k)) ? 1 : 0;
      return bScore - aScore;
    });

    const savedVoiceName = localStorage.getItem('newsVoiceName');

  function escapeHTML(str) {
    if (!str) return '';
    return str.replace(/[&<>"']/g, m => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[m]));
  }

  function cleanText(txt) {
    if (!txt) return '';
    return txt
      .replace(/<!\[CDATA\[([\s\S]*?)\]\]>/gi, '$1')
      .replace(/<[^>]*>/g, ' ')
      .replace(/&nbsp;/gi, ' ')
      .replace(/&amp;/gi, '&')
      .replace(/&quot;/gi, '"')
      .replace(/&#39;/gi, "'")
      .replace(/https?:\/\/\S+/gi, '')
      .replace(/\[\+\d+\s+chars\]/gi, '')
      .replace(/\s+/g, ' ')
      .trim();
  }

  function formatRelativeTime(dateString) {
    if (!dateString) return 'LIVE';
    const date = new Date(dateString);
    if (isNaN(date.getTime())) return 'LIVE';
    const diffMins = Math.floor((Date.now() - date.getTime()) / 60000);
    if (diffMins < 60) return `${Math.max(1, diffMins)}M AGO`;
    const diffHours = Math.floor(diffMins / 60);
    if (diffHours < 24) return `${diffHours}H AGO`;
    return date.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }).toUpperCase();
  }

  // AI Summarizer Engine
  function buildLocalArticleAISummary(art) {
    const title = cleanText(art.title).replace(/\s+-\s+[^-]+$/, '');
    const desc = cleanText(art.description || '');
    const source = art.source?.name || activeChannelObj.name;

    const sentences = desc.split(/(?<=[.!?])\s+/).filter(s => s.length > 20);
    const point1 = sentences[0] || `Coverage from ${source} examining ${title.toLowerCase()}.`;
    const point2 = sentences[1] || `Developing implications across ${activeCountryObj.name}'s ${activeCategory} landscape.`;

    return {
      tldr: title,
      bullets: [
        point1,
        point2,
        `Source: ${source}`
      ],
      speech: `Summary for ${title}. ${point1} ${point2}`
    };
  }

  async function toggleArticleAISummary(idx) {
    const list = getActiveArticlesList();
    const accordion = document.getElementById(`ai-acc-${idx}`);
    const contentEl = document.getElementById(`ai-content-${idx}`);
    const art = list[idx];
    if (!accordion || !art) return;

    if (accordion.classList.contains('open') && art._aiReady) {
      accordion.classList.remove('open');
      return;
    }

    accordion.classList.add('open');
    if (art._aiReady && contentEl.innerHTML.trim() !== '') return;

    contentEl.innerHTML = `<span style="color:var(--text-tertiary);">Synthesizing key takeaways...</span>`;

    const title = cleanText(art.title);
    const desc = cleanText(art.description || '');
    const fallback = buildLocalArticleAISummary(art);

    try {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 4500);

      const prompt = `Summarize this news article in 2 concise bullet points (under 40 words total). Plain text only, no markdown:\nTitle: ${title}\nDetails: ${desc}`;
      const res = await fetch(`https://text.pollinations.ai/${encodeURIComponent(prompt)}`, {
        signal: controller.signal
      });
      clearTimeout(timer);

      if (res.ok) {
        const aiText = cleanText(await res.text());
        if (aiText && aiText.length > 25) {
          const lines = aiText.split(/(?:\r?\n|•|- )+/).map(s => s.trim()).filter(s => s.length > 12).slice(0, 3);
          const bulletsHTML = (lines.length ? lines : [aiText]).map(l => `<li>${escapeHTML(l)}</li>`).join('');
          contentEl.innerHTML = `
            <div style="color:var(--text-primary);font-weight:500;">${escapeHTML(fallback.tldr)}</div>
            <ul>${bulletsHTML}</ul>
          `;
          art._aiSpeech = `AI Summary: ${aiText}`;
          art._aiReady = true;
          return;
        }
      }
    } catch (e) {}

    contentEl.innerHTML = `
      <div style="color:var(--text-primary);font-weight:500;">${escapeHTML(fallback.tldr)}</div>
      <ul>${fallback.bullets.map(b => `<li>${escapeHTML(b)}</li>`).join('')}</ul>
    `;
    art._aiSpeech = fallback.speech;
    art._aiReady = true;
  }

  async function generateChannelAISummary() {
    const list = getActiveArticlesList();
    if (!list.length) {
      showToast('No articles available to summarize');
      return;
    }

    const drawer = document.getElementById('aiBriefingDrawer');
    const titleEl = document.getElementById('aiBriefingTitle');
    const contentEl = document.getElementById('aiBriefingContent');

    const contextLabel = currentView === 'bookmarks' ? 'Saved Bookmarks' : activeChannelObj.name;
    drawer.classList.add('open');
    titleEl.innerText = `AI Executive Brief — ${contextLabel}`;
    contentEl.innerHTML = `<span style="color:var(--text-tertiary);">Synthesizing top stories from ${escapeHTML(contextLabel)}...</span>`;

    const top5 = list.slice(0, 5);
    const headlinesList = top5.map((a, i) => `${i + 1}. ${cleanText(a.title)}: ${cleanText(a.description)}`).join('\n');

    const fallbackOverview = `Executive synthesis of the top ${top5.length} stories from ${contextLabel}:`;
    const fallbackBullets = top5.map(a => {
      const t = cleanText(a.title).replace(/\s+-\s+[^-]+$/, '');
      const d = cleanText(a.description || '').split(/(?<=[.!?])\s+/)[0] || '';
      return `<strong style="color:var(--text-primary);">${escapeHTML(t)}:</strong> ${escapeHTML(d)}`;
    });

    lastChannelAISummarySpeech = `Executive Briefing for ${contextLabel}. ` +
      top5.map((a, i) => `Story ${i + 1}: ${cleanText(a.title)}.`).join(' ');

    try {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 5000);
      const prompt = `Write a 2-sentence executive news briefing summarizing these headlines from ${contextLabel}. Plain text only:\n${headlinesList}`;
      const res = await fetch(`https://text.pollinations.ai/${encodeURIComponent(prompt)}`, {
        signal: controller.signal
      });
      clearTimeout(timer);

      if (res.ok) {
        const aiIntro = cleanText(await res.text());
        if (aiIntro && aiIntro.length > 30) {
          contentEl.innerHTML = `
            <p>${escapeHTML(aiIntro)}</p>
            <ul>${fallbackBullets.map(b => `<li>${b}</li>`).join('')}</ul>
          `;
          lastChannelAISummarySpeech = `Executive Briefing for ${contextLabel}. ${aiIntro} ` +
            top5.map((a, i) => `Highlight ${i + 1}: ${cleanText(a.title)}.`).join(' ');
          return;
        }
      }
    } catch (e) {}

    contentEl.innerHTML = `
      <p>${escapeHTML(fallbackOverview)}</p>
      <ul>${fallbackBullets.map(b => `<li>${b}</li>`).join('')}</ul>
    `;
  }

  const PLAY_ICON = `<svg class="icon" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>`;
  const PAUSE_ICON = `<svg class="icon" viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>`;
  const STOP_SM_ICON = `<svg class="icon" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>`;
  const LISTEN_SM_ICON = `<svg class="icon" viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>`;

  function updateCardHighlight(articleIdx) {
    activeArticleIndex = articleIdx;
    document.querySelectorAll('.card').forEach((card, idx) => {
      const btn = card.querySelector('.btn-listen-card');
      if (idx === articleIdx) {

  function setControlsState(isPlaying, hasNext = false) {
    const pauseBtn = document.getElementById('pauseBtn');
    const nextBtn = document.getElementById('nextBtn');
    const wf = document.getElementById('waveform');
    pauseBtn.disabled = !isPlaying;
    nextBtn.disabled = !hasNext;
    if (isPlaying) {
      wf.classList.add('playing');
      pauseBtn.innerHTML = PAUSE_ICON;
    } else {
      wf.classList.remove('playing');
      pauseBtn.innerHTML = PAUSE_ICON;
    }

  function playQueue(items) {
    if (!('speechSynthesis' in window)) {
      alert("Speech synthesis is not supported on this browser.");
      return;
    }
    if (activePlayingVideoIdx !== null) {
      closeVideoInCard(activePlayingVideoIdx);
    }
    stopAudio(false);
    isCancelled = false;
    audioQueue = items;
    currentQueuePos = 0;
    playCurrentQueueItem();
  }

  function playCurrentQueueItem() {
    if (isCancelled || currentQueuePos < 0 || currentQueuePos >= audioQueue.length) {
      stopAudio(true);
      return;
    }

    const item = audioQueue[currentQueuePos];
    const utterance = new SpeechSynthesisUtterance(item.text);

    if (selectedVoice) {
      utterance.voice = selectedVoice;
      utterance.lang = selectedVoice.lang;
    } else {
      utterance.lang = activeCountryObj.code === 'in' ? 'en-IN' : 'en-US';
    }

    utterance.rate = parseFloat(speedSelect.value) || 1.0;
    utterance.pitch = 1.0;

    utterance.onstart = () => {
      document.getElementById('audioStatus').innerText = item.status || "Broadcasting...";
      updateCardHighlight(item.articleIndex);
      setControlsState(true, currentQueuePos < audioQueue.length - 1);
    };

    utterance.onend = () => {
      if (isCancelled) return;
      currentQueuePos++;
      if (currentQueuePos < audioQueue.length) {
        playCurrentQueueItem();
      } else {
        stopAudio(true);
      }
    };

    utterance.onerror = () => {
      if (!isCancelled) stopAudio(true);
    };

    synth.speak(utterance);
  }

  function stopAudio(resetStatus = true) {
    isCancelled = true;
    audioQueue = [];
    currentQueuePos = -1;
    if (synth) synth.cancel();
    updateCardHighlight(null);
    setControlsState(false, false);
    if (resetStatus) {
      document.getElementById('audioStatus').innerText = "Audio & Video Studio Ready";
    }
  }

  function togglePause() {
    if (!synth) return;
    const pauseBtn = document.getElementById('pauseBtn');
    const wf = document.getElementById('waveform');
    if (synth.paused) {
      synth.resume();
      pauseBtn.innerHTML = PAUSE_ICON;
      wf.classList.add('playing');
      document.getElementById('audioStatus').innerText = "Playback Resumed";
    } else if (synth.speaking) {
      synth.pause();
      pauseBtn.innerHTML = PLAY_ICON;
      wf.classList.remove('playing');
      document.getElementById('audioStatus').innerText = "Playback Paused";
    }
  }

  function skipNext() {
    if (currentQueuePos < audioQueue.length - 1) {
      isCancelled = true;
      synth.cancel();
      isCancelled = false;
      currentQueuePos++;
      playCurrentQueueItem();
    }
  }

    queue.push({

          <p>Click the <strong>Save</strong> button on any news card in the live feed to build your personal reading, video, and audio list.</p>

        </div>
      `;
      return;
    }

    list.forEach((article, idx) => {
      const displayChannel = currentView === 'bookmarks'
        ? (article.source?.name || 'Saved Dispatch')
        : (activeChannelObj.id !== 'all' ? activeChannelObj.name : (article.source?.name || activeCountryObj.name + ' Desk'));

      const isoTag = currentView === 'bookmarks'
        ? (article.countryIso || 'SAVED')
        : activeCountryObj.iso;

      const sourceName = escapeHTML(displayChannel);
      const dateStr = formatRelativeTime(article.publishedAt);
      const title = escapeHTML(cleanText(article.title));

      const desc = escapeHTML(rawDesc && rawDesc !== cleanText(article.title) ? rawDesc : `Full dispatch and live updates available via ${displayChannel}.`);
      const isQueued = savedQueueIndices.includes(idx);
      const isBookmarked = isArticleBookmarked(article);
      const hasVideoReady = Boolean(article.videoData && article.videoData.embedUrl);

      const card = document.createElement('article');
      card.id = `card-${idx}`;

          </div>

          <div class="card-footer">

                <svg class="icon" viewBox="0 0 24 24"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>
                <span>AI</span>
              </button>

              <button class="btn btn-sm btn-watch-card ${hasVideoReady ? 'ready' : ''}" id="watch-btn-${idx}" onclick="toggleCardVideo(${idx})" title="Watch related video inside card">
                <svg class="icon" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><polygon points="10 9 15 12 10 15 10 9"/></svg>
                <span>${hasVideoReady && article.videoData.platform === 'YouTube' ? 'YouTube' : 'Video'}</span>
              </button>

              <button class="btn btn-sm btn-listen-card" onclick="readSingleArticle(${idx})">
                ${activeArticleIndex === idx ? `${STOP_SM_ICON}<span>Stop</span>` : `${LISTEN_SM_ICON}<span>Listen</span>`}
              </button>

              <button class="btn btn-sm btn-save-card ${isBookmarked ? 'saved' : ''}" id="save-btn-${idx}" onclick="toggleBookmarkArticle(${idx})" title="Save to Bookmarks">
                ${getBookmarkButtonInner(isBookmarked)}
              </button>

              <button class="btn btn-sm btn-icon-only btn-queue-card ${isQueued ? 'queued' : ''}" onclick="toggleQueueArticle(${idx})" title="Add to Audio Queue">
                ${isQueued
                  ? `<svg class="icon" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>`
                  : `<svg class="icon" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>`
                }
              </button>
            </div>
            <a href="${escapeHTML(article.url || '#')}" class="external-link" target="_blank" rel="noopener noreferrer">
              <span>Read</span>
              <svg class="icon" viewBox="0 0 24 24"><line x1="7" y1="17" x2="17" y2="7"/><polyline points="7 7 17 7 17 17"/></svg>
            </a>
          </div>
        </div>
      `;
      grid.appendChild(card);

      if (hasVideoReady) {
        applyVideoToCardDOM(idx, article.videoData);
      }
    });

    // Trigger asynchronous video discovery for all visible cards
    discoverVideosForVisibleCards(renderGen);
  }

  // Layer 2: XML RSS Parser Backup (Also extracts <media:content>, <enclosure>, or <yt:videoId>)
  async function fetchViaXmlProxy(rssUrl) {
    const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(rssUrl)}`;
    const res = await fetch(proxyUrl);
    const data = await res.json();
    if (!data.contents) throw new Error('Empty proxy response');

    const parser = new DOMParser();
    const xml = parser.parseFromString(data.contents, "text/xml");
    const items = Array.from(xml.querySelectorAll("item, entry")).slice(0, 18);
    if (!items.length) throw new Error('No XML items');

    return items.map(item => {
      const title = item.querySelector("title")?.textContent || '';
      const desc = item.querySelector("description, summary, content")?.textContent || '';
      const linkNode = item.querySelector("link");
      const link = linkNode?.getAttribute("href") || linkNode?.textContent || '#';
      const pubDate = item.querySelector("pubDate, published, updated")?.textContent || new Date().toISOString();

      let img = '';
      let rawMediaUrl = '';

      const mediaElements = Array.from(item.getElementsByTagNameNS('*', 'content')).concat(
        Array.from(item.getElementsByTagNameNS('*', 'thumbnail')),
        Array.from(item.querySelectorAll('enclosure'))
      );

      for (const el of mediaElements) {
        const urlAttr = el.getAttribute('url') || '';
        const typeAttr = (el.getAttribute('type') || '').toLowerCase();
        const mediumAttr = (el.getAttribute('medium') || '').toLowerCase();

        if (!rawMediaUrl && (typeAttr.includes('video') || mediumAttr === 'video' || parseVideoFromTextOrUrl(urlAttr))) {
          rawMediaUrl = urlAttr;
        }
        if (!img && (typeAttr.includes('image') || mediumAttr === 'image' || /\.(jpg|jpeg|png|webp)/i.test(urlAttr))) {
          img = urlAttr;
        }
      }

      if (!img) {
        const match = desc.match(/<img[^>]+src=["']([^"'>]+)["']/i);
        if (match) img = match[1];
      }

      const ytIdNode = item.getElementsByTagNameNS('*', 'videoId')[0];
      if (ytIdNode && ytIdNode.textContent) {
        rawMediaUrl = `https://www.youtube.com/watch?v=${ytIdNode.textContent.trim()}`;
      }

      const directVideo =
        parseVideoFromTextOrUrl(rawMediaUrl) ||
        parseVideoFromTextOrUrl(link) ||
        parseVideoFromTextOrUrl(desc);

      return {
        source: { name: activeChannelObj.name },
        title: cleanText(title),
        description: cleanText(desc),
        url: link,
        urlToImage: img || (directVideo?.thumbnail || ''),
        rawMediaUrl: rawMediaUrl,
        videoData: directVideo || null,
        publishedAt: pubDate
      };
    });
  }

  async function fetchNews(userQuery = '') {
    if (currentView === 'bookmarks') {
      switchView('feed');
    }
    stopAudio();
    showSkeletons();
    savedQueueIndices = [];
    document.getElementById('queueCountText').innerText = '0';
    document.getElementById('queuePlayBtn').disabled = true;

    const topicPart = activeCategory !== 'general' ? activeCategory : '';
    const combinedQuery = [userQuery, activeChannelObj.query, topicPart].filter(Boolean).join(' ').trim();

    // Layer 1: Vercel /api/news backend
    try {
      const apiUrl = `/api/news?category=${encodeURIComponent(activeCategory)}&q=${encodeURIComponent(combinedQuery)}`;
      const response = await fetch(apiUrl);
      const data = await response.json();

      if (data.status === 'ok' && Array.isArray(data.articles) && data.articles.length > 0) {
        const valid = data.articles.filter(a => a.title && !a.title.includes('[Removed]'));
        if (valid.length > 0) {
          fetchedArticles = valid;
          renderArticles();
          return;
        }
      }
    } catch (e) {}

    // Layer 2: XML RSS Proxy
    if (activeChannelObj.rss && !userQuery) {
      try {
        const xmlArticles = await fetchViaXmlProxy(activeChannelObj.rss);
        if (xmlArticles && xmlArticles.length > 0) {
          fetchedArticles = xmlArticles;
          renderArticles();
          return;
        }
      } catch (e) {}
    }

    // Layer 3: Curated Fallback
    fetchedArticles = getChannelFallbackArticles(userQuery);
    renderArticles();
  }

  document.getElementById('categoryGroup').addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (btn) {
      document.querySelectorAll('#categoryGroup button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeCategory = btn.dataset.cat;
      document.getElementById('searchInput').value = '';
      document.getElementById('aiBriefingDrawer').classList.remove('open');
      fetchNews();
    }
  });

  function triggerSearch() {
    const query = document.getElementById('searchInput').value.trim();
    if (query) fetchNews(query);
  }

  document.getElementById('searchInput').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') triggerSearch();
  });

  // Initialize
  updateBookmarkNavUI();
  renderCountryStrip();
  renderChannelStrip();
  updateSelectionLabel();
  fetchNews();
</script>
