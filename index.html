<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pulse — Global & India News Intelligence</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #fafafa;
      --surface: #ffffff;
      --surface-elevated: #f4f4f5;
      --surface-hover: #e4e4e7;
      --glass: rgba(255, 255, 255, 0.86);
      --text-primary: #09090b;
      --text-secondary: #52525b;
      --text-tertiary: #71717a;
      --border: #e4e4e7;
      --border-strong: #d4d4d8;
      --accent: #09090b;
      --accent-fg: #ffffff;
      --brand: #2563eb;
      --brand-soft: rgba(37, 99, 235, 0.08);
      --danger: #dc2626;
      --danger-soft: rgba(220, 38, 38, 0.1);
      --success: #16a34a;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
      --shadow-md: 0 8px 24px -4px rgba(0, 0, 0, 0.06);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    }

    body.dark {
      --bg: #09090b;
      --surface: #121215;
      --surface-elevated: #1c1c21;
      --surface-hover: #27272e;
      --glass: rgba(18, 18, 21, 0.86);
      --text-primary: #fafafa;
      --text-secondary: #a1a1aa;
      --text-tertiary: #71717a;
      --border: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(255, 255, 255, 0.16);
      --accent: #fafafa;
      --accent-fg: #09090b;
      --brand: #3b82f6;
      --brand-soft: rgba(59, 130, 246, 0.14);
      --danger: #ef4444;
      --danger-soft: rgba(239, 68, 68, 0.15);
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 12px 32px -4px rgba(0, 0, 0, 0.5);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      color: var(--text-secondary);
      line-height: 1.5;
      padding: 0 16px 80px 16px;
      transition: background-color 0.3s var(--ease-out), color 0.3s var(--ease-out);
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    /* Icon Utility */
    .icon {
      width: 15px;
      height: 15px;
      stroke: currentColor;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      flex-shrink: 0;
    }

    /* Top Editorial Masthead */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 0 16px 0;
      border-bottom: 1px solid var(--border);
      margin-bottom: 16px;
      gap: 12px;
      flex-wrap: wrap;
    }

    .brand-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      background: var(--accent);
      color: var(--accent-fg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: -0.03em;
    }

    .brand-titles h1 {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.025em;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.65rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 2px 7px;
      border-radius: 99px;
      background: var(--surface-elevated);
      color: var(--text-secondary);
      border: 1px solid var(--border);
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 8px var(--success);
    }

    .brand-titles p {
      font-size: 0.78rem;
      color: var(--text-tertiary);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Button System */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-family: inherit;
      font-size: 0.78rem;
      font-weight: 500;
      padding: 7px 12px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-primary);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.18s var(--ease-out);
      user-select: none;
    }

    .btn:hover:not(:disabled) {
      background: var(--surface-elevated);
      border-color: var(--border-strong);
    }

    .btn:active:not(:disabled) {
      transform: scale(0.97);
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--accent);
      color: var(--accent-fg);
      border-color: var(--accent);
      font-weight: 600;
    }

    .btn-primary:hover:not(:disabled) {
      opacity: 0.9;
      background: var(--accent);
      border-color: var(--accent);
    }

    .btn-brand {
      background: var(--brand-soft);
      color: var(--brand);
      border-color: rgba(59, 130, 246, 0.25);
      font-weight: 600;
    }

    .btn-brand:hover:not(:disabled) {
      background: var(--brand);
      color: #ffffff;
      border-color: var(--brand);
    }

    .btn-danger {
      background: var(--danger-soft);
      color: var(--danger);
      border-color: transparent;
    }

    .btn-danger:hover:not(:disabled) {
      background: var(--danger);
      color: #ffffff;
    }

    .btn-icon-only {
      padding: 7px;
    }

    /* Sticky Broadcast & AI Studio Bar */
    .studio-bar {
      position: sticky;
      top: 12px;
      z-index: 90;
      background: var(--glass);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-md);
      padding: 10px 14px;
      margin-bottom: 16px;
      box-shadow: var(--shadow-md);
      transition: border-color 0.25s var(--ease-out);
    }

    .studio-main {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .studio-status {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 200px;
      flex: 1;
    }

    /* Minimal Audio Waveform */
    .waveform {
      display: inline-flex;
      align-items: center;
      gap: 2.5px;
      height: 16px;
      padding: 0 4px;
    }

    .wave-bar {
      width: 2.5px;
      height: 4px;
      border-radius: 99px;
      background: var(--text-tertiary);
      transition: height 0.2s ease, background-color 0.2s ease;
    }

    .waveform.playing .wave-bar {
      background: var(--brand);
    }

    .waveform.playing .wave-bar:nth-child(1) { animation: sound 0.65s infinite ease-in-out; }
    .waveform.playing .wave-bar:nth-child(2) { animation: sound 0.65s infinite ease-in-out 0.15s; }
    .waveform.playing .wave-bar:nth-child(3) { animation: sound 0.65s infinite ease-in-out 0.3s; }
    .waveform.playing .wave-bar:nth-child(4) { animation: sound 0.65s infinite ease-in-out 0.1s; }

    @keyframes sound {
      0%, 100% { height: 4px; }
      50% { height: 15px; }
    }

    .status-text {
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 380px;
    }

    .studio-controls {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    /* Collapsible Audio Settings Tray */
    .studio-drawer {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows 0.28s var(--ease-out);
    }

    .studio-drawer.open {
      grid-template-rows: 1fr;
    }

    .studio-drawer-inner {
      overflow: hidden;
    }

    .studio-settings-row {
      padding-top: 10px;
      margin-top: 10px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      font-size: 0.76rem;
      color: var(--text-secondary);
    }

    .setting-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .select-minimal {
      font-family: inherit;
      font-size: 0.76rem;
      padding: 5px 8px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--surface-elevated);
      color: var(--text-primary);
      outline: none;
      max-width: 210px;
    }

    /* Collapsible AI Executive Briefing Drawer */
    .ai-drawer {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows 0.35s var(--ease-out), margin-bottom 0.35s var(--ease-out);
      margin-bottom: 0;
    }

    .ai-drawer.open {
      grid-template-rows: 1fr;
      margin-bottom: 16px;
    }

    .ai-drawer-inner {
      overflow: hidden;
    }

    .ai-brief-card {
      background: var(--surface);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-md);
      padding: 16px 18px;
      box-shadow: var(--shadow-sm);
    }

    .ai-brief-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }

    .ai-brief-title {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-primary);
    }

    .ai-brief-title .icon {
      color: var(--brand);
    }

    .ai-brief-body {
      font-size: 0.84rem;
      color: var(--text-secondary);
      line-height: 1.6;
    }

    .ai-brief-body p {
      color: var(--text-primary);
      font-weight: 500;
      margin-bottom: 10px;
    }

    .ai-brief-body ul {
      padding-left: 18px;
      display: grid;
      gap: 6px;
    }

    /* Unified Filter & Navigation Deck */
    .nav-deck {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 12px 14px;
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: var(--shadow-sm);
    }

    .deck-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .active-crumb {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      color: var(--text-tertiary);
    }

    .active-crumb strong {
      color: var(--text-primary);
      font-weight: 600;
    }

    /* Search Input */
    .search-wrap {
      position: relative;
      flex: 1;
      max-width: 340px;
      min-width: 200px;
      display: flex;
      align-items: center;
    }

    .search-wrap .icon {
      position: absolute;
      left: 10px;
      color: var(--text-tertiary);
      pointer-events: none;
    }

    .search-wrap input {
      width: 100%;
      padding: 6px 64px 6px 32px;
      font-family: inherit;
      font-size: 0.8rem;
      background: var(--surface-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-primary);
      outline: none;
      transition: border-color 0.2s ease, background-color 0.2s ease;
    }

    .search-wrap input:focus {
      background: var(--surface);
      border-color: var(--text-primary);
    }

    .search-submit {
      position: absolute;
      right: 4px;
      padding: 3px 8px;
      font-size: 0.7rem;
      font-weight: 600;
      border-radius: 5px;
      border: none;
      background: var(--surface);
      color: var(--text-secondary);
      cursor: pointer;
      border: 1px solid var(--border);
    }

    .search-submit:hover {
      color: var(--text-primary);
    }

    /* Horizontal Pill Strips */
    .strip-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .strip-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.66rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-tertiary);
      min-width: 58px;
      flex-shrink: 0;
    }

    .scroll-strip {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      -ms-overflow-style: none;
      padding: 2px 0;
      flex: 1;
    }

    .scroll-strip::-webkit-scrollbar {
      display: none;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 11px;
      border-radius: 7px;
      font-size: 0.76rem;
      font-weight: 500;
      color: var(--text-secondary);
      background: transparent;
      border: 1px solid transparent;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      transition: all 0.16s var(--ease-out);
    }

    .pill:hover {
      color: var(--text-primary);
      background: var(--surface-elevated);
    }

    .pill.active {
      background: var(--surface-elevated);
      color: var(--text-primary);
      border-color: var(--border-strong);
      font-weight: 600;
      box-shadow: var(--shadow-sm);
    }

    .pill-country.active {
      background: var(--accent);
      color: var(--accent-fg);
      border-color: var(--accent);
    }

    .channel-indicator {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .divider {
      height: 1px;
      background: var(--border);
      margin: 2px 0;
    }

    /* Editorial News Grid & Cards */
    .news-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 18px;
    }

    @keyframes cardEnter {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.28s var(--ease-out), border-color 0.28s var(--ease-out), box-shadow 0.28s var(--ease-out);
      animation: cardEnter 0.45s var(--ease-out) backwards;
      animation-delay: calc(var(--i, 0) * 35ms);
    }

    .card:hover {
      transform: translateY(-3px);
      border-color: var(--border-strong);
      box-shadow: var(--shadow-md);
    }

    .card.speaking {
      border-color: var(--brand);
      box-shadow: 0 0 0 1px var(--brand), var(--shadow-md);
    }

    .card-media {
      width: 100%;
      height: 176px;
      background: var(--surface-elevated);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid var(--border);
    }

    .card-media img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.5s var(--ease-out);
    }

    .card:hover .card-media img {
      transform: scale(1.03);
    }

    .media-fallback {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-tertiary);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 16px;
      text-align: center;
    }

    .card-badge {
      position: absolute;
      top: 10px;
      left: 10px;
      background: var(--glass);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: var(--text-primary);
      border: 1px solid var(--border);
      padding: 3px 8px;
      border-radius: 6px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.66rem;
      font-weight: 600;
    }

    .card-body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .card-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.68rem;
      color: var(--text-tertiary);
    }

    .source-name {
      color: var(--text-secondary);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .card-title {
      font-size: 0.96rem;
      font-weight: 600;
      color: var(--text-primary);
      line-height: 1.42;
      letter-spacing: -0.01em;
      margin-bottom: 8px;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-desc {
      font-size: 0.82rem;
      color: var(--text-secondary);
      line-height: 1.55;
      margin-bottom: 14px;
      flex: 1;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Smooth Accordion for Per-Card AI Summary */
    .card-ai-accordion {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows 0.28s var(--ease-out);
    }

    .card-ai-accordion.open {
      grid-template-rows: 1fr;
    }

    .card-ai-inner {
      overflow: hidden;
    }

    .card-ai-box {
      background: var(--surface-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      margin-bottom: 12px;
      font-size: 0.78rem;
      color: var(--text-secondary);
      line-height: 1.5;
    }

    .card-ai-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.66rem;
      font-weight: 600;
      color: var(--brand);
      text-transform: uppercase;
    }

    .card-ai-box ul {
      padding-left: 15px;
      margin-top: 5px;
      display: grid;
      gap: 4px;
    }

    .card-footer {
      border-top: 1px solid var(--border);
      padding-top: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .card-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-sm {
      padding: 5px 9px;
      font-size: 0.73rem;
      border-radius: 6px;
    }

    .card.speaking .btn-listen-card {
      background: var(--brand);
      color: #ffffff;
      border-color: var(--brand);
    }

    .btn-queue-card.queued {
      background: var(--accent);
      color: var(--accent-fg);
      border-color: var(--accent);
    }

    .external-link {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-primary);
      text-decoration: none;
      transition: opacity 0.15s ease;
    }

    .external-link:hover {
      opacity: 0.7;
    }

    /* Refined Shimmer Skeletons */
    .skeleton {
      background: linear-gradient(90deg, var(--surface-elevated) 25%, var(--surface-hover) 50%, var(--surface-elevated) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
    }

    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    @media (max-width: 640px) {
      body { padding: 0 12px 64px 12px; }
      header { padding: 14px 0 12px 0; }
      .search-wrap { max-width: 100%; width: 100%; order: 3; }
      .status-text { max-width: 220px; }
    }
  </style>
</head>
<body class="dark">

<div class="container">
  <!-- Minimal Editorial Masthead -->
  <header>
    <div class="brand-left">
      <div class="brand-mark">P</div>
      <div class="brand-titles">
        <h1>
          Pulse News
          <span class="status-pill"><span class="status-dot"></span> Live Feed</span>
        </h1>
        <p>Global & Indian Broadcast Intelligence • AI Synthesis</p>
      </div>
    </div>

    <div class="header-actions">
      <button class="btn" onclick="fetchNews()" title="Refresh feed">
        <svg class="icon" viewBox="0 0 24 24"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 16h5v5"/></svg>
        <span>Refresh</span>
      </button>
      <button class="btn btn-icon-only" id="themeToggle" onclick="toggleTheme()" title="Toggle theme" aria-label="Toggle theme"></button>
    </div>
  </header>

  <!-- Sleek Floating Studio & AI Control Bar -->
  <div class="studio-bar">
    <div class="studio-main">
      <div class="studio-status">
        <div class="waveform" id="waveform">

  // Voice Loader

    if (!synth) return;
    const allVoices = synth.getVoices();
    englishVoices = allVoices.filter(v => v.lang.startsWith('en'));
    if (englishVoices.length === 0) return;

    const selectEl = document.getElementById('voiceSelect');
    selectEl.innerHTML = '';

    const qualityKeywords = ['en-IN', 'en_IN', 'India', 'Google', 'Natural', 'Online', 'Siri', 'Samantha'];
    englishVoices.sort((a, b) => {
      const aScore = qualityKeywords.some(k => a.name.includes(k) || a.lang.includes(k)) ? 1 : 0;
      const bScore = qualityKeywords.some(k => b.name.includes(k) || b.lang.includes(k)) ? 1 : 0;
      return bScore - aScore;
    });

    const savedVoiceName = localStorage.getItem('newsVoiceName');
    let defaultIndex = 0;

    englishVoices.forEach((voice, index) => {
      const option = document.createElement('option');
      option.value = index;
      option.textContent = `${voice.name} (${voice.lang})`;
      selectEl.appendChild(option);
      if (savedVoiceName && voice.name === savedVoiceName) {
        defaultIndex = index;
      }
    });

    selectedVoice = englishVoices[defaultIndex];
    selectEl.value = defaultIndex;

    selectEl.onchange = (e) => {
      selectedVoice = englishVoices[e.target.value];
      localStorage.setItem('newsVoiceName', selectedVoice.name);
    };
  }

  function escapeHTML(str) {
    if (!str) return '';
    return str.replace(/[&<>"']/g, m => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[m]));
  }

  function cleanText(txt) {
    if (!txt) return '';
    return txt
      .replace(/<!\[CDATA\[([\s\S]*?)\]\]>/gi, '$1')
      .replace(/<[^>]*>/g, ' ')
      .replace(/&nbsp;/gi, ' ')
      .replace(/&amp;/gi, '&')
      .replace(/&quot;/gi, '"')
      .replace(/&#39;/gi, "'")
      .replace(/https?:\/\/\S+/gi, '')
      .replace(/\[\+\d+\s+chars\]/gi, '')
      .replace(/\s+/g, ' ')
      .trim();
  }

  function formatRelativeTime(dateString) {
    if (!dateString) return 'LIVE';
    const date = new Date(dateString);
    if (isNaN(date.getTime())) return 'LIVE';
    const diffMins = Math.floor((Date.now() - date.getTime()) / 60000);
    if (diffMins < 60) return `${Math.max(1, diffMins)}M AGO`;
    const diffHours = Math.floor(diffMins / 60);
    if (diffHours < 24) return `${diffHours}H AGO`;
    return date.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }).toUpperCase();
  }

  // AI Summarizer Engine
  function buildLocalArticleAISummary(art) {
    const title = cleanText(art.title).replace(/\s+-\s+[^-]+$/, '');
    const desc = cleanText(art.description || '');
    const source = art.source?.name || activeChannelObj.name;

    const sentences = desc.split(/(?<=[.!?])\s+/).filter(s => s.length > 20);
    const point1 = sentences[0] || `Coverage from ${source} examining ${title.toLowerCase()}.`;
    const point2 = sentences[1] || `Developing implications across ${activeCountryObj.name}'s ${activeCategory} landscape.`;

    return {
      tldr: title,
      bullets: [
        point1,
        point2,
        `Source: ${source} (${activeCountryObj.name} Desk)`
      ],
      speech: `Summary for ${title}. ${point1} ${point2}`
    };
  }

  async function toggleArticleAISummary(idx) {
    const accordion = document.getElementById(`ai-acc-${idx}`);
    const contentEl = document.getElementById(`ai-content-${idx}`);
    const art = fetchedArticles[idx];
    if (!accordion || !art) return;

    if (accordion.classList.contains('open') && art._aiReady) {
      accordion.classList.remove('open');
      return;
    }

    accordion.classList.add('open');
    if (art._aiReady) return;

    contentEl.innerHTML = `<span style="color:var(--text-tertiary);">Synthesizing key takeaways...</span>`;

    const title = cleanText(art.title);
    const desc = cleanText(art.description || '');
    const fallback = buildLocalArticleAISummary(art);

    try {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 4500);

      const prompt = `Summarize this news article in 2 concise bullet points (under 40 words total). Plain text only, no markdown:\nTitle: ${title}\nDetails: ${desc}`;
      const res = await fetch(`https://text.pollinations.ai/${encodeURIComponent(prompt)}`, {
        signal: controller.signal
      });
      clearTimeout(timer);

      if (res.ok) {
        const aiText = cleanText(await res.text());
        if (aiText && aiText.length > 25) {
          const lines = aiText.split(/(?:\r?\n|•|- )+/).map(s => s.trim()).filter(s => s.length > 12).slice(0, 3);
          const bulletsHTML = (lines.length ? lines : [aiText]).map(l => `<li>${escapeHTML(l)}</li>`).join('');
          contentEl.innerHTML = `
            <div style="color:var(--text-primary);font-weight:500;">${escapeHTML(fallback.tldr)}</div>
            <ul>${bulletsHTML}</ul>
          `;
          art._aiSpeech = `AI Summary: ${aiText}`;
          art._aiReady = true;
          return;
        }
      }
    } catch (e) {}

    contentEl.innerHTML = `
      <div style="color:var(--text-primary);font-weight:500;">${escapeHTML(fallback.tldr)}</div>
      <ul>${fallback.bullets.map(b => `<li>${escapeHTML(b)}</li>`).join('')}</ul>
    `;
    art._aiSpeech = fallback.speech;
    art._aiReady = true;
  }

  function speakArticleAISummary(idx) {
    const art = fetchedArticles[idx];
    if (!art) return;
    const speechText = art._aiSpeech || buildLocalArticleAISummary(art).speech;
    playQueue([{
      text: speechText,
      status: `AI Summary • Story #${idx + 1}`,
      articleIndex: idx
    }]);
  }

  async function generateChannelAISummary() {
    if (!fetchedArticles.length) return;
    const drawer = document.getElementById('aiBriefingDrawer');
    const titleEl = document.getElementById('aiBriefingTitle');
    const contentEl = document.getElementById('aiBriefingContent');

    drawer.classList.add('open');
    titleEl.innerText = `AI Executive Brief — ${activeChannelObj.name}`;
    contentEl.innerHTML = `<span style="color:var(--text-tertiary);">Synthesizing top 5 stories from ${escapeHTML(activeChannelObj.name)}...</span>`;

    const top5 = fetchedArticles.slice(0, 5);
    const headlinesList = top5.map((a, i) => `${i + 1}. ${cleanText(a.title)}: ${cleanText(a.description)}`).join('\n');

    const fallbackOverview = `Current coverage on ${activeChannelObj.name} (${activeCountryObj.name}) centers on key developments across ${activeCategory === 'general' ? 'policy, markets, and national affairs' : activeCategory}:`;
    const fallbackBullets = top5.map(a => {
      const t = cleanText(a.title).replace(/\s+-\s+[^-]+$/, '');
      const d = cleanText(a.description || '').split(/(?<=[.!?])\s+/)[0] || '';
      return `<strong style="color:var(--text-primary);">${escapeHTML(t)}:</strong> ${escapeHTML(d)}`;
    });

    lastChannelAISummarySpeech = `Executive Briefing for ${activeChannelObj.name}. ` +
      top5.map((a, i) => `Story ${i + 1}: ${cleanText(a.title)}.`).join(' ');

    try {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 5000);
      const prompt = `Write a 2-sentence executive news briefing summarizing these 5 headlines from ${activeChannelObj.name}. Plain text only:\n${headlinesList}`;
      const res = await fetch(`https://text.pollinations.ai/${encodeURIComponent(prompt)}`, {
        signal: controller.signal
      });
      clearTimeout(timer);

      if (res.ok) {
        const aiIntro = cleanText(await res.text());
        if (aiIntro && aiIntro.length > 30) {
          contentEl.innerHTML = `
            <p>${escapeHTML(aiIntro)}</p>
            <ul>${fallbackBullets.map(b => `<li>${b}</li>`).join('')}</ul>
          `;
          lastChannelAISummarySpeech = `Executive Briefing for ${activeChannelObj.name}. ${aiIntro} ` +
            top5.map((a, i) => `Highlight ${i + 1}: ${cleanText(a.title)}.`).join(' ');
          return;
        }
      }
    } catch (e) {}

    contentEl.innerHTML = `
      <p>${escapeHTML(fallbackOverview)}</p>
      <ul>${fallbackBullets.map(b => `<li>${b}</li>`).join('')}</ul>
    `;
  }

  function speakChannelAISummary() {
    if (!lastChannelAISummarySpeech) return;
    playQueue([{
      text: lastChannelAISummarySpeech,
      status: `AI Brief • ${activeChannelObj.name}`,
      articleIndex: null
    }]);
  }

  // Audio Studio Controls
  const PLAY_ICON = `<svg class="icon" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>`;
  const PAUSE_ICON = `<svg class="icon" viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>`;
  const STOP_SM_ICON = `<svg class="icon" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>`;
  const LISTEN_SM_ICON = `<svg class="icon" viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>`;

  function updateCardHighlight(articleIdx) {
    activeArticleIndex = articleIdx;
    document.querySelectorAll('.card').forEach((card, idx) => {
      const btn = card.querySelector('.btn-listen-card');
      if (idx === articleIdx) {
        card.classList.add('speaking');
        if (btn) btn.innerHTML = `${STOP_SM_ICON}<span>Stop</span>`;
        card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      } else {
        card.classList.remove('speaking');
        if (btn) btn.innerHTML = `${LISTEN_SM_ICON}<span>Listen</span>`;
      }
    });
  }

  function setControlsState(isPlaying, hasNext = false) {
    const pauseBtn = document.getElementById('pauseBtn');
    const nextBtn = document.getElementById('nextBtn');
    const wf = document.getElementById('waveform');
    pauseBtn.disabled = !isPlaying;
    nextBtn.disabled = !hasNext;
    if (isPlaying) {
      wf.classList.add('playing');
      pauseBtn.innerHTML = PAUSE_ICON;
    } else {
      wf.classList.remove('playing');
      pauseBtn.innerHTML = PAUSE_ICON;
    }
  }

  function playQueue(items) {
    if (!('speechSynthesis' in window)) {
      alert("Speech synthesis is not supported on this browser.");
      return;
    }
    stopAudio(false);
    isCancelled = false;
    audioQueue = items;
    currentQueuePos = 0;
    playCurrentQueueItem();
  }

  function playCurrentQueueItem() {
    if (isCancelled || currentQueuePos < 0 || currentQueuePos >= audioQueue.length) {
      stopAudio(true);
      return;
    }

    const item = audioQueue[currentQueuePos];
    const utterance = new SpeechSynthesisUtterance(item.text);

    if (selectedVoice) {
      utterance.voice = selectedVoice;
      utterance.lang = selectedVoice.lang;
    } else {
      utterance.lang = activeCountryObj.code === 'in' ? 'en-IN' : 'en-US';
    }

    utterance.rate = parseFloat(speedSelect.value) || 1.0;
    utterance.pitch = 1.0;

    utterance.onstart = () => {
      document.getElementById('audioStatus').innerText = item.status || "Broadcasting...";
      updateCardHighlight(item.articleIndex);
      setControlsState(true, currentQueuePos < audioQueue.length - 1);
    };

    utterance.onend = () => {
      if (isCancelled) return;
      currentQueuePos++;
      if (currentQueuePos < audioQueue.length) {
        playCurrentQueueItem();
      } else {
        stopAudio(true);
      }
    };

    utterance.onerror = () => {
      if (!isCancelled) stopAudio(true);
    };

    synth.speak(utterance);
  }

  function stopAudio(resetStatus = true) {
    isCancelled = true;
    audioQueue = [];
    currentQueuePos = -1;
    if (synth) synth.cancel();
    updateCardHighlight(null);
    setControlsState(false, false);
    if (resetStatus) {
      document.getElementById('audioStatus').innerText = "Audio Studio Ready";
    }
  }

  function togglePause() {
    if (!synth) return;
    const pauseBtn = document.getElementById('pauseBtn');
    const wf = document.getElementById('waveform');
    if (synth.paused) {
      synth.resume();
      pauseBtn.innerHTML = PAUSE_ICON;
      wf.classList.add('playing');
      document.getElementById('audioStatus').innerText = "Playback Resumed";
    } else if (synth.speaking) {
      synth.pause();
      pauseBtn.innerHTML = PLAY_ICON;
      wf.classList.remove('playing');
      document.getElementById('audioStatus').innerText = "Playback Paused";
    }
  }

  function skipNext() {
    if (currentQueuePos < audioQueue.length - 1) {
      isCancelled = true;
      synth.cancel();
      isCancelled = false;
      currentQueuePos++;
      playCurrentQueueItem();
    }
  }

  function readAllTopNews() {
    if (!fetchedArticles.length) return;

    const queue = [{
      text: `Top 5 intelligence briefing from ${activeChannelObj.name}.`,
      status: `Starting ${activeChannelObj.name} Brief`,
      articleIndex: null
    }];

    fetchedArticles.slice(0, 5).forEach((art, idx) => {
      const summary = buildLocalArticleAISummary(art);
      queue.push({
        text: `Story ${idx + 1}: ${summary.speech}`,
        status: `(${idx + 1}/5) ${summary.tldr}`,
        articleIndex: idx
      });
    });

    queue.push({
      text: "End of briefing.",
      status: "Briefing Complete",
      articleIndex: null
    });

    playQueue(queue);
  }

  function readSingleArticle(index) {
    if (activeArticleIndex === index) {
      stopAudio();
      return;
    }
    const art = fetchedArticles[index];
    if (!art) return;
    const title = cleanText(art.title);
    const desc = cleanText(art.description);
    playQueue([{
      text: `${title}. ${desc}`,
      status: title,
      articleIndex: index
    }]);
  }

  function toggleQueueArticle(index) {
    const pos = savedQueueIndices.indexOf(index);
    if (pos === -1) savedQueueIndices.push(index);
    else savedQueueIndices.splice(pos, 1);

    const btn = document.getElementById('queuePlayBtn');
    document.getElementById('queueCountText').innerText = savedQueueIndices.length;
    btn.disabled = savedQueueIndices.length === 0;
    renderArticles();
  }

  function playSavedQueue() {
    if (!savedQueueIndices.length) return;
    const queue = [{
      text: `Playing ${savedQueueIndices.length} queued articles.`,
      status: "Playing Saved Queue",
      articleIndex: null
    }];

    savedQueueIndices.forEach((artIdx, i) => {
      const art = fetchedArticles[artIdx];
      if (!art) return;
      queue.push({
        text: `${cleanText(art.title)}. ${cleanText(art.description)}`,
        status: `Queue (${i + 1}/${savedQueueIndices.length}) • ${cleanText(art.title)}`,
        articleIndex: artIdx
      });
    });

    playQueue(queue);
  }

  function showSkeletons() {
    const grid = document.getElementById('newsGrid');
    grid.innerHTML = Array.from({ length: 6 }).map(() => `
      <div class="card">
        <div class="card-media skeleton"></div>
        <div class="card-body">
          <div class="skeleton" style="height: 12px; width: 35%; border-radius: 4px; margin-bottom: 12px;"></div>
          <div class="skeleton" style="height: 18px; width: 92%; border-radius: 4px; margin-bottom: 8px;"></div>
          <div class="skeleton" style="height: 18px; width: 70%; border-radius: 4px; margin-bottom: 16px;"></div>
          <div class="skeleton" style="height: 44px; width: 100%; border-radius: 4px;"></div>
        </div>
      </div>
    `).join('');
  }

  function renderArticles() {
    const grid = document.getElementById('newsGrid');
    grid.innerHTML = '';

    fetchedArticles.forEach((article, idx) => {
      const displayChannel = activeChannelObj.id !== 'all'

      const dateStr = formatRelativeTime(article.publishedAt);
      const title = escapeHTML(cleanText(article.title));
      const rawDesc = cleanText(article.description);
      const desc = escapeHTML(rawDesc && rawDesc !== cleanText(article.title) ? rawDesc : `Full dispatch and live updates available via ${displayChannel}.`);
      const isQueued = savedQueueIndices.includes(idx);

      const card = document.createElement('article');
      card.className = `card ${activeArticleIndex === idx ? 'speaking' : ''}`;
      card.style.setProperty('--i', idx);
      card.innerHTML = `
        <div class="card-media">
          <span class="card-badge">${activeCountryObj.iso} • ${sourceName}</span>
          ${article.urlToImage
            ? `<img src="${escapeHTML(article.urlToImage)}" alt="" loading="lazy" onerror="this.outerHTML='<span class=\\'media-fallback\\'>${sourceName}</span>'">`
            : `<span class="media-fallback">${sourceName}</span>`
          }
        </div>
        <div class="card-body">
          <div class="card-meta">
            <span class="source-name">${sourceName}</span>
            <span>${dateStr}</span>
          </div>
          <h2 class="card-title">${title}</h2>
          <p class="card-desc">${desc}</p>

          <!-- Smooth CSS Grid Accordion for AI Summary -->
          <div class="card-ai-accordion" id="ai-acc-${idx}">
            <div class="card-ai-inner">
              <div class="card-ai-box">
                <div class="card-ai-top">
                  <span>AI Synthesis</span>
                  <button class="btn btn-sm" style="padding:2px 7px;font-size:0.65rem;" onclick="speakArticleAISummary(${idx})">Speak</button>
                </div>
                <div id="ai-content-${idx}"></div>
              </div>
            </div>
          </div>

          <div class="card-footer">
            <div class="card-actions">
              <button class="btn btn-sm btn-brand" onclick="toggleArticleAISummary(${idx})">
                <svg class="icon" viewBox="0 0 24 24"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>
                <span>Summarize</span>
              </button>
              <button class="btn btn-sm btn-listen-card" onclick="readSingleArticle(${idx})">
                ${activeArticleIndex === idx ? `${STOP_SM_ICON}<span>Stop</span>` : `${LISTEN_SM_ICON}<span>Listen</span>`}
              </button>
              <button class="btn btn-sm btn-icon-only btn-queue-card ${isQueued ? 'queued' : ''}" onclick="toggleQueueArticle(${idx})" title="Add to Queue">
                ${isQueued
                  ? `<svg class="icon" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>`
                  : `<svg class="icon" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>`
                }
              </button>
            </div>
            <a href="${escapeHTML(article.url || '#')}" class="external-link" target="_blank" rel="noopener noreferrer">
              <span>Read</span>
              <svg class="icon" viewBox="0 0 24 24"><line x1="7" y1="17" x2="17" y2="7"/><polyline points="7 7 17 7 17 17"/></svg>
            </a>
          </div>
        </div>
      `;
      grid.appendChild(card);
    });
  }

  // Layer 2: XML RSS Parser Backup
  async function fetchViaXmlProxy(rssUrl) {
    const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(rssUrl)}`;
    const res = await fetch(proxyUrl);
    const data = await res.json();
    if (!data.contents) throw new Error('Empty proxy response');

    const parser = new DOMParser();
    const xml = parser.parseFromString(data.contents, "text/xml");
    const items = Array.from(xml.querySelectorAll("item")).slice(0, 18);
    if (!items.length) throw new Error('No XML items');

    return items.map(item => {
      const title = item.querySelector("title")?.textContent || '';
      const desc = item.querySelector("description")?.textContent || '';
      const link = item.querySelector("link")?.textContent || '#';
      const pubDate = item.querySelector("pubDate")?.textContent || new Date().toISOString();

      let img = '';
      const mediaContent = item.getElementsByTagNameNS('*', 'content')[0] || item.getElementsByTagNameNS('*', 'thumbnail')[0];
      if (mediaContent && mediaContent.getAttribute('url')) {
        img = mediaContent.getAttribute('url');
      } else {
        const match = desc.match(/<img[^>]+src=["']([^"'>]+)["']/i);
        if (match) img = match[1];
      }

      return {
        source: { name: activeChannelObj.name },
        title: cleanText(title),
        description: cleanText(desc),
        url: link,
        urlToImage: img,
        publishedAt: pubDate
      };
    });
  }

  async function fetchNews(userQuery = '') {
    stopAudio();
    showSkeletons();
    savedQueueIndices = [];
    document.getElementById('queueCountText').innerText = '0';
    document.getElementById('queuePlayBtn').disabled = true;

    const topicPart = activeCategory !== 'general' ? activeCategory : '';
    const combinedQuery = [userQuery, activeChannelObj.query, topicPart].filter(Boolean).join(' ').trim();

    // Layer 1: Vercel /api/news backend
    try {
      const apiUrl = `/api/news?category=${encodeURIComponent(activeCategory)}&q=${encodeURIComponent(combinedQuery)}`;
      const response = await fetch(apiUrl);
      const data = await response.json();

      if (data.status === 'ok' && Array.isArray(data.articles) && data.articles.length > 0) {
        const valid = data.articles.filter(a => a.title && !a.title.includes('[Removed]'));
        if (valid.length > 0) {
          fetchedArticles = valid;
          renderArticles();
          return;
        }
      }
    } catch (e) {}

    // Layer 2: XML RSS Proxy
    if (activeChannelObj.rss && !userQuery) {
      try {
        const xmlArticles = await fetchViaXmlProxy(activeChannelObj.rss);
        if (xmlArticles && xmlArticles.length > 0) {
          fetchedArticles = xmlArticles;
          renderArticles();
          return;
        }
      } catch (e) {}
    }

    // Layer 3: Curated Fallback
    fetchedArticles = getChannelFallbackArticles(userQuery);
    renderArticles();
  }

  document.getElementById('categoryGroup').addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (btn) {
      document.querySelectorAll('#categoryGroup button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeCategory = btn.dataset.cat;
      document.getElementById('searchInput').value = '';
      document.getElementById('aiBriefingDrawer').classList.remove('open');
      fetchNews();
    }
  });

  function triggerSearch() {
    const query = document.getElementById('searchInput').value.trim();
    if (query) fetchNews(query);
  }

  document.getElementById('searchInput').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') triggerSearch();
  });

  // Initialize
  renderCountryStrip();
  renderChannelStrip();
  updateSelectionLabel();
  fetchNews();
</script>
