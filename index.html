<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>World Live News & Audio Anchor</title>
  <style>
    :root {
      --bg: #f1f5f9;
      --surface: #ffffff;
      --surface-subtle: #f8fafc;
      --text-main: #0f172a;
      --text-body: #334155;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --audio-bg: rgba(239, 246, 255, 0.92);
      --audio-border: #bfdbfe;
      --audio-text: #1e40af;
      --danger: #ef4444;
      --card-shadow: 0 2px 8px rgba(15, 23, 42, 0.05);
    }

    body.dark {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-subtle: #334155;
      --text-main: #f8fafc;
      --text-body: #cbd5e1;
      --text-muted: #94a3b8;
      --border: #334155;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --audio-bg: rgba(30, 41, 59, 0.92);
      --audio-border: #3b82f6;
      --audio-text: #93c5fd;
      --card-shadow: 0 4px 12px rgba(0, 0, 0, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text-body);
      padding: 18px 12px 60px 12px;
      transition: background-color 0.2s, color 0.2s;
    }

    .container {
      max-width: 1040px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .header-titles h1 {
      font-size: 1.75rem;
      color: var(--text-main);
      letter-spacing: -0.02em;
    }

    .header-titles p {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-top: 4px;
    }

    .theme-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: var(--card-shadow);
    }

    /* Sticky Audio Player */
    .audio-bar {
      position: sticky;
      top: 12px;
      z-index: 100;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--audio-bg);
      border: 1px solid var(--audio-border);
      padding: 12px 16px;
      border-radius: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
    }

    .audio-status-wrap {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
      min-width: 240px;
    }

    .audio-status {
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--audio-text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .voice-picker-wrap {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    .voice-select, .speed-select {
      padding: 5px 8px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--surface);
      font-size: 0.8rem;
      outline: none;
      color: var(--text-main);
    }

    .voice-select {
      max-width: 200px;
    }

    .audio-btns {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .btn-audio, .btn-control, .btn-stop {
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.2s;
    }

    .btn-audio {
      background: var(--primary);
      color: #fff;
    }

    .btn-control {
      background: var(--surface);
      color: var(--text-main);
      border: 1px solid var(--border);
    }

    .btn-stop {
      background: var(--danger);
      color: #fff;
    }

    .btn-control:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    /* Controls Panel */
    .controls-panel {
      background: var(--surface);
      padding: 16px;
      border-radius: 12px;
      box-shadow: var(--card-shadow);
      border: 1px solid var(--border);
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .control-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .control-label {
      font-weight: 600;
      font-size: 0.88rem;
      min-width: 75px;
      color: var(--text-main);
    }

    .btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .btn-chip {
      padding: 7px 14px;
      border: 1px solid var(--border);
      background: var(--surface-subtle);
      border-radius: 20px;
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--text-body);
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-chip:hover {
      border-color: var(--primary);
    }

    .btn-chip.active {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }

    .search-box {
      display: flex;
      width: 100%;
      gap: 8px;
    }

    .search-box input {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid var(--border);
      background: var(--surface-subtle);
      color: var(--text-main);
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
    }

    .search-box input:focus {
      border-color: var(--primary);
    }

    .search-box button {
      padding: 10px 18px;
      background: var(--text-main);
      color: var(--surface);
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }

    /* News Grid & Cards */
    .news-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 18px;
    }

    .card {
      background: var(--surface);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: var(--card-shadow);
      display: flex;
      flex-direction: column;
      border: 2px solid transparent;
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
    }

    .card:hover {
      transform: translateY(-2px);
    }

    .card.speaking {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.15);
    }

    .card-img-wrap {
      width: 100%;
      height: 165px;
      background: linear-gradient(135deg, #1e293b, #334155);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #94a3b8;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .card-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .card-body {
      padding: 15px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .card-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .source-tag {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .card-date {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .card-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.38;
      margin-bottom: 8px;
    }

    .card-desc {
      font-size: 0.86rem;
      color: var(--text-body);
      line-height: 1.5;
      margin-bottom: 14px;
      flex: 1;
    }

    .card-footer {
      border-top: 1px solid var(--border);
      padding-top: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .read-more {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.85rem;
    }

    .btn-card-listen {
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 0.8rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-weight: 600;
      color: var(--text-main);
    }

    .card.speaking .btn-card-listen {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }

    /* Skeleton Loader */
    .skeleton {
      animation: pulse 1.5s infinite ease-in-out;
      background: var(--surface-subtle);
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.55; }
      50% { opacity: 1; }
    }

    .status-msg {
      text-align: center;
      padding: 40px 10px;
      color: var(--text-muted);
      font-size: 0.95rem;
      grid-column: 1 / -1;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div class="header-titles">
      <h1>World Live News & Audio Anchor</h1>
      <p>Real-time world news with studio-quality English voice summaries</p>
    </div>
    <button class="theme-btn" id="themeToggle" onclick="toggleTheme()">🌙 Dark Mode</button>
  </header>

  <div class="audio-bar">
    <div class="audio-status-wrap">
      <span class="audio-status" id="audioStatus">🎙 Audio Reader: Ready</span>
      <div class="voice-picker-wrap">
        <label for="voiceSelect">Voice:</label>
        <select id="voiceSelect" class="voice-select"></select>
        <label for="speedSelect">Speed:</label>
        <select id="speedSelect" class="speed-select">
          <option value="0.9">0.9x</option>
          <option value="1" selected>1.0x</option>
          <option value="1.15">1.15x</option>
          <option value="1.3">1.3x</option>
          <option value="1.5">1.5x</option>
        </select>
      </div>
    </div>
    <div class="audio-btns">
      <button class="btn-audio" onclick="readAllTopNews()">🔊 Top 5 Brief</button>
      <button class="btn-control" id="pauseBtn" onclick="togglePause()" disabled>⏸ Pause</button>
      <button class="btn-control" id="nextBtn" onclick="skipNext()" disabled>⏭ Next</button>
      <button class="btn-stop" onclick="stopAudio()">⏹ Stop</button>
    </div>
  </div>

  <div class="controls-panel">
    <div class="control-row">
      <span class="control-label">Category:</span>
      <div class="btn-group" id="categoryGroup">
        <button class="btn-chip active" data-cat="all">All World News</button>
        <button class="btn-chip" data-cat="general">General</button>
        <button class="btn-chip" data-cat="technology">Technology</button>
        <button class="btn-chip" data-cat="business">Business</button>
        <button class="btn-chip" data-cat="sports">Sports</button>
        <button class="btn-chip" data-cat="entertainment">Entertainment</button>
        <button class="btn-chip" data-cat="science">Science</button>
        <button class="btn-chip" data-cat="health">Health</button>
      </div>
    </div>

    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search world topics (e.g. AI, Space, Economy)...">
      <button onclick="triggerSearch()">Search</button>
    </div>
  </div>

  <div class="news-grid" id="newsGrid"></div>
</div>

<script>
  let activeCategory = 'all';
  let fetchedArticles = [];

  // Audio Queue State
  const synth = window.speechSynthesis;
  let englishVoices = [];
  let selectedVoice = null;
  let audioQueue = [];
  let currentQueuePos = -1;
  let activeArticleIndex = null;
  let isCancelled = false;

  // Theme Init
  if (localStorage.getItem('newsTheme') === 'dark') {
    document.body.classList.add('dark');
    document.getElementById('themeToggle').innerText = '☀️ Light Mode';
  }

  function toggleTheme() {
    document.body.classList.toggle('dark');
    const isDark = document.body.classList.contains('dark');
    localStorage.setItem('newsTheme', isDark ? 'dark' : 'light');
    document.getElementById('themeToggle').innerText = isDark ? '☀️ Light Mode' : '🌙 Dark Mode';
  }

  // Speed Init
  const speedSelect = document.getElementById('speedSelect');
  const savedSpeed = localStorage.getItem('newsVoiceSpeed');
  if (savedSpeed) speedSelect.value = savedSpeed;
  speedSelect.onchange = () => localStorage.setItem('newsVoiceSpeed', speedSelect.value);

  // Voice Loader with LocalStorage Memory
  function loadVoices() {
    if (!synth) return;
    const allVoices = synth.getVoices();
    englishVoices = allVoices.filter(v => v.lang.startsWith('en'));
    if (englishVoices.length === 0) return;

    const selectEl = document.getElementById('voiceSelect');
    selectEl.innerHTML = '';

    const qualityKeywords = ['Google', 'Natural', 'Online', 'Siri', 'Samantha', 'Premium'];
    englishVoices.sort((a, b) => {
      const aScore = qualityKeywords.some(k => a.name.includes(k)) ? 1 : 0;
      const bScore = qualityKeywords.some(k => b.name.includes(k)) ? 1 : 0;
      return bScore - aScore;
    });

    const savedVoiceName = localStorage.getItem('newsVoiceName');
    let defaultIndex = 0;

    englishVoices.forEach((voice, index) => {
      const option = document.createElement('option');
      option.value = index;
      option.textContent = `${voice.name} (${voice.lang})`;
      selectEl.appendChild(option);
      if (savedVoiceName && voice.name === savedVoiceName) {
        defaultIndex = index;
      }
    });

    selectedVoice = englishVoices[defaultIndex];
    selectEl.value = defaultIndex;

    selectEl.onchange = (e) => {
      selectedVoice = englishVoices[e.target.value];
      localStorage.setItem('newsVoiceName', selectedVoice.name);
    };
  }

  loadVoices();
  if (speechSynthesis.onvoiceschanged !== undefined) {
    speechSynthesis.onvoiceschanged = loadVoices;
  }

  // Helpers
  function escapeHTML(str) {
    if (!str) return '';
    return str.replace(/[&<>"']/g, m => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[m]));
  }

  function cleanTextForSpeech(txt) {
    if (!txt) return '';
    return txt
      .replace(/https?:\/\/\S+/gi, '')
      .replace(/<[^>]*>/g, '')
      .replace(/\[\+\d+\s+chars\]/g, '')
      .replace(/\s+-\s+[^-]+$/, '') // Strip trailing "- Source Name"
      .trim();
  }

  function formatRelativeTime(dateString) {
    if (!dateString) return '';
    const date = new Date(dateString);
    const diffMs = Date.now() - date.getTime();
    const diffMins = Math.floor(diffMs / 60000);
    if (diffMins < 60) return `${Math.max(1, diffMins)}m ago`;
    const diffHours = Math.floor(diffMins / 60);
    if (diffHours < 24) return `${diffHours}h ago`;
    return date.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  }

  // Highlight Active Card
  function updateCardHighlight(articleIdx) {
    activeArticleIndex = articleIdx;
    document.querySelectorAll('.card').forEach((card, idx) => {
      const btn = card.querySelector('.btn-card-listen');
      if (idx === articleIdx) {
        card.classList.add('speaking');
        if (btn) btn.innerHTML = '⏹ Stop';
        card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      } else {
        card.classList.remove('speaking');
        if (btn) btn.innerHTML = '🔊 Listen';
      }
    });
  }

  function setControlsState(isPlaying, hasNext = false) {
    const pauseBtn = document.getElementById('pauseBtn');
    const nextBtn = document.getElementById('nextBtn');
    pauseBtn.disabled = !isPlaying;
    nextBtn.disabled = !hasNext;
    if (!isPlaying) pauseBtn.innerText = '⏸ Pause';
  }

  // Audio Queue Player
  function playQueue(items) {
    if (!('speechSynthesis' in window)) {
      alert("Voice playback is not supported on this browser.");
      return;
    }
    stopAudio(false);
    isCancelled = false;
    audioQueue = items;
    currentQueuePos = 0;
    playCurrentQueueItem();
  }

  function playCurrentQueueItem() {
    if (isCancelled || currentQueuePos < 0 || currentQueuePos >= audioQueue.length) {
      stopAudio(true);
      return;
    }

    const item = audioQueue[currentQueuePos];
    const utterance = new SpeechSynthesisUtterance(item.text);

    if (selectedVoice) {
      utterance.voice = selectedVoice;
      utterance.lang = selectedVoice.lang;
    } else {
      utterance.lang = 'en-US';
    }

    utterance.rate = parseFloat(speedSelect.value) || 1.0;
    utterance.pitch = 1.0;

    utterance.onstart = () => {
      document.getElementById('audioStatus').innerText = item.status || "🔊 Playing summary...";
      updateCardHighlight(item.articleIndex);
      setControlsState(true, currentQueuePos < audioQueue.length - 1);
    };

    utterance.onend = () => {
      if (isCancelled) return;
      currentQueuePos++;
      if (currentQueuePos < audioQueue.length) {
        playCurrentQueueItem();
      } else {
        stopAudio(true);
      }
    };

    utterance.onerror = () => {
      if (!isCancelled) stopAudio(true);
    };

    synth.speak(utterance);
  }

  function stopAudio(resetStatus = true) {
    isCancelled = true;
    audioQueue = [];
    currentQueuePos = -1;
    if (synth) synth.cancel();
    updateCardHighlight(null);
    setControlsState(false, false);
    if (resetStatus) {
      document.getElementById('audioStatus').innerText = "🎙 Audio Reader: Ready";
    }
  }

  function togglePause() {
    if (!synth) return;
    const pauseBtn = document.getElementById('pauseBtn');
    if (synth.paused) {
      synth.resume();
      pauseBtn.innerText = '⏸ Pause';
      document.getElementById('audioStatus').innerText = "🔊 Resumed playback...";
    } else if (synth.speaking) {
      synth.pause();
      pauseBtn.innerText = '▶ Resume';
      document.getElementById('audioStatus').innerText = "⏸ Audio Paused";
    }
  }

  function skipNext() {
    if (currentQueuePos < audioQueue.length - 1) {
      isCancelled = true;
      synth.cancel();
      isCancelled = false;
      currentQueuePos++;
      playCurrentQueueItem();
    }
  }

  function readAllTopNews() {
    if (!fetchedArticles.length) {
      alert("No news available to read.");
      return;
    }
    const queue = [
      { text: "Here is your top 5 world news briefing.", status: "🎙 Starting News Brief...", articleIndex: null }
    ];

    fetchedArticles.slice(0, 5).forEach((art, idx) => {
      const cleanTitle = cleanTextForSpeech(art.title);
      const cleanDesc = cleanTextForSpeech(art.description);
      queue.push({
        text: `Headline ${idx + 1}: ${cleanTitle}. ${cleanDesc}`,
        status: `🔊 Brief (${idx + 1}/5): ${cleanTitle}`,
        articleIndex: idx
      });
    });

    queue.push({
      text: "That concludes your world news briefing.",
      status: "🎙 Wrapping up brief...",
      articleIndex: null
    });

    playQueue(queue);
  }

  function readSingleArticle(index) {
    if (activeArticleIndex === index) {
      stopAudio();
      return;
    }
    const art = fetchedArticles[index];
    if (!art) return;
    const cleanTitle = cleanTextForSpeech(art.title);
    const cleanDesc = cleanTextForSpeech(art.description);
    playQueue([{
      text: `${cleanTitle}. ${cleanDesc}`,
      status: `🔊 Reading: ${cleanTitle}`,
      articleIndex: index
    }]);
  }

  function showSkeletons() {
    const grid = document.getElementById('newsGrid');
    grid.innerHTML = Array.from({ length: 6 }).map(() => `
      <div class="card">
        <div class="card-img-wrap skeleton"></div>
        <div class="card-body">
          <div class="skeleton" style="height: 14px; width: 40%; border-radius: 4px; margin-bottom: 12px;"></div>
          <div class="skeleton" style="height: 20px; width: 95%; border-radius: 4px; margin-bottom: 8px;"></div>
          <div class="skeleton" style="height: 20px; width: 75%; border-radius: 4px; margin-bottom: 16px;"></div>
          <div class="skeleton" style="height: 50px; width: 100%; border-radius: 4px;"></div>
        </div>
      </div>
    `).join('');
  }

  async function fetchNews(query = '') {
    stopAudio();
    showSkeletons();
    const grid = document.getElementById('newsGrid');

    let url = `/api/news?category=${activeCategory}`;
    if (query) {
      url += `&q=${encodeURIComponent(query)}`;
    }

    try {
      const response = await fetch(url);
      const data = await response.json();

      if (data.status !== "ok" || !data.articles || data.articles.length === 0) {
        grid.innerHTML = `<div class="status-msg">${escapeHTML(data.message) || 'No articles found for this selection.'}</div>`;
        fetchedArticles = [];
        return;
      }

      fetchedArticles = data.articles.filter(a => a.title && !a.title.includes('[Removed]'));

      grid.innerHTML = '';
      fetchedArticles.forEach((article, idx) => {
        const sourceName = escapeHTML(article.source?.name || 'World News');
        const dateStr = formatRelativeTime(article.publishedAt);
        const title = escapeHTML(article.title);
        const desc = escapeHTML(article.description || 'Click Read to view full coverage.');

        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="card-img-wrap">
            ${article.urlToImage 
              ? `<img src="${escapeHTML(article.urlToImage)}" alt="News thumbnail" loading="lazy" onerror="this.outerHTML='<span>🌐 ${sourceName}</span>'">` 
              : `<span>🌐 ${sourceName}</span>`
            }
          </div>
          <div class="card-body">
            <div class="card-meta">
              <span class="source-tag">${sourceName}</span>
              <span class="card-date">${dateStr}</span>
            </div>
            <h2 class="card-title">${title}</h2>
            <p class="card-desc">${desc}</p>
            <div class="card-footer">
              <button class="btn-card-listen" onclick="readSingleArticle(${idx})">🔊 Listen</button>
              <a href="${escapeHTML(article.url)}" class="read-more" target="_blank" rel="noopener noreferrer">Read &rarr;</a>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    } catch (err) {
      grid.innerHTML = '<div class="status-msg" style="color: #ef4444;">Unable to load news. Check your connection or API key.</div>';
    }
  }

  document.getElementById('categoryGroup').addEventListener('click', (e) => {
    if (e.target.tagName === 'BUTTON') {
      document.querySelectorAll('#categoryGroup button').forEach(b => b.classList.remove('active'));
      e.target.classList.add('active');
      activeCategory = e.target.dataset.cat;
      document.getElementById('searchInput').value = '';
      fetchNews();
    }
  });

  function triggerSearch() {
    const query = document.getElementById('searchInput').value.trim();
    if (query) fetchNews(query);
  }

  document.getElementById('searchInput').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') triggerSearch();
  });

  fetchNews();
</script>
</body>
</html>
