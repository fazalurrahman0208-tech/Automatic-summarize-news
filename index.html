<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PulseNews — Unified Text & Video News Aggregator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --surface-2: #f1f5f9;
      --surface-3: #e2e8f0;
      --text-main: #0f172a;
      --text-body: #334155;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-soft: rgba(37, 99, 235, 0.1);
      --video-accent: #dc2626;
      --video-soft: rgba(220, 38, 38, 0.1);
      --ai-accent: #7c3aed;
      --ai-soft: rgba(124, 58, 237, 0.08);
      --ai-border: rgba(124, 58, 237, 0.25);
      --save-accent: #d97706;
      --save-soft: rgba(217, 119, 6, 0.12);
      --danger: #ef4444;
      --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.05);
      --shadow-md: 0 8px 24px rgba(15, 23, 42, 0.07);
      --radius: 12px;
    }

    body.dark {
      --bg: #090d16;
      --surface: #111827;
      --surface-2: #1e293b;
      --surface-3: #334155;
      --text-main: #f8fafc;
      --text-body: #cbd5e1;
      --text-muted: #94a3b8;
      --border: #1f2937;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --primary-soft: rgba(59, 130, 246, 0.15);
      --video-accent: #ef4444;
      --video-soft: rgba(239, 68, 68, 0.18);
      --ai-accent: #a78bfa;
      --ai-soft: rgba(167, 139, 250, 0.12);
      --ai-border: rgba(167, 139, 250, 0.3);
      --save-accent: #fbbf24;
      --save-soft: rgba(251, 191, 36, 0.15);
      --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 10px 30px rgba(0, 0, 0, 0.45);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      color: var(--text-body);
      line-height: 1.5;
      padding-bottom: 70px;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .icon {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      flex-shrink: 0;
    }

    .icon-fill {
      fill: currentColor;
    }

    /* Top Navbar */
    .navbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
      padding: 12px 16px;
    }

    .nav-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }

    .brand-logo {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      background: var(--primary);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1rem;
    }

    .brand-text h1 {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      background: #10b981;
      border-radius: 50%;
      display: inline-block;
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2);
    }

    .brand-text p {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nav-tab {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 13px;
      border-radius: 9px;
      font-size: 0.82rem;
      font-weight: 600;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text-body);
      cursor: pointer;
      transition: all 0.18s ease;
    }

    .nav-tab:hover {
      border-color: var(--primary);
      color: var(--text-main);
    }

    .nav-tab.active {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }

    .badge-count {
      background: rgba(0, 0, 0, 0.15);
      color: inherit;
      font-size: 0.72rem;
      padding: 1px 6px;
      border-radius: 99px;
      font-weight: 700;
    }

    .nav-tab:not(.active) .badge-count {
      background: var(--surface-3);
      color: var(--text-main);
    }

    .btn-icon {
      padding: 8px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text-main);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.18s ease;
    }

    .btn-icon:hover {
      border-color: var(--primary);
    }

    /* Main Container */
    .container {
      max-width: 1200px;
      margin: 16px auto 0 auto;
      padding: 0 14px;
    }

    /* NEWS TYPE SWITCHER BAR (All News | Text News | Video News) */
    .news-type-section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 14px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      box-shadow: var(--shadow-sm);
    }

    .type-segment-group {
      display: inline-flex;
      background: var(--surface-2);
      padding: 4px;
      border-radius: 10px;
      border: 1px solid var(--border);
      gap: 4px;
    }

    .type-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 7px;
      font-size: 0.82rem;
      font-weight: 600;
      border: none;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.16s ease;
    }

    .type-chip:hover {
      color: var(--text-main);
    }

    .type-chip.active {
      background: var(--surface);
      color: var(--text-main);
      box-shadow: var(--shadow-sm);
    }

    .type-chip.active.video-active {
      color: var(--video-accent);
    }

    .feed-stats-pill {
      font-size: 0.78rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Audio & AI Bar */
    .audio-studio {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      margin-bottom: 16px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .studio-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .studio-status {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      min-width: 220px;
    }

    .eq-bars {
      display: inline-flex;
      align-items: flex-end;
      gap: 2px;
      height: 16px;
      padding: 0 2px;
    }

    .eq-bar {
      width: 3px;
      height: 4px;
      background: var(--primary);
      border-radius: 2px;
      transition: height 0.15s ease;
    }

    .eq-bars.playing .eq-bar:nth-child(1) { animation: eqAnim 0.6s infinite ease-in-out; }
    .eq-bars.playing .eq-bar:nth-child(2) { animation: eqAnim 0.6s infinite ease-in-out 0.15s; }
    .eq-bars.playing .eq-bar:nth-child(3) { animation: eqAnim 0.6s infinite ease-in-out 0.3s; }
    .eq-bars.playing .eq-bar:nth-child(4) { animation: eqAnim 0.6s infinite ease-in-out 0.1s; }

    @keyframes eqAnim {
      0%, 100% { height: 4px; }
      50% { height: 16px; }
    }

    .status-label {
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 420px;
    }

    .studio-buttons {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 13px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text-main);
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
    }

    .btn:hover:not(:disabled) {
      border-color: var(--primary);
    }

    .btn:active:not(:disabled) {
      transform: scale(0.97);
    }

    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--primary-hover);
    }

    .btn-ai {
      background: var(--ai-soft);
      color: var(--ai-accent);
      border-color: var(--ai-border);
    }

    .btn-ai:hover:not(:disabled) {
      background: var(--ai-accent);
      color: #ffffff;
    }

    .btn-danger {
      background: rgba(239, 68, 68, 0.12);
      color: var(--danger);
      border-color: rgba(239, 68, 68, 0.25);
    }

    .btn-danger:hover:not(:disabled) {
      background: var(--danger);
      color: #ffffff;
    }

    .studio-bottom {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      padding-top: 10px;
      border-top: 1px solid var(--border);
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .select-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .select-box {
      padding: 5px 8px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text-main);
      font-size: 0.78rem;
      outline: none;
      max-width: 210px;
    }

    /* Global AI Executive Briefing Box */
    .ai-brief-panel {
      display: none;
      background: var(--surface);
      border: 1px solid var(--ai-border);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: var(--shadow-md);
      animation: fadeSlide 0.25s ease;
    }

    .ai-brief-panel.open {
      display: block;
    }

    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .ai-brief-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      padding-bottom: 10px;
      margin-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .ai-brief-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--ai-accent);
    }

    .ai-brief-content {
      font-size: 0.85rem;
      color: var(--text-body);
      line-height: 1.6;
    }

    .ai-brief-content p {
      color: var(--text-main);
      font-weight: 500;
      margin-bottom: 10px;
    }

    .ai-brief-content ul {
      padding-left: 18px;
      display: grid;
      gap: 6px;
    }

    /* Filter & Channel Deck */
    .filter-deck {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      margin-bottom: 18px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .filter-deck.hidden {
      display: none;
    }

    .filter-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .row-label {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
      min-width: 68px;
      flex-shrink: 0;
    }

    .pill-strip {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
      padding: 2px 0;
      flex: 1;
    }

    .pill-strip::-webkit-scrollbar {
      display: none;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 99px;
      font-size: 0.78rem;
      font-weight: 600;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text-body);
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      transition: all 0.15s ease;
    }

    .pill:hover {
      border-color: var(--primary);
      color: var(--text-main);
    }

    .pill.active {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }

    .ch-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .search-row {
      display: flex;
      gap: 8px;
      padding-top: 4px;
    }

    .search-input-wrap {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-input-wrap .icon {
      position: absolute;
      left: 12px;
      color: var(--text-muted);
    }

    .search-input-wrap input {
      width: 100%;
      padding: 9px 12px 9px 36px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text-main);
      font-size: 0.85rem;
      outline: none;
    }

    .search-input-wrap input:focus {
      border-color: var(--primary);
      background: var(--surface);
    }

    /* Bookmarks Header Banner */
    .bookmarks-header {
      display: none;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 18px;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      box-shadow: var(--shadow-sm);
    }

    .bookmarks-header.open {
      display: flex;
    }

    .bm-title-wrap h2 {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .bm-title-wrap p {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .bm-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    /* News Grid & Cards */
    .news-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(315px, 1fr));
      gap: 18px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow-sm);
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
      position: relative;
    }

    .card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-md);
      border-color: var(--surface-3);
    }

    .card.speaking {
      border: 2px solid var(--primary);
      box-shadow: 0 0 0 4px var(--primary-soft);
    }

    /* Distinct Card Media Box */
    .card-img-box {
      width: 100%;
      height: 180px;
      background: var(--surface-2);
      position: relative;
      overflow: hidden;
      cursor: pointer;
    }

    .card-img-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.35s ease;
    }

    .card:hover .card-img-box img {
      transform: scale(1.03);
    }

    /* Media Overlay Labels */
    .media-type-badge {
      position: absolute;
      top: 10px;
      left: 10px;
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 6px;
      backdrop-filter: blur(8px);
      display: inline-flex;
      align-items: center;
      gap: 4px;
      z-index: 2;
    }

    .type-badge-text {
      background: rgba(15, 23, 42, 0.85);
      color: #f8fafc;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .type-badge-video {
      background: rgba(220, 38, 38, 0.92);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 2px 8px rgba(220, 38, 38, 0.4);
    }

    .duration-tag {
      position: absolute;
      bottom: 10px;
      right: 10px;
      background: rgba(15, 23, 42, 0.85);
      color: #ffffff;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: monospace;
      letter-spacing: 0.05em;
    }

    /* Video Play Button Overlay */
    .play-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.28);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s ease;
    }

    .card:hover .play-overlay {
      background: rgba(0, 0, 0, 0.12);
    }

    .play-circle {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(220, 38, 38, 0.95);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
      transition: transform 0.2s ease, background-color 0.2s ease;
    }

    .card:hover .play-circle {
      transform: scale(1.12);
      background: #dc2626;
    }

    .play-circle svg {
      width: 20px;
      height: 20px;
      fill: #ffffff;
      stroke: none;
      margin-left: 2px;
    }

    .top-save-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 3;
      transition: all 0.15s ease;
    }

    .top-save-btn:hover {
      transform: scale(1.08);
    }

    .top-save-btn.saved {
      background: var(--save-accent);
      color: #090d16;
      border-color: var(--save-accent);
    }

    .card-body {
      padding: 15px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .card-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.74rem;
      color: var(--text-muted);
      margin-bottom: 6px;
      font-weight: 600;
    }

    .publisher-wrap {
      display: flex;
      align-items: center;
      gap: 5px;
      color: var(--text-main);
    }

    .verified-badge {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--primary);
      color: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      font-weight: 800;
    }

    .card-title {
      font-size: 0.98rem;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.4;
      margin-bottom: 8px;
    }

    .card-desc {
      font-size: 0.83rem;
      color: var(--text-body);
      line-height: 1.5;
      margin-bottom: 12px;
      flex: 1;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Per-Card AI Summary Box */
    .card-ai-box {
      display: none;
      background: var(--ai-soft);
      border: 1px solid var(--ai-border);
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 12px;
      font-size: 0.8rem;
      color: var(--text-main);
      animation: fadeSlide 0.2s ease;
    }

    .card-ai-box.open {
      display: block;
    }

    .card-ai-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--ai-accent);
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .card-ai-box ul {
      padding-left: 16px;
      display: grid;
      gap: 4px;
      color: var(--text-body);
    }

    .card-footer {
      border-top: 1px solid var(--border);
      padding-top: 11px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .card-btns {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .btn-card {
      display: inline-flex;
      align-items: center;

      border: 1px dashed var(--border);
      border-radius: var(--radius);
      padding: 48px 20px;

    }

    .empty-box p {
      color: var(--text-muted);
      font-size: 0.85rem;
      margin-bottom: 16px;
    }

    .skeleton {
      background: linear-gradient(90deg, var(--surface-2) 25%, var(--surface-3) 50%, var(--surface-2) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
    }

    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }

    /* Toast Notification */
    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 600;
      background: var(--text-main);

  function toggleBookmark(idx) {
    const list = getFilteredFeed();
    const item = list[idx];
    if (!item) return;

    const id = getArticleId(item);
    const existingIndex = bookmarks.findIndex(b => getArticleId(b) === id);

    if (existingIndex > -1) {
      bookmarks.splice(existingIndex, 1);

      showToast('Removed from Bookmarks');

      if (currentTab === 'bookmarks') {
        stopAudio();
        renderCards();
        return;
      }
    } else {
      bookmarks.unshift({
        ...item,
        savedAt: new Date().toISOString()
      });
      saveBookmarksToStorage();
      showToast(item.mediaType === 'video' ? 'Video saved to Bookmarks' : 'Article saved to Bookmarks');
    }

    const nowSaved = isBookmarked(item);
    const topBtn = document.getElementById(`top-save-${idx}`);
    const footBtn = document.getElementById(`foot-save-${idx}`);
    if (topBtn) {
      topBtn.className = `top-save-btn ${nowSaved ? 'saved' : ''}`;

  // Text Sanitization
  function escapeHTML(str) {
    if (!str) return '';
    return str.replace(/[&<>"']/g, m => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[m]));
  }

  function cleanText(txt) {
    if (!txt) return '';
    return txt
      .replace(/<!\[CDATA\[([\s\S]*?)\]\]>/gi, '$1')
      .replace(/<[^>]*>/g, ' ')
      .replace(/&nbsp;/gi, ' ')
      .replace(/&amp;/gi, '&')
      .replace(/&quot;/gi, '"')
      .replace(/&#39;/gi, "'")
      .replace(/https?:\/\/\S+/gi, '')
      .replace(/\[\+\d+\s+chars\]/gi, '')
      .replace(/\s+/g, ' ')
      .trim();
  }

  function formatTime(dateStr) {
    if (!dateStr) return 'Live';
    const d = new Date(dateStr);
    if (isNaN(d.getTime())) return 'Live';
    const mins = Math.floor((Date.now() - d.getTime()) / 60000);
    if (mins < 60) return `${Math.max(1, mins)}m ago`;
    const hrs = Math.floor(mins / 60);
    if (hrs < 24) return `${hrs}h ago`;
    return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  }

  // AI Summarizer Engine
  function generateSmartAISummary(item) {
    const rawTitle = cleanText(item.title).replace(/\s+-\s+[^-]+$/, '');
    const rawDesc = cleanText(item.description || '');
    const source = item.source?.name || activeChannel.name;

    const sentences = rawDesc
      .split(/(?<=[.!?])\s+/)
      .map(s => s.trim())
      .filter(s => s.length > 20 && s.toLowerCase() !== rawTitle.toLowerCase());

    const bullet1 = rawTitle;
    const bullet2 = sentences[0] || `Broadcast reporting published by ${source} network.`;
    const bullet3 = sentences[1] || `Key facts and regional context verified for this report.`;

    return {
      bullets: [bullet1, bullet2, bullet3],
      speech: `${item.mediaType === 'video' ? 'Video News Summary' : 'Summary'}: ${bullet1}. ${bullet2}`
    };
  }

  // Audio Engine
  function loadVoices() {
    if (!synth) return;
    const allVoices = synth.getVoices();
    englishVoices = allVoices.filter(v => v.lang.startsWith('en'));
    if (!englishVoices.length) return;

    const selectEl = document.getElementById('voiceSelect');
    selectEl.innerHTML = '';

    const preferred = ['en-IN', 'India', 'Google', 'Natural', 'Online', 'Siri', 'Samantha'];
    englishVoices.sort((a, b) => {
      const aScore = preferred.some(k => a.name.includes(k) || a.lang.includes(k)) ? 1 : 0;
      const bScore = preferred.some(k => b.name.includes(k) || b.lang.includes(k)) ? 1 : 0;
      return bScore - aScore;
    });

    englishVoices.forEach((voice, i) => {
      const opt = document.createElement('option');
      opt.value = i;
      opt.textContent = `${voice.name} (${voice.lang})`;
      selectEl.appendChild(opt);
    });

    selectedVoice = englishVoices[0];
    selectEl.value = 0;
    selectEl.onchange = (e) => {
      selectedVoice = englishVoices[e.target.value];
    };
  }

  loadVoices();
  if (speechSynthesis.onvoiceschanged !== undefined) {
    speechSynthesis.onvoiceschanged = loadVoices;
  }

  function highlightSpeakingCard(idx) {
    activeSpeakingIdx = idx;
    document.querySelectorAll('.card').forEach((card, i) => {

  function setStudioControls(playing, hasNext) {
    document.getElementById('pauseBtn').disabled = !playing;
    document.getElementById('nextBtn').disabled = !hasNext;
    const eq = document.getElementById('eqBars');
    if (playing) eq.classList.add('playing');
    else {
      eq.classList.remove('playing');
      document.getElementById('pauseBtn').innerText = 'Pause';
    }
  }

  function playQueue(items) {
    if (!('speechSynthesis' in window)) {
      alert("Speech playback is not supported on this browser.");
      return;
    }
    stopAudio(false);
    isCancelled = false;
    audioQueue = items;
    currentQueuePos = 0;
    playNextInQueue();
  }

  function playNextInQueue() {
    if (isCancelled || currentQueuePos < 0 || currentQueuePos >= audioQueue.length) {
      stopAudio(true);
      return;
    }

    const item = audioQueue[currentQueuePos];
    const utterance = new SpeechSynthesisUtterance(item.text);

    if (selectedVoice) {
      utterance.voice = selectedVoice;
      utterance.lang = selectedVoice.lang;
    } else {
      utterance.lang = 'en-IN';
    }

    utterance.rate = parseFloat(document.getElementById('speedSelect').value) || 1.0;

    utterance.onstart = () => {
      document.getElementById('audioStatus').innerText = item.status || 'Playing...';
      highlightSpeakingCard(item.articleIndex);
      setStudioControls(true, currentQueuePos < audioQueue.length - 1);
    };

    utterance.onend = () => {
      if (isCancelled) return;
      currentQueuePos++;
      if (currentQueuePos < audioQueue.length) playNextInQueue();
      else stopAudio(true);
    };

    utterance.onerror = () => {
      if (!isCancelled) stopAudio(true);
    };

    synth.speak(utterance);
  }

  function stopAudio(resetText = true) {
    isCancelled = true;
    audioQueue = [];
    currentQueuePos = -1;
    if (synth) synth.cancel();
    highlightSpeakingCard(null);
    setStudioControls(false, false);
    if (resetText) {
      document.getElementById('audioStatus').innerText = 'Audio Anchor Ready';
    }
  }

  function togglePause() {
    if (!synth) return;
    const pauseBtn = document.getElementById('pauseBtn');
    const eq = document.getElementById('eqBars');
    if (synth.paused) {
      synth.resume();
      pauseBtn.innerText = 'Pause';
      eq.classList.add('playing');
    } else if (synth.speaking) {
      synth.pause();
      pauseBtn.innerText = 'Resume';
      eq.classList.remove('playing');
    }
  }

  function skipNext() {
    if (currentQueuePos < audioQueue.length - 1) {
      isCancelled = true;
      synth.cancel();
      isCancelled = false;
      currentQueuePos++;
      playNextInQueue();
    }
  }

  function readAllTopNews() {
    const list = getFilteredFeed();
    if (!list.length) return;

    const subset = list.slice(0, 5);
    const label = currentTab === 'bookmarks' ? 'Saved Bookmarks' : activeChannel.name;
    const queue = [{
      text: `Top ${subset.length} briefings from ${label}.`,
      status: `Starting ${label} Brief...`,
      articleIndex: null
    }];

    subset.forEach((item, idx) => {
      const s = generateSmartAISummary(item);
      queue.push({
        text: `Headline ${idx + 1}: ${s.speech}`,
        status: `(${idx + 1}/${subset.length}) ${cleanText(item.title)}`,
        articleIndex: idx
      });
    });

    queue.push({
      text: 'End of news briefing.',
      status: 'Briefing Complete',
      articleIndex: null
    });

    playQueue(queue);
  }

  // Live News Text Fetcher
  async function fetchTextNews(searchQuery) {
    // 1. Try local serverless /api/news proxy
    if (searchQuery || activeChannel.useBackend || activeCategory !== 'all') {
      try {
        let url = `/api/news?category=${activeCategory}`;
        if (searchQuery) url += `&q=${encodeURIComponent(searchQuery)}`;
        const res = await fetch(url);
        const data = await res.json();
        if (data.status === 'ok' && Array.isArray(data.articles) && data.articles.length > 0) {
          return data.articles.filter(a => a.title && !a.title.includes('[Removed]')).map((art, idx) => ({
            ...art,
            mediaType: 'text',
            verified: true,
            urlToImage: art.urlToImage || FALLBACK_IMAGES[idx % FALLBACK_IMAGES.length]
          }));
        }
      } catch (e) {}
    }

    // 2. Verified RSS stream via rss2json
    try {
      let rssToFetch = activeChannel.rss;
      if (searchQuery) {
        const gl = activeCountry.code === 'in' ? 'IN' : 'US';
        const hl = activeCountry.code === 'in' ? 'en-IN' : 'en-US';
        rssToFetch = `https://news.google.com/rss/search?q=${encodeURIComponent(searchQuery)}&hl=${hl}&gl=${gl}&ceid=${gl}:en`;
      } else if (activeCategory !== 'all' && activeCategory !== 'general') {
        const gl = activeCountry.code === 'in' ? 'IN' : 'US';
        const hl = activeCountry.code === 'in' ? 'en-IN' : 'en-US';
        rssToFetch = `https://news.google.com/rss/search?q=${encodeURIComponent(activeChannel.name + ' ' + activeCategory)}&hl=${hl}&gl=${gl}&ceid=${gl}:en`;
      }

      const res = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssToFetch)}`);
      const data = await res.json();
      if (data.status === 'ok' && Array.isArray(data.items) && data.items.length > 0) {
        return data.items.map((item, idx) => {
          let img = item.enclosure?.link || item.thumbnail || '';
          if (!img && item.description) {
            const m = item.description.match(/<img[^>]+src=["']([^"'>]+)["']/i);
            if (m) img = m[1];
          }
          return {
            source: { name: activeChannel.name },
            title: cleanText(item.title),
            description: cleanText(item.description || item.content || ''),
            url: item.link,
            urlToImage: img || FALLBACK_IMAGES[idx % FALLBACK_IMAGES.length],
            publishedAt: item.pubDate,
            mediaType: 'text',
            verified: true
          };
        });
      }
    } catch (e) {}

    return [];
  }

  // Live Video News Fetcher (Uses Invidious / YouTube RSS APIs)
  async function fetchVideoNews(searchQuery) {
    const queryPart = searchQuery || activeChannel.ytQuery || 'News live broadcast';
    const catPart = activeCategory !== 'all' ? activeCategory : '';
    const fullQuery = `${queryPart} ${catPart}`.trim();

    // 1. Fetch live YouTube video feeds via Public Invidious API
    try {
      const invidiousInstances = [
        'https://inv.tux.pizza',
        'https://invidious.nerdvpn.de',
        'https://vid.puffyan.us'
      ];
      const targetInstance = invidiousInstances[0];
      const url = `${targetInstance}/api/v1/search?q=${encodeURIComponent(fullQuery)}&type=video&sort_by=relevance`;
      
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 4000);
      const res = await fetch(url, { signal: controller.signal });
      clearTimeout(timer);

      const videos = await res.json();
      if (Array.isArray(videos) && videos.length > 0) {
        return videos.slice(0, 8).map(v => {
          const lengthSec = v.lengthSeconds || 240;
          const mins = Math.floor(lengthSec / 60);
          const secs = String(lengthSec % 60).padStart(2, '0');
          return {
            source: { name: v.author || activeChannel.name },
            title: cleanText(v.title),
            description: cleanText(v.description || `Verified video coverage from ${v.author}.`),
            url: `https://www.youtube.com/watch?v=${v.videoId}`,
            videoId: v.videoId,
            urlToImage: v.videoThumbnails?.find(t => t.quality === 'high')?.url || `https://i.ytimg.com/vi/${v.videoId}/hqdefault.jpg`,
            publishedAt: new Date(v.published * 1000).toISOString(),
            duration: `${mins}:${secs}`,
            mediaType: 'video',
            verified: true
          };
        });
      }
    } catch (e) {}

    // 2. Fallback: Parse Official YouTube Channel RSS
    try {
      const chId = activeChannel.ytChannel || 'UCZFMm1mMw0F81Z37aaSuT_Q';
      const ytRss = `https://www.youtube.com/feeds/videos.xml?channel_id=${chId}`;
      const res = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(ytRss)}`);
      const data = await res.json();
      if (data.status === 'ok' && Array.isArray(data.items) && data.items.length > 0) {
        return data.items.map(v => {
          const vId = v.guid?.replace('yt:video:', '') || v.link?.split('v=')[1] || '';
          return {
            source: { name: v.author || activeChannel.name },
            title: cleanText(v.title),
            description: cleanText(v.description || `Official video dispatch from ${v.author}.`),
            url: v.link,
            videoId: vId,
            urlToImage: `https://i.ytimg.com/vi/${vId}/hqdefault.jpg`,
            publishedAt: v.pubDate,
            duration: '04:12',
            mediaType: 'video',
            verified: true
          };
        });
      }
    } catch (e) {}

    return [];
  }

  // Master Synchronizer: Combines Text & Video into a Unified Stream
  async function fetchNews(searchQuery = '') {
    if (currentTab === 'bookmarks') {
      switchTab('feed');
    }
    stopAudio();
    showSkeletons();

    const [textArticles, videoArticles] = await Promise.all([
      fetchTextNews(searchQuery),
      fetchVideoNews(searchQuery)
    ]);

    liveTextArticles = textArticles;
    liveVideoArticles = videoArticles;

    // Intelligent Interleaving: Insert 1 video item every 2-3 text items
    const merged = [];
    let tIdx = 0;
    let vIdx = 0;

    while (tIdx < liveTextArticles.length || vIdx < liveVideoArticles.length) {
      // Add 2 text articles
      if (tIdx < liveTextArticles.length) merged.push(liveTextArticles[tIdx++]);
      if (tIdx < liveTextArticles.length) merged.push(liveTextArticles[tIdx++]);

      // Interleave 1 video broadcast
      if (vIdx < liveVideoArticles.length) merged.push(liveVideoArticles[vIdx++]);
    }

    combinedFeed = merged.length ? merged : [...liveTextArticles, ...liveVideoArticles];
    renderCards();
    updateFeedStatsPill();
  }

  // Category Switcher
  document.getElementById('categoryGroup').addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (btn) {
      document.querySelectorAll('#categoryGroup button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeCategory = btn.dataset.cat;
      document.getElementById('searchInput').value = '';
      document.getElementById('aiBriefPanel').classList.remove('open');
      fetchNews();
    }
  });

  function triggerSearch() {
    const q = document.getElementById('searchInput').value.trim();
    if (q) fetchNews(q);
  }

  document.getElementById('searchInput').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') triggerSearch();
  });

  // App Initialization
  updateBookmarkBadge();
  renderCountryStrip();
  renderChannelStrip();
  fetchNews();
</script>
</body>
