<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>World & India Live News | Multi-Channel Audio Reader</title>
  <style>
    :root {
      --bg: #f1f5f9;
      --surface: #ffffff;
      --surface-subtle: #f8fafc;
      --text-main: #0f172a;
      --text-body: #334155;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --primary: #2563eb;
      --primary-soft: rgba(37, 99, 235, 0.1);
      --accent-india: #ea580c;
      --audio-bg: rgba(255, 255, 255, 0.95);
      --audio-border: #bfdbfe;
      --danger: #ef4444;
      --card-shadow: 0 2px 10px rgba(15, 23, 42, 0.05);
    }

    body.dark {
      --bg: #0b1120;
      --surface: #1e293b;
      --surface-subtle: #0f172a;
      --text-main: #f8fafc;
      --text-body: #cbd5e1;
      --text-muted: #94a3b8;
      --border: #334155;
      --primary: #3b82f6;
      --primary-soft: rgba(59, 130, 246, 0.18);
      --audio-bg: rgba(30, 41, 59, 0.95);
      --audio-border: #3b82f6;
      --card-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text-body);
      padding: 16px 14px 70px 14px;
      transition: background-color 0.2s, color 0.2s;
    }

    .container {
      max-width: 1160px;
      margin: 0 auto;
    }

    /* Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .brand-wrap h1 {
      font-size: 1.7rem;
      color: var(--text-main);
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .live-badge {
      font-size: 0.7rem;
      font-weight: 800;
      text-transform: uppercase;
      background: #ef4444;
      color: #fff;
      padding: 3px 8px;
      border-radius: 99px;
      letter-spacing: 0.05em;
      animation: pulseBadge 1.8s infinite;
    }

    @keyframes pulseBadge {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.55; }
    }

    .brand-wrap p {
      color: var(--text-muted);
      font-size: 0.88rem;
      margin-top: 3px;
    }

    .header-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .btn-top {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: var(--card-shadow);
    }

    /* Sticky Audio Player */
    .audio-bar {
      position: sticky;
      top: 10px;
      z-index: 100;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      background: var(--audio-bg);
      border: 1px solid var(--audio-border);
      padding: 12px 16px;
      border-radius: 14px;
      margin-bottom: 18px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }

    .audio-status-wrap {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
      min-width: 250px;
    }

    .audio-status {
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .voice-picker-wrap {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .voice-select, .speed-select {
      padding: 5px 8px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--surface);
      font-size: 0.8rem;
      outline: none;
      color: var(--text-main);
    }

    .voice-select {
      max-width: 210px;
    }

    .audio-btns {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .btn-audio, .btn-control, .btn-stop {
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
    }

    .btn-audio {
      background: var(--primary);
      color: #fff;
    }

    .btn-control {
      background: var(--surface);
      color: var(--text-main);
      border: 1px solid var(--border);
    }

    .btn-control:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .btn-stop {
      background: var(--danger);
      color: #fff;
    }

    /* Multi-Country & Channel Control Hub */
    .controls-panel {
      background: var(--surface);
      padding: 16px;
      border-radius: 14px;
      box-shadow: var(--card-shadow);
      border: 1px solid var(--border);
      margin-bottom: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .control-row {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .row-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .control-label {
      font-weight: 700;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
    }

    .active-channel-indicator {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--primary);
    }

    /* Horizontal Scrollable Strips for Countries & Channels */
    .scroll-strip {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: thin;
    }

    .scroll-strip::-webkit-scrollbar {
      height: 5px;
    }

    .scroll-strip::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 99px;
    }

    .btn-country, .btn-channel, .btn-chip {
      padding: 7px 14px;
      border: 1px solid var(--border);
      background: var(--surface-subtle);
      border-radius: 99px;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-body);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-country:hover, .btn-channel:hover, .btn-chip:hover {
      border-color: var(--primary);
    }

    .btn-country.active {
      background: var(--text-main);
      color: var(--surface);
      border-color: var(--text-main);
    }

    .btn-channel.active {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.25);
    }

    .btn-chip.active {
      background: var(--primary-soft);
      color: var(--primary);
      border-color: var(--primary);
    }

    .channel-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
    }

    /* Search & Filter Bar */
    .search-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding-top: 4px;
      border-top: 1px solid var(--border);
    }

    .search-box {
      display: flex;
      flex: 1;
      min-width: 240px;
      gap: 8px;
    }

    .search-box input {
      flex: 1;
      padding: 9px 12px;
      border: 1px solid var(--border);
      background: var(--surface-subtle);
      color: var(--text-main);
      border-radius: 8px;
      font-size: 0.88rem;
      outline: none;
    }

    .search-box input:focus {
      border-color: var(--primary);
    }

    .search-box button {
      padding: 9px 18px;
      background: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }

    /* News Grid & Cards */
    .news-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(305px, 1fr));
      gap: 18px;
    }

    .card {
      background: var(--surface);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: var(--card-shadow);
      display: flex;
      flex-direction: column;
      border: 2px solid var(--border);
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
    }

    .card:hover {
      transform: translateY(-3px);
    }

    .card.speaking {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.18);
    }

    .card-img-wrap {
      width: 100%;
      height: 168px;
      background: linear-gradient(135deg, #1e293b, #334155);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #cbd5e1;
      font-size: 0.9rem;
      font-weight: 700;
      text-align: center;
      padding: 12px;
    }

    .card-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .channel-pill-overlay {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(15, 23, 42, 0.82);
      color: #ffffff;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.7rem;
      font-weight: 700;
      backdrop-filter: blur(6px);
    }

    .card-body {
      padding: 15px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .card-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .source-tag {
      font-size: 0.74rem;
      font-weight: 800;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .card-date {
      font-size: 0.74rem;
      color: var(--text-muted);
    }

    .card-title {
      font-size: 0.98rem;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.38;
      margin-bottom: 8px;
    }

    .card-desc {
      font-size: 0.85rem;
      color: var(--text-body);
      line-height: 1.5;
      margin-bottom: 14px;
      flex: 1;
    }

    .card-footer {
      border-top: 1px solid var(--border);
      padding-top: 11px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .card-actions {
      display: flex;
      gap: 6px;
    }

    .btn-card-listen, .btn-card-queue {
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 5px 11px;
      font-size: 0.78rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-weight: 600;
      color: var(--text-main);
    }

    .card.speaking .btn-card-listen {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }

    .btn-card-queue.queued {
      background: #dcfce7;
      border-color: #86efac;
      color: #166534;
    }

    .read-more {
      color: var(--primary);
      text-decoration: none;
      font-weight: 700;
      font-size: 0.82rem;
    }

    /* Skeleton Loader */
    .skeleton {
      animation: pulse 1.4s infinite ease-in-out;
      background: var(--surface-subtle);
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }

    .status-msg {
      text-align: center;
      padding: 40px 10px;
      color: var(--text-muted);
      font-size: 0.95rem;
      grid-column: 1 / -1;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div class="brand-wrap">
      <h1>
        World & India News Hub
        <span class="live-badge">● Live Channels</span>
      </h1>
      <p>Stream headlines from India & international news networks with instant voice summaries</p>
    </div>
    <div class="header-actions">
      <button class="btn-top" onclick="fetchNews()">🔄 Refresh Feed</button>
      <button class="btn-top" id="themeToggle" onclick="toggleTheme()">🌙 Dark Mode</button>
    </div>
  </header>

  <!-- Sticky Audio Bar -->
  <div class="audio-bar">
    <div class="audio-status-wrap">
      <span class="audio-status" id="audioStatus">🎙 Audio Reader: Ready</span>
      <div class="voice-picker-wrap">
        <label for="voiceSelect">Anchor Voice:</label>
        <select id="voiceSelect" class="voice-select"></select>
        <label for="speedSelect">Speed:</label>
        <select id="speedSelect" class="speed-select">
          <option value="0.9">0.9x</option>
          <option value="1" selected>1.0x</option>
          <option value="1.15">1.15x</option>
          <option value="1.3">1.3x</option>
          <option value="1.5">1.5x</option>
        </select>
      </div>
    </div>
    <div class="audio-btns">
      <button class="btn-audio" onclick="readAllTopNews()">🔊 Listen Top 5 Brief</button>
      <button class="btn-control" id="queuePlayBtn" onclick="playSavedQueue()" disabled>📋 Saved Queue (0)</button>
      <button class="btn-control" id="pauseBtn" onclick="togglePause()" disabled>⏸ Pause</button>
      <button class="btn-control" id="nextBtn" onclick="skipNext()" disabled>⏭ Next</button>
      <button class="btn-stop" onclick="stopAudio()">⏹ Stop</button>
    </div>
  </div>

  <!-- Country, News Channel & Category Controls -->
  <div class="controls-panel">
    <!-- 1. Country Selector -->
    <div class="control-row">
      <div class="row-header">
        <span class="control-label">1. Select Country / Region</span>
        <span class="active-channel-indicator" id="currentSelectionLabel">🇮🇳 India • All Indian Channels</span>
      </div>
      <div class="scroll-strip" id="countryStrip"></div>
    </div>

    <!-- 2. News Channel Selector (Dynamically updates per Country) -->
    <div class="control-row">
      <div class="row-header">
        <span class="control-label">2. Choose News Channel / Network</span>
      </div>
      <div class="scroll-strip" id="channelStrip"></div>
    </div>

    <!-- 3. Category Filter -->
    <div class="control-row">
      <div class="row-header">
        <span class="control-label">3. Topic Category</span>
      </div>
      <div class="scroll-strip" id="categoryGroup">
        <button class="btn-chip active" data-cat="general">Top Headlines</button>
        <button class="btn-chip" data-cat="business">Business & Economy</button>
        <button class="btn-chip" data-cat="technology">Technology</button>
        <button class="btn-chip" data-cat="sports">Sports & Cricket</button>
        <button class="btn-chip" data-cat="science">Science & Space</button>
        <button class="btn-chip" data-cat="entertainment">Entertainment</button>
        <button class="btn-chip" data-cat="health">Health</button>
      </div>
    </div>

    <!-- 4. Search Box -->
    <div class="search-row">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search across channels (e.g., ISRO, Sensex, Cricket, AI, Parliament)...">
        <button onclick="triggerSearch()">Search</button>
      </div>
    </div>
  </div>

  <!-- News Grid -->
  <div class="news-grid" id="newsGrid"></div>
</div>

  // App State
  let activeCountryObj = COUNTRY_DIRECTORY[0]; // Default: India 🇮🇳
  let activeChannelObj = activeCountryObj.channels[0];
  let activeCategory = 'general';
  let fetchedArticles = [];
  let savedQueueIndices = [];

  // Speech Synthesis State
  const synth = window.speechSynthesis;
  let englishVoices = [];
  let selectedVoice = null;
  let audioQueue = [];
  let currentQueuePos = -1;
  let activeArticleIndex = null;
  let isCancelled = false;

  // Theme Init
  if (localStorage.getItem('newsTheme') === 'dark') {
    document.body.classList.add('dark');
    document.getElementById('themeToggle').innerText = '☀️ Light Mode';
  }

  function toggleTheme() {
    document.body.classList.toggle('dark');
    const isDark = document.body.classList.contains('dark');
    localStorage.setItem('newsTheme', isDark ? 'dark' : 'light');
    document.getElementById('themeToggle').innerText = isDark ? '☀️ Light Mode' : '🌙 Dark Mode';
  }

  // Speed Init
  const speedSelect = document.getElementById('speedSelect');
  const savedSpeed = localStorage.getItem('newsVoiceSpeed');
  if (savedSpeed) speedSelect.value = savedSpeed;
  speedSelect.onchange = () => localStorage.setItem('newsVoiceSpeed', speedSelect.value);

  // Voice Loader (Prioritizes Indian English & High-Quality Voices)
  function loadVoices() {
    if (!synth) return;
    const allVoices = synth.getVoices();
    englishVoices = allVoices.filter(v => v.lang.startsWith('en'));
    if (englishVoices.length === 0) return;

    const selectEl = document.getElementById('voiceSelect');
    selectEl.innerHTML = '';

    const qualityKeywords = ['en-IN', 'India', 'Google', 'Natural', 'Online', 'Siri', 'Samantha', 'Rishi', 'Neerja'];
    englishVoices.sort((a, b) => {
      const aScore = qualityKeywords.some(k => a.name.includes(k) || a.lang.includes(k)) ? 1 : 0;
      const bScore = qualityKeywords.some(k => b.name.includes(k) || b.lang.includes(k)) ? 1 : 0;
      return bScore - aScore;
    });

    const savedVoiceName = localStorage.getItem('newsVoiceName');
    let defaultIndex = 0;

    englishVoices.forEach((voice, index) => {
      const option = document.createElement('option');
      option.value = index;
      option.textContent = `${voice.name} (${voice.lang})`;
      selectEl.appendChild(option);
      if (savedVoiceName && voice.name === savedVoiceName) {
        defaultIndex = index;
      }
    });

    selectedVoice = englishVoices[defaultIndex];
    selectEl.value = defaultIndex;

    selectEl.onchange = (e) => {
      selectedVoice = englishVoices[e.target.value];
      localStorage.setItem('newsVoiceName', selectedVoice.name);
    };
  }

  loadVoices();
  if (speechSynthesis.onvoiceschanged !== undefined) {
    speechSynthesis.onvoiceschanged = loadVoices;
  }

  // Helpers
  function escapeHTML(str) {
    if (!str) return '';
    return str.replace(/[&<>"']/g, m => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[m]));
  }

  function cleanText(txt) {
    if (!txt) return '';
    return txt
      .replace(/<[^>]*>/g, ' ')
      .replace(/&nbsp;/gi, ' ')
      .replace(/&amp;/gi, '&')
      .replace(/&quot;/gi, '"')
      .replace(/&#39;/gi, "'")
      .replace(/https?:\/\/\S+/gi, '')
      .replace(/\[\+\d+\s+chars\]/gi, '')
      .replace(/\s+/g, ' ')
      .trim();
  }

  function formatRelativeTime(dateString) {
    if (!dateString) return 'Live';
    const date = new Date(dateString);
    if (isNaN(date.getTime())) return 'Live';
    const diffMins = Math.floor((Date.now() - date.getTime()) / 60000);
    if (diffMins < 60) return `${Math.max(1, diffMins)}m ago`;
    const diffHours = Math.floor(diffMins / 60);
    if (diffHours < 24) return `${diffHours}h ago`;
    return date.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  }

  // Audio Queue Engine (Fixes Chrome 15s cutoff)
  function updateCardHighlight(articleIdx) {
    activeArticleIndex = articleIdx;
    document.querySelectorAll('.card').forEach((card, idx) => {
      const btn = card.querySelector('.btn-card-listen');
      if (idx === articleIdx) {
        card.classList.add('speaking');
        if (btn) btn.innerHTML = '⏹ Stop';
        card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      } else {
        card.classList.remove('speaking');
        if (btn) btn.innerHTML = '🔊 Listen';
      }
    });
  }

  function setControlsState(isPlaying, hasNext = false) {
    const pauseBtn = document.getElementById('pauseBtn');
    const nextBtn = document.getElementById('nextBtn');
    pauseBtn.disabled = !isPlaying;
    nextBtn.disabled = !hasNext;
    if (!isPlaying) pauseBtn.innerText = '⏸ Pause';
  }

  function playQueue(items) {
    if (!('speechSynthesis' in window)) {
      alert("Voice playback is not supported on this browser.");
      return;
    }
    stopAudio(false);
    isCancelled = false;
    audioQueue = items;
    currentQueuePos = 0;
    playCurrentQueueItem();
  }

  function playCurrentQueueItem() {
    if (isCancelled || currentQueuePos < 0 || currentQueuePos >= audioQueue.length) {
      stopAudio(true);
      return;
    }

    const item = audioQueue[currentQueuePos];
    const utterance = new SpeechSynthesisUtterance(item.text);

    if (selectedVoice) {
      utterance.voice = selectedVoice;
      utterance.lang = selectedVoice.lang;
    } else {
      utterance.lang = activeCountryObj.code === 'in' ? 'en-IN' : 'en-US';
    }

    utterance.rate = parseFloat(speedSelect.value) || 1.0;
    utterance.pitch = 1.0;

    utterance.onstart = () => {
      document.getElementById('audioStatus').innerText = item.status || "🔊 Playing summary...";
      updateCardHighlight(item.articleIndex);
      setControlsState(true, currentQueuePos < audioQueue.length - 1);
    };

    utterance.onend = () => {
      if (isCancelled) return;
      currentQueuePos++;
      if (currentQueuePos < audioQueue.length) {
        playCurrentQueueItem();
      } else {
        stopAudio(true);
      }
    };

    utterance.onerror = () => {
      if (!isCancelled) stopAudio(true);
    };

    synth.speak(utterance);
  }

  function stopAudio(resetStatus = true) {
    isCancelled = true;
    audioQueue = [];
    currentQueuePos = -1;
    if (synth) synth.cancel();
    updateCardHighlight(null);
    setControlsState(false, false);
    if (resetStatus) {
      document.getElementById('audioStatus').innerText = "🎙 Audio Reader: Ready";
    }
  }

  function togglePause() {
    if (!synth) return;
    const pauseBtn = document.getElementById('pauseBtn');
    if (synth.paused) {
      synth.resume();
      pauseBtn.innerText = '⏸ Pause';
      document.getElementById('audioStatus').innerText = "🔊 Resumed playback...";
    } else if (synth.speaking) {
      synth.pause();
      pauseBtn.innerText = '▶ Resume';
      document.getElementById('audioStatus').innerText = "⏸ Audio Paused";
    }
  }

  function skipNext() {
    if (currentQueuePos < audioQueue.length - 1) {
      isCancelled = true;
      synth.cancel();
      isCancelled = false;
      currentQueuePos++;
      playCurrentQueueItem();
    }
  }

  function readAllTopNews() {
    if (!fetchedArticles.length) {
      alert("No news available to read.");
      return;
    }

    const queue = [{
      text: `Here are the top 5 headlines from ${activeChannelObj.name}.`,
      status: `🎙 Starting ${activeChannelObj.name} Brief...`,
      articleIndex: null
    }];

    fetchedArticles.slice(0, 5).forEach((art, idx) => {
      const title = cleanText(art.title);
      const desc = cleanText(art.description);
      queue.push({
        text: `Headline ${idx + 1}: ${title}. ${desc}`,
        status: `🔊 (${idx + 1}/5) ${title}`,
        articleIndex: idx
      });
    });

    queue.push({
      text: "This concludes your news bulletin.",
      status: "🎙 Bulletin finished",
      articleIndex: null
    });

    playQueue(queue);
  }

  function readSingleArticle(index) {
    if (activeArticleIndex === index) {
      stopAudio();
      return;
    }
    const art = fetchedArticles[index];
    if (!art) return;
    const title = cleanText(art.title);
    const desc = cleanText(art.description);
    playQueue([{
      text: `${title}. ${desc}`,
      status: `🔊 Reading: ${title}`,
      articleIndex: index
    }]);
  }

  // Saved Queue ("Listen Later")
  function toggleQueueArticle(index) {
    const pos = savedQueueIndices.indexOf(index);
    if (pos === -1) savedQueueIndices.push(index);
    else savedQueueIndices.splice(pos, 1);

    const btn = document.getElementById('queuePlayBtn');
    btn.innerText = `📋 Saved Queue (${savedQueueIndices.length})`;
    btn.disabled = savedQueueIndices.length === 0;
    renderArticles();
  }

  function playSavedQueue() {
    if (!savedQueueIndices.length) return;
    const queue = [{
      text: `Playing your ${savedQueueIndices.length} queued news stories.`,
      status: "📋 Playing Saved Queue...",
      articleIndex: null
    }];

    savedQueueIndices.forEach((artIdx, i) => {
      const art = fetchedArticles[artIdx];
      if (!art) return;
      queue.push({
        text: `${cleanText(art.title)}. ${cleanText(art.description)}`,
        status: `📋 Queue (${i + 1}/${savedQueueIndices.length}): ${cleanText(art.title)}`,
        articleIndex: artIdx
      });
    });

    playQueue(queue);
  }

  // Skeletons & Article Cards
  function showSkeletons() {
    const grid = document.getElementById('newsGrid');
    grid.innerHTML = Array.from({ length: 6 }).map(() => `
      <div class="card">
        <div class="card-img-wrap skeleton"></div>
        <div class="card-body">
          <div class="skeleton" style="height: 14px; width: 40%; border-radius: 4px; margin-bottom: 12px;"></div>
          <div class="skeleton" style="height: 20px; width: 95%; border-radius: 4px; margin-bottom: 8px;"></div>
          <div class="skeleton" style="height: 20px; width: 75%; border-radius: 4px; margin-bottom: 16px;"></div>
          <div class="skeleton" style="height: 50px; width: 100%; border-radius: 4px;"></div>
        </div>
      </div>
    `).join('');
  }

  function renderArticles() {
    const grid = document.getElementById('newsGrid');
    grid.innerHTML = '';

    if (!fetchedArticles.length) {
      grid.innerHTML = `<div class="status-msg">No articles found for ${escapeHTML(activeChannelObj.name)}. Try another channel or category.</div>`;
      return;
    }

    fetchedArticles.forEach((article, idx) => {
      const sourceName = escapeHTML(article.source?.name || activeChannelObj.name);
      const dateStr = formatRelativeTime(article.publishedAt);
      const title = escapeHTML(cleanText(article.title));
      const rawDesc = cleanText(article.description);
      const desc = escapeHTML(rawDesc && rawDesc !== cleanText(article.title) ? rawDesc : 'Click Read to view the full story from this channel.');
      const isQueued = savedQueueIndices.includes(idx);

      const card = document.createElement('div');
      card.className = `card ${activeArticleIndex === idx ? 'speaking' : ''}`;
      card.innerHTML = `
        <div class="card-img-wrap">
          <span class="channel-pill-overlay">${activeCountryObj.flag} ${sourceName}</span>
          ${article.urlToImage
            ? `<img src="${escapeHTML(article.urlToImage)}" alt="News thumbnail" loading="lazy" onerror="this.outerHTML='<span>📺 ${sourceName}</span>'">`
            : `<span>📺 ${sourceName}</span>`
          }
        </div>
        <div class="card-body">
          <div class="card-meta">
            <span class="source-tag">${sourceName}</span>
            <span class="card-date">${dateStr}</span>
          </div>
          <h2 class="card-title">${title}</h2>
          <p class="card-desc">${desc}</p>
          <div class="card-footer">
            <div class="card-actions">
              <button class="btn-card-listen" onclick="readSingleArticle(${idx})">
                ${activeArticleIndex === idx ? '⏹ Stop' : '🔊 Listen'}
              </button>
              <button class="btn-card-queue ${isQueued ? 'queued' : ''}" onclick="toggleQueueArticle(${idx})">
                ${isQueued ? '✓ Saved' : '➕ Queue'}
              </button>
            </div>
            <a href="${escapeHTML(article.url)}" class="read-more" target="_blank" rel="noopener noreferrer">Read &rarr;</a>
          </div>
        </div>
      `;
      grid.appendChild(card);
    });
  }

  /**
   * DIRECT CHANNEL RSS FETCHER (Fallback & Channel-Specific Live Stream)
   * Ensures every single Indian & Global channel works even if NewsAPI free tier blocks it.
   */
  async function fetchDirectChannelFeed(query = '') {
    let rssUrl = activeChannelObj.rss;

    // If user typed a search query or picked a specific category on an "All" channel, use Google News RSS for that country/domain
    const countryCode = activeCountryObj.code === 'global' ? 'US' : activeCountryObj.code.toUpperCase();
    const langCode = activeCountryObj.code === 'in' ? 'en-IN' : `en-${countryCode}`;

    if (query) {
      const domainFilter = activeChannelObj.domain ? `site:${activeChannelObj.domain}+` : '';
      rssUrl = `https://news.google.com/rss/search?q=${domainFilter}${encodeURIComponent(query)}&hl=${langCode}&gl=${countryCode}&ceid=${countryCode}:en`;
    } else if (activeCategory !== 'general' && activeChannelObj.id === 'all') {
      rssUrl = `https://news.google.com/rss/headlines/section/topic/${activeCategory.toUpperCase()}?hl=${langCode}&gl=${countryCode}&ceid=${countryCode}:en`;
    } else if (activeCategory !== 'general' && activeChannelObj.domain) {
      rssUrl = `https://news.google.com/rss/search?q=site:${activeChannelObj.domain}+${encodeURIComponent(activeCategory)}&hl=${langCode}&gl=${countryCode}&ceid=${countryCode}:en`;
    }

    const rss2JsonUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}`;
    const res = await fetch(rss2JsonUrl);
    const data = await res.json();

    if (data.status !== 'ok' || !data.items) {
      throw new Error('Channel RSS unavailable');
    }

    return data.items.map(item => {
      // Extract image from enclosure, thumbnail, or description HTML
      let img = item.enclosure?.link || item.thumbnail || '';
      if (!img && item.description) {
        const match = item.description.match(/<img[^>]+src="([^">]+)"/i);
        if (match) img = match[1];
      }
      return {
        source: { name: activeChannelObj.id === 'all' ? (item.author || data.feed?.title || activeCountryObj.name + ' News') : activeChannelObj.name },
        title: item.title,
        description: cleanText(item.description || item.content || ''),
        url: item.link,
        urlToImage: img,
        publishedAt: item.pubDate
      };
    });
  }

  // Primary Fetch Function (Tries /api/news first, then seamlessly falls back to Live Channel RSS)
  async function fetchNews(query = '') {
    stopAudio();
    showSkeletons();
    savedQueueIndices = [];
    document.getElementById('queuePlayBtn').innerText = '📋 Saved Queue (0)';
    document.getElementById('queuePlayBtn').disabled = true;

    try {
      // If a specific channel is chosen, or if /api/news doesn't support that channel, try /api/news with params first
      const params = new URLSearchParams({
        country: activeCountryObj.code === 'global' ? 'us' : activeCountryObj.code,
        category: activeCategory
      });
      if (activeChannelObj.sourceId) params.set('sources', activeChannelObj.sourceId);
      if (activeChannelObj.domain) params.set('domain', activeChannelObj.domain);
      if (query) params.set('q', query);

      let articles = [];

      // If user selected a dedicated Indian or Global channel that relies on direct feed, fetch live channel feed directly
      if (activeChannelObj.id !== 'all') {
        articles = await fetchDirectChannelFeed(query);
      } else {
        // Try serverless /api/news first
        const response = await fetch(`/api/news?${params.toString()}`);
        const data = await response.json();
        if (data.status === 'ok' && data.articles && data.articles.length > 0) {
          articles = data.articles.filter(a => a.title && !a.title.includes('[Removed]'));
        } else {
          articles = await fetchDirectChannelFeed(query);
        }
      }

      fetchedArticles = articles;
      renderArticles();
    } catch (err) {
      // Fallback to direct channel RSS if /api/news fails or is rate-limited
      try {
        fetchedArticles = await fetchDirectChannelFeed(query);
        renderArticles();
      } catch (fallbackErr) {
        document.getElementById('newsGrid').innerHTML =
          '<div class="status-msg" style="color: #ef4444;">Unable to load channel feed right now. Please try another news channel.</div>';
      }
    }
  }

  // Category Listener
  document.getElementById('categoryGroup').addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (btn) {
      document.querySelectorAll('#categoryGroup button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeCategory = btn.dataset.cat;
      document.getElementById('searchInput').value = '';
      fetchNews();
    }
  });

  function triggerSearch() {
    const query = document.getElementById('searchInput').value.trim();
    if (query) fetchNews(query);
  }

  document.getElementById('searchInput').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') triggerSearch();
  });

  // Initialize UI & Load India News Default
  renderCountryStrip();
  renderChannelStrip();
  updateSelectionLabel();
  fetchNews();
</script>
